      // ------------------------------------------------------- life tab
      function roundStartAt(round) {
        const start = round.entries.filter((entry) => entry.kind === "round_start").pop();
        if (start !== undefined) return start.at;
        return round.entries.length > 0 ? round.entries[0].at : null;
      }
      function roundEndEntry(round) {
        return round.entries.filter((entry) => entry.kind === "round_end").pop() || null;
      }
      function paintRoundList() {
        const host = $("roundList");
        for (const button of document.querySelectorAll('[data-act="life-range"]')) {
          button.classList.toggle("active", Number(button.dataset.range) === lifeRange);
        }
        const rounds = roundCache.rounds;
        const key = `${roundCache.agent}|${roundCache.range}|` + rounds.map((r) => `${r.round}:${r.entries.length}`).join(",");
        if (host.dataset.key === key) return;
        host.dataset.key = key;
        repaint(
          host,
          rounds.length === 0
            ? '<div class="empty small">还没有黑匣子记录。</div>'
            : rounds
                .slice()
                .reverse()
                .map((round) => {
                  const start = roundStartAt(round);
                  const end = roundEndEntry(round);
                  const reason = end === null ? null : end.endReason;
                  const label = end === null ? '<span class="tag ok">进行中</span>' : `<span class="${reason === "final" ? "tag ok" : reason === "model_error" ? "tag bad" : "tag warn"}">${esc(END_REASON[reason] || reason)}</span>`;
                  const duration = end === null ? "进行中" : durText(end.at - (start === null ? end.at : start));
                  return `
                    <div class="round-item ${round.round === roundSel ? "active" : ""}" data-act="round-select" data-round="${round.round}">
                      <div class="r1"><strong>第 ${round.round} 轮</strong><span class="grow"></span>${label}</div>
                      <div class="sub small muted">${timeHtml(start)} · 时长 ${esc(duration)}</div>
                    </div>`;
                })
                .join(""),
        );
      }
      function summarizeTool(result) {
        if (result === null) return "没有工具结果";
        let parsed = null;
        try {
          parsed = JSON.parse(result.content);
        } catch (error) {
          parsed = null;
        }
        let text;
        if (parsed !== null && typeof parsed === "object") {
          if (parsed.ok === false) {
            text = "失败：" + String(parsed.error === undefined ? "未知错误" : parsed.error);
          } else {
            const parts = [];
            for (const key of Object.keys(parsed)) {
              if (key === "ok") continue;
              const value = parsed[key];
              parts.push(key + "=" + (typeof value === "object" && value !== null ? JSON.stringify(value) : String(value)));
            }
            text = parts.length === 0 ? "成功" : parts.join("，");
          }
        } else {
          text = String(result.content).replace(/\s+/g, " ");
        }
        return text.length > 110 ? text.slice(0, 110) + "…" : text;
      }
      function eventDetail(entry) {
        switch (entry.kind) {
          case "meal":
            return `价格 ${entry.price} · 恢复 ${entry.gained} · 余额 ${entry.balance}`;
          case "meal_refused":
            return `余额 ${entry.balance} 买不起价格 ${entry.price}`;
          case "task_claimed":
          case "claim_expired":
          case "task_submitted":
            return String(entry.taskId);
          case "income_reported":
            return `${entry.where} · ${entry.amount} ${entry.currency}`;
          case "message_to_operator":
            return String(entry.text === undefined ? "" : entry.text);
          case "worker_log":
            return `[${entry.level}] ${entry.message}`;
          case "worker_note":
            return String(entry.type);
          case "agent_created":
            return `模型 ${entry.model}`;
          case "intervention":
            return `${entry.kind} ${entry.amount}`;
          default:
            return JSON.stringify(entry);
        }
      }
      function roundDetailHtml(round) {
        const entries = round.entries;
        const start = roundStartAt(round);
        const end = roundEndEntry(round);
        const results = new Map();
        for (const entry of entries) {
          if (entry.kind === "tool_result") results.set(entry.callId, entry);
        }
        const parts = [];
        parts.push(
          `<div class="row"><strong style="font-size: 15px">第 ${round.round} 轮</strong>${
            end === null
              ? '<span class="tag ok">进行中</span>'
              : `<span class="${end.endReason === "final" ? "tag ok" : end.endReason === "model_error" ? "tag bad" : "tag warn"}">${esc(END_REASON[end.endReason] || end.endReason)}</span>`
          }<span class="small muted">开始 ${timeHtml(start)} · 结束 ${timeHtml(end === null ? null : end.at)} · 时长 ${esc(end === null ? "—" : durText(end.at - (start === null ? end.at : start)))}</span></div>`,
        );
        if (end !== null && end.error) {
          parts.push(`<div class="banner danger">${esc(end.error)}</div>`);
        }
        for (const entry of entries) {
          if (entry.kind === "assistant_message") {
            const content = entry.message === undefined || entry.message === null ? null : entry.message.content;
            if (typeof content === "string" && content.trim() !== "") {
              parts.push(`<div><div class="say">${esc(content)}</div><div class="say meta">Agent · ${timeHtml(entry.at)}</div></div>`);
            }
            continue;
          }
          if (entry.kind === "tool_call") {
            const result = results.get(entry.callId) || null;
            let failed = result !== null && result.isError === true;
            if (!failed && result !== null) {
              try {
                const parsed = JSON.parse(result.content);
                failed = parsed !== null && typeof parsed === "object" && parsed.ok === false;
              } catch (error) {
                failed = false;
              }
            }
            parts.push(`
              <details class="tool-item ${failed ? "bad" : ""}">
                <summary><strong>调用了 <code>${esc(entry.name)}</code></strong><span class="tool-sum">${esc(summarizeTool(result))}</span></summary>
                <div class="small muted">参数</div>
                <pre class="mono">${esc(entry.argumentsJson)}</pre>
                <div class="small muted" style="margin-top: 6px">完整结果</div>
                <pre class="mono">${esc(result === null ? "（没有结果）" : result.content)}</pre>
              </details>`);
            continue;
          }
          if (entry.kind === "round_end") {
            const reply = entry.finalReply;
            if (typeof reply === "string" && reply.trim() !== "") {
              parts.push(`<div class="final"><div class="label">最终回复</div><pre>${esc(reply)}</pre></div>`);
            }
            continue;
          }
        }
        const context = entries.filter((entry) => entry.kind === "context").pop();
        if (context !== undefined) {
          parts.push(`
            <details>
              <summary>本轮醒来时注入的上下文</summary>
              <div class="small muted">system（身体手册）</div>
              <pre class="mono">${esc(context.system)}</pre>
              <div class="small muted" style="margin-top: 6px">user（MEMORY、身体状态、任务板、留言）</div>
              <pre class="mono">${esc(context.user)}</pre>
            </details>`);
        }
        const usageEntries = entries.filter((entry) => entry.kind === "usage");
        const missing = entries.filter((entry) => entry.kind === "usage_missing");
        const usageRow = (source) => {
          const list = usageEntries.filter((entry) => entry.source === source);
          if (list.length === 0) return `<div class="kv"><span class="k">${source === "agent" ? "agent 模型" : "memory 模型"}</span><span class="num">没有用量记录</span></div>`;
          const prompt = list.reduce((sum, entry) => sum + (typeof entry.promptTokens === "number" ? entry.promptTokens : 0), 0);
          const completion = list.reduce((sum, entry) => sum + (typeof entry.completionTokens === "number" ? entry.completionTokens : 0), 0);
          return `<div class="kv"><span class="k">${source === "agent" ? "agent 模型" : "memory 模型"}</span><span class="num">提示 ${prompt} · 完成 ${completion}</span></div>`;
        };
        parts.push(`
          <details>
            <summary>token 用量</summary>
            ${usageRow("agent")}
            ${usageRow("memory")}
            ${missing.length > 0 ? `<div class="small" style="color: var(--danger)">有 ${missing.length} 次用量缺失（记 0）</div>` : ""}
          </details>`);
        const memoryNew = entries.filter((entry) => entry.kind === "memory_new").pop();
        const memoryRejected = entries.filter((entry) => entry.kind === "memory_rejected").pop();
        const memoryError = entries.filter((entry) => entry.kind === "memory_error").pop();
        const memoryMissing = entries.filter((entry) => entry.kind === "usage_missing" && entry.source === "memory").pop();
        let memoryHtml;
        if (memoryNew !== undefined) {
          memoryHtml = `<div class="small" style="color: var(--accent)">本轮记忆已更新</div><pre class="mono">${esc(memoryNew.text)}</pre>`;
        } else if (memoryRejected !== undefined) {
          memoryHtml = `<div class="small" style="color: var(--danger)">记忆整合被拒绝：${esc(memoryRejected.reason)}（MEMORY 保持不变）</div>`;
        } else if (memoryError !== undefined) {
          memoryHtml = `<div class="small" style="color: var(--danger)">记忆模型出错：${esc(memoryError.message)}</div>`;
        } else if (memoryMissing !== undefined) {
          memoryHtml = '<div class="small" style="color: var(--danger)">记忆模型没有报告用量，这一轮没有折进 MEMORY。</div>';
        } else {
          memoryHtml = '<div class="small muted">这一轮没有记忆整合记录。</div>';
        }
        parts.push(`<details><summary>本轮记忆整合结果</summary>${memoryHtml}</details>`);
        const events = entries.filter((entry) =>
          [
            "meal",
            "meal_refused",
            "task_claimed",
            "task_submitted",
            "income_reported",
            "message_to_operator",
            "worker_log",
            "worker_note",
            "claim_expired",
            "worker_problem",
          ].indexOf(entry.kind) >= 0,
        );
        if (events.length > 0) {
          parts.push(
            `<details><summary>本轮其它事件（${events.length}）</summary>${events
              .map(
                (entry) =>
                  `<div class="event-line">${timeHtml(entry.at)} · ${esc(EVENT_LABEL[entry.kind] || entry.kind)}${eventDetail(entry) === "" ? "" : " · " + esc(eventDetail(entry))}</div>`,
              )
              .join("")}</details>`,
          );
        }
        parts.push(
          `<details><summary>原始黑匣子记录（${entries.length} 条）</summary><pre class="mono">${esc(
            entries.map((entry) => JSON.stringify(entry)).join("\n"),
          )}</pre></details>`,
        );
        return parts.join("");
      }
      function paintRoundDetail() {
        const host = $("roundDetail");
        const round = roundCache.rounds.find((item) => item.round === roundSel) || null;
        if (round === null) {
          if (host.dataset.key !== "none") {
            host.dataset.key = "none";
            repaint(host, '<div class="empty small">左边选一轮看过程。</div>');
          }
          return;
        }
        const last = round.entries.length > 0 ? round.entries[round.entries.length - 1] : null;
        const key = `${round.round}|${round.entries.length}|${last === null ? 0 : last.at}`;
        if (host.dataset.key === key) return;
        host.dataset.key = key;
        repaint(host, roundDetailHtml(round));
      }

      // ----------------------------------------------------- body tab
      function paintBody() {
        const agent = agentByName(dlgAgent);
        if (agent === null || state === null) return;
        const config = state.config;
        const ratio = ratioOf(agent.satiety, agent.satietyMax);
        const secondsToZero =
          typeof agent.satiety === "number" && config.satietyDecayPerSecond > 0
            ? agent.satiety / config.satietyDecayPerSecond
            : null;
        const meals = config.mealPrice > 0 ? Math.floor(agent.balance / config.mealPrice) : null;
        const tokens = agent.tokens;
        repaint(
          $("bodyPane"),
          `
          <div class="card col-stack">
            <div class="kv"><span class="k">饱食度</span><span class="num" style="font-size: 18px">${esc(num(agent.satiety))} / ${esc(num(agent.satietyMax))}</span></div>
            <div class="bar" style="height: 14px"><span style="width: ${(ratio * 100).toFixed(1)}%; background: ${satietyColor(ratio)}"></span></div>
            <div class="kv"><span class="k">以当前速度饿到 0</span><span>${esc(secondsToZero === null ? "—" : durText(secondsToZero * 1000))}</span></div>
            <div class="kv"><span class="k">余额</span><span class="num">${esc(num(agent.balance))}</span></div>
            <div class="kv"><span class="k">当前余额够吃</span><span>${meals === null ? "—" : meals + " 顿（每顿 " + num(config.mealPrice) + "，恢复 " + num(config.satietyPerMeal) + "）"}</span></div>
            <div class="kv"><span class="k">出生时间</span><span>${timeHtml(agent.bornAt)}</span></div>
            <div class="kv"><span class="k">模型</span><span class="mono small">${esc(agent.model)}</span></div>
            <div class="kv"><span class="k">上次唤醒</span><span>${timeHtml(agent.lastWakeAt)}</span></div>
            <div class="kv"><span class="k">上次一轮结束</span><span>${timeHtml(agent.lastRoundAt)}${agent.lastRoundEndReason ? "（" + esc(END_REASON[agent.lastRoundEndReason] || agent.lastRoundEndReason) + "）" : ""}</span></div>
            <div class="kv"><span class="k">累计 token（agent）</span><span class="num">提示 ${tokens.agent.promptTokens} · 完成 ${tokens.agent.completionTokens}（${tokens.agent.records} 次）</span></div>
            <div class="kv"><span class="k">累计 token（memory）</span><span class="num">提示 ${tokens.memory.promptTokens} · 完成 ${tokens.memory.completionTokens}（${tokens.memory.records} 次）</span></div>
            ${agent.lastError ? `<div class="banner danger">最近错误：${esc(agent.lastError)}</div>` : ""}
          </div>
          <div class="card col-stack">
            <div style="font-weight: 600">干预操作</div>
            <div class="small muted">给余额或给饱食度会永久记录为操作员干预。它会改变这两个数字，但不会改变饱食度自然下降的规则。</div>
            <div class="row">
              <button class="btn" data-act="give-balance" data-agent="${esc(agent.name)}">给余额</button>
              <button class="btn" data-act="give-satiety" data-agent="${esc(agent.name)}">给饱食度</button>
            </div>
          </div>`,
        );
      }

      // --------------------------------------------------- memory tab
      function paintMemory() {
        const host = $("memoryText");
        if (memCache.agent !== dlgAgent) return;
        const cap = state === null ? 0 : state.config.memoryCapChars;
        const text = memCache.memory;
        $("memStats").textContent = `当前 ${text.length} 字 / 上限 ${cap} 字${text.length > cap ? "（已超出上限）" : ""}`;
        const lines = text === "" ? ["（MEMORY 为空）"] : text.replace(/\r\n/g, "\n").split("\n");
        repaint(
          host,
          lines
            .map((line, index) =>
              index < 2
                ? `<div class="mem-line mem-born">${esc(line)}${index === 0 ? '<span class="hint">出生记录</span>' : ""}</div>`
                : `<div class="mem-line">${esc(line)}</div>`,
            )
            .join(""),
        );
        paintMemRecords();
        paintMemCompare();
      }
      function paintMemRecords() {
        const host = $("memRecords");
        const records = memCache.records;
        repaint(
          host,
          records.length === 0
            ? '<div class="empty small">还没有记忆整合记录。</div>'
            : records
                .map(
                  (record) => `
                    <div class="list-item ${memSel !== null && memSel.round === record.round && memSel.kind === record.entry.kind ? "active" : ""}"
                         data-act="mem-record" data-round="${record.round}" data-kind="${esc(record.entry.kind)}">
                      <div class="row"><span class="title grow">${esc(MEM_KIND[record.entry.kind] || record.entry.kind)}</span><span class="tag">第 ${record.round} 轮</span></div>
                      <div class="sub">${timeHtml(record.entry.at)}${record.entry.reason ? " · " + esc(record.entry.reason) : ""}</div>
                    </div>`,
                )
                .join(""),
        );
      }
      function paintMemCompare() {
        const host = $("memCompare");
        if (memSel === null) {
          host.innerHTML = '<div class="small muted">点左边的记录，看那一次的新旧版本。</div>';
          return;
        }
        const record = memCache.records.find((item) => item.round === memSel.round && item.entry.kind === memSel.kind) || null;
        if (record === null) {
          host.innerHTML = '<div class="small muted">这条记录已经不在最近的记录里了。</div>';
          return;
        }
        const oldEntry = record.entries.filter((entry) => entry.kind === "memory_old").pop();
        const newEntry = record.entries.filter((entry) => entry.kind === "memory_new").pop();
        const responseEntry = record.entries.filter((entry) => entry.kind === "memory_response").pop();
        const before = oldEntry === undefined ? "（没有旧版本记录）" : oldEntry.text;
        const after =
          newEntry !== undefined
            ? newEntry.text
            : responseEntry !== undefined
              ? responseEntry.enforced
              : null;
        host.innerHTML = `
          <div class="card col-stack">
            <div class="row"><strong>第 ${record.round} 轮 · ${esc(MEM_KIND[record.entry.kind] || record.entry.kind)}</strong><span class="small muted">${timeHtml(record.entry.at)}</span></div>
            ${record.entry.reason ? `<div class="banner warn">拒绝原因：${esc(record.entry.reason)}</div>` : ""}
            ${record.entry.message ? `<div class="banner danger">${esc(record.entry.message)}</div>` : ""}
            ${record.entry.source === "memory" && record.entry.kind === "usage_missing" ? '<div class="banner danger">记忆模型没有报告用量，MEMORY 未改变。</div>' : ""}
            <div class="small muted">旧版本（这一轮开始前）</div>
            <pre class="mono">${esc(before)}</pre>
            <div class="small muted">新版本${after === null ? "（没有写出新版本，MEMORY 保持不变）" : ""}</div>
            <pre class="mono">${esc(after === null ? "—" : after)}</pre>
          </div>`;
      }

      // ------------------------------------------------- notebook tab
      function paintNotebook() {
        if (nbCache.agent !== dlgAgent) return;
        const host = $("nbFiles");
        repaint(
          host,
          nbCache.files.length === 0
            ? '<div class="empty small">记事本还是空的。</div>'
            : nbCache.files
                .map(
                  (file) =>
                    `<button class="btn tiny nb-file ${file.path === nbCache.path ? "active" : ""}" data-act="nb-file" data-path="${esc(file.path)}">${esc(file.path)}（${file.size} 字节）</button>`,
                )
                .join(""),
        );
        const content = $("nbContent");
        if (nbCache.path === null) {
          content.textContent = "还没有文件。";
          return;
        }
        const top = content.scrollTop;
        content.textContent = nbCache.content === "" ? "(空文件)" : nbCache.content;
        content.scrollTop = top;
      }

      // --------------------------------------------------- messages tab
      function paintChat() {
        const host = $("chatList");
        const agent = agentByName(dlgAgent);
        if (agent === null) return;
        const messages = messagesFor(agent.name)
          .slice()
          .sort((a, b) => a.at - b.at || a.id - b.id);
        if (dlgTab === "messages") {
          let changed = false;
          for (const message of messages) {
            if (message.sender === agent.name && message.readAt === null && !readMarks.has(markOf(message))) {
              readMarks.add(markOf(message));
              changed = true;
            }
          }
          if (changed) {
            saveReadMarks();
            paintNav();
            paintAgentsPage();
          }
        }
        const key = messages.map((message) => `${message.id}:${message.readAt}`).join("|");
        if (host.dataset.key === key) return;
        const nearBottom = host.scrollHeight - host.scrollTop - host.clientHeight < 80;
        const previousTop = host.scrollTop;
        const hadContent = host.dataset.key !== undefined;
        host.dataset.key = key;
        host.innerHTML =
          messages.length === 0
            ? '<div class="empty small">还没有留言。下面写第一句。</div>'
            : messages
                .map(
                  (message) => `
                    <div class="msg ${message.sender === "operator" ? "op" : ""}">
                      <div class="who">${esc(message.sender === "operator" ? "操作员" : message.sender)} · ${timeHtml(message.at)}</div>
                      <div class="body">${esc(message.body)}</div>
                    </div>`,
                )
                .join("");
        if (!hadContent || nearBottom) host.scrollTop = host.scrollHeight;
        else host.scrollTop = previousTop;
      }

      // ------------------------------------------------- agent task tab
      function paintAgentTasks() {
        const agent = agentByName(dlgAgent);
        if (agent === null || state === null) return;
        const tasks = state.tasks.filter((task) => task.claimedBy === agent.name);
        repaint(
          $("agentTasks"),
          tasks.length === 0
            ? '<div class="empty small">这个 Agent 还没有认领过任务。</div>'
            : tasks
                .map(
                  (task) => `
                    <div class="card">
                      <div class="row"><strong class="grow">${esc(task.title)}</strong><span class="${taskTagClass(task.status)}">${esc(TASK_STATUS[task.status] || task.status)}</span><span class="tag">${esc(num(task.price))}</span></div>
                      <div class="small muted">${esc(task.id)} · 认领 ${timeHtml(task.claimedAt)} · 提交 ${timeHtml(task.submittedAt)}</div>
                      ${task.deliverable ? `<pre class="mono" style="max-height: 140px">${esc(task.deliverable)}</pre>` : ""}
                      <div class="row"><button class="btn tiny" data-act="agent-task" data-task="${esc(task.id)}">去全局任务板审核</button></div>
                    </div>`,
                )
                .join(""),
        );
      }
      function paintAgentInterventions() {
        const agent = agentByName(dlgAgent);
        if (agent === null || state === null) return;
        const rows = state.interventions.filter((row) => row.agent === agent.name).slice().reverse();
        repaint($("agentInt"), interventionRowsHtml(rows));
      }

      // ------------------------------------------------------------ actions
      async function runAction(act, target) {
        if (act === "nav") {
          goPage(target.dataset.page);
          // The cards need each agent's latest reply, which only this poll fetches.
          if (target.dataset.page === "agents") void refresh();
          return;
        }
        if (act === "open-agent") {
          openAgent(target.dataset.agent, "life");
          return;
        }
        if (act === "dlg-close") {
          closeAgent();
          return;
        }
        if (act === "dlg-tab") {
          if (dlgAgent !== null) openAgent(dlgAgent, target.dataset.tab);
          return;
        }
        if (act === "notice-close") {
          dismissedNotices.add(target.dataset.key);
          paintNotices();
          paintAgentsPage();
          return;
        }
        if (act === "wake") {
          const agent = target.dataset.agent || dlgAgent;
          if (agent === null) return;
          const body = await post("/api/wake", { agent });
          if (body.woken === false) alert(body.note || "该 agent 正在一轮中，已跳过");
          await refresh();
          return;
        }
        if (act === "slot-create") {
          const input = document.querySelector(`input[data-slot="${target.dataset.slot}"]`);
          const name = input === null ? "" : input.value.trim();
          if (name === "") {
            alert("请填写名字");
            return;
          }
          await post("/api/agents", { name });
          if (input !== null) input.value = "";
          slotDrafts[target.dataset.slot] = "";
          await refresh();
          return;
        }
        if (act === "post-task") {
          const title = $("taskTitle").value.trim();
          const description = $("taskDesc").value;
          const rawPrice = $("taskPrice").value.trim();
          const price = Number(rawPrice);
          if (title === "") {
            alert("请填写标题");
            return;
          }
          if (rawPrice === "" || !Number.isFinite(price) || price < 0) {
            alert("请填写价格（不小于 0 的数字）");
            return;
          }
          await post("/api/tasks", { title, description, price });
          $("taskTitle").value = "";
          $("taskDesc").value = "";
          $("taskPrice").value = "";
          await refresh();
          return;
        }
        if (act === "task-filter") {
          taskFilter = target.dataset.filter;
          taskSel = null;
          paintTasksPage();
          return;
        }
        if (act === "task-select") {
          taskSel = target.dataset.task;
          paintTasksPage();
          return;
        }
        if (act === "task-review") {
          await post(`/api/tasks/${encodeURIComponent(target.dataset.task)}/review`, { decision: target.dataset.decision });
          await refresh();
          return;
        }
        if (act === "income-select") {
          incomeSel = Number(target.dataset.report);
          incomeKey = null;
          paintIncomePage();
          return;
        }
        if (act === "income-verify") {
          if (state !== null && state.exchangeRate === null) {
            alert("汇率未设定：请在 conservatory.config.json 里设置 exchangeRate 后再核验入账");
            return;
          }
          if (incomeSel === null) return;
          const input = $("verifyAmount");
          const raw = input === null ? "" : input.value.trim();
          const amount = Number(raw);
          if (raw === "" || !Number.isFinite(amount) || amount < 0) {
            alert("请填写核实金额（不小于 0 的数字）");
            return;
          }
          await post(`/api/income/${incomeSel}/verify`, { verifiedAmount: amount });
          incomeKey = null;
          await refresh();
          return;
        }
        if (act === "income-reject") {
          if (!confirm("确认驳回这条收入申报？驳回后不入账。")) return;
          await post(`/api/income/${incomeSel}/reject`, {});
          incomeKey = null;
          await refresh();
          return;
        }
        if (act === "life-range") {
          lifeRange = Number(target.dataset.range);
          roundSel = null;
          roundCache = { agent: null, range: null, rounds: [] };
          await loadRounds(dlgAgent, true);
          return;
        }
        if (act === "life-refresh") {
          await loadRounds(dlgAgent, true);
          return;
        }
        if (act === "round-select") {
          roundSel = Number(target.dataset.round);
          paintRoundList();
          paintRoundDetail();
          return;
        }
        if (act === "mem-record") {
          memSel = { round: Number(target.dataset.round), kind: target.dataset.kind };
          paintMemRecords();
          paintMemCompare();
          return;
        }
        if (act === "nb-file") {
          await loadNotebookFile(target.dataset.path);
          return;
        }
        if (act === "send-message") {
          const input = $("chatInput");
          const body = input.value.trim();
          if (dlgAgent === null || body === "") {
            alert("请填写留言");
            return;
          }
          await post("/api/messages", { agent: dlgAgent, body });
          input.value = "";
          await refresh();
          return;
        }
        if (act === "agent-task") {
          taskSel = target.dataset.task;
          taskFilter = "all";
          navigate("#/tasks");
          return;
        }
        if (act === "give-balance" || act === "give-satiety") {
          const kind = act === "give-balance" ? "give_balance" : "give_satiety";
          if (!confirm("这会被永久记录为操作员干预。确认继续？")) return;
          const input = prompt(kind === "give_balance" ? "给多少余额？" : "给多少饱食度？", "10");
          if (input === null) return;
          const amount = Number(input);
          if (!Number.isFinite(amount) || amount <= 0) {
            alert("数量必须是大于 0 的数字");
            return;
          }
          await post("/api/intervene", { agent: target.dataset.agent || dlgAgent, kind, amount });
          await refresh();
          return;
        }
      }

      document.addEventListener("click", (event) => {
        const target = event.target.closest("[data-act]");
        if (target === null) return;
        const act = target.dataset.act;
        void (async () => {
          try {
            await runAction(act, target);
          } catch (error) {
            alertError(error);
          }
        })();
      });
      document.addEventListener("keydown", (event) => {
        const target = event.target;
        if (event.key !== "Enter" || !(target instanceof HTMLElement) || !target.dataset.enter) return;
        if (target.tagName === "TEXTAREA") return;
        event.preventDefault();
        const act = target.dataset.enter;
        const slot = target.dataset.slot;
        void (async () => {
          try {
            await runAction(act, slot === undefined ? target : { dataset: { act, slot } });
          } catch (error) {
            alertError(error);
          }
        })();
      });
      $("intFilter").addEventListener("change", (event) => {
        intFilter = event.target.value;
        paintInterventionsPage();
      });

      // ------------------------------------------------------------ refresh
      async function loadExtras() {
        if (state === null || state.agents.length === 0) {
          extras = {};
          return;
        }
        const entries = await Promise.all(
          state.agents.map(async (agent) => {
            try {
              const body = await api(`/api/agents/${encodeURIComponent(agent.name)}/blackbox?rounds=5`);
              const rounds = body.rounds;
              for (let index = rounds.length - 1; index >= 0; index -= 1) {
                const end = rounds[index].entries.filter((entry) => entry.kind === "round_end").pop();
                if (end !== undefined) {
                  return [
                    agent.name,
                    {
                      finalReply: typeof end.finalReply === "string" ? end.finalReply : "",
                      endReason: typeof end.endReason === "string" ? end.endReason : "",
                      round: rounds[index].round,
                    },
                  ];
                }
              }
              return [agent.name, null];
            } catch (error) {
              return [agent.name, null];
            }
          }),
        );
        extras = {};
        for (const [name, value] of entries) {
          if (value !== null) extras[name] = value;
        }
      }
      async function refresh() {
        if (refreshing) return;
        refreshing = true;
        try {
          state = await api("/api/state");
          refreshError = null;
          if (parseHash().page === "agents" || dlgAgent !== null) {
            await loadExtras();
          }
          paint();
          applyRoute();
          await followNewRounds();
        } catch (error) {
          refreshError = error instanceof Error ? error.message : String(error);
          paintRailFoot();
        } finally {
          refreshing = false;
        }
      }
      async function followNewRounds() {
        if (dlgAgent === null) return;
        const agent = agentByName(dlgAgent);
        if (agent === null) return;
        const seen = loadedRoundAt[dlgAgent];
        if (agent.lastRoundAt === null || seen === undefined || seen === agent.lastRoundAt) return;
        loadedRoundAt[dlgAgent] = agent.lastRoundAt;
        if (dlgTab === "life") await loadRounds(dlgAgent, true);
        else if (dlgTab === "memory") await loadMemory(dlgAgent, true);
        else if (dlgTab === "notebook") await loadNotebook(dlgAgent, true);
      }

      // ------------------------------------------------------------ loading
      async function loadTab(tab, force) {
        if (dlgAgent === null) return;
        if (tab === "life") await loadRounds(dlgAgent, force);
        else if (tab === "memory") await loadMemory(dlgAgent, force);
        else if (tab === "notebook") await loadNotebook(dlgAgent, force);
      }
      async function loadRounds(name, force) {
        if (name === null) return;
        if (!force && roundCache.agent === name && roundCache.range === lifeRange) {
          paintRoundList();
          paintRoundDetail();
          return;
        }
        const host = $("roundList");
        host.dataset.key = "";
        host.innerHTML = '<div class="empty small">读取中…</div>';
        try {
          const body = await api(`/api/agents/${encodeURIComponent(name)}/blackbox?rounds=${lifeRange}`);
          const rounds = body.rounds.filter((round) => round.round !== null);
          roundCache = { agent: name, range: lifeRange, rounds };
          if (roundSel === null || !rounds.some((round) => round.round === roundSel)) {
            roundSel = rounds.length > 0 ? rounds[rounds.length - 1].round : null;
          }
          const agent = agentByName(name);
          if (agent !== null) loadedRoundAt[name] = agent.lastRoundAt;
          paintRoundList();
          paintRoundDetail();
        } catch (error) {
          host.innerHTML = `<div class="empty small">读取失败：${esc(error instanceof Error ? error.message : String(error))}</div>`;
        }
      }
      async function loadMemory(name, force) {
        if (name === null) return;
        if (!force && memCache.agent === name) {
          paintMemory();
          return;
        }
        try {
          const [memory, records] = await Promise.all([
            api(`/api/agents/${encodeURIComponent(name)}/memory`),
            api(`/api/agents/${encodeURIComponent(name)}/blackbox?rounds=50`),
          ]);
          const memoryRecords = [];
          for (const round of records.rounds) {
            for (const entry of round.entries) {
              if (entry.kind === "memory_new" || entry.kind === "memory_rejected" || entry.kind === "memory_error" || entry.kind === "usage_missing") {
                if (entry.kind === "usage_missing" && entry.source !== "memory") continue;
                memoryRecords.push({ round: round.round, entry, entries: round.entries });
              }
            }
          }
          memCache = { agent: name, memory: String(memory.memory || ""), records: memoryRecords.slice(-20).reverse() };
          const current = agentByName(name);
          if (current !== null) loadedRoundAt[name] = current.lastRoundAt;
          if (memSel !== null && !memCache.records.some((r) => r.round === memSel.round && r.entry.kind === memSel.kind)) {
            memSel = null;
          }
          paintMemory();
        } catch (error) {
          $("memoryText").innerHTML = `<div class="empty small">读取失败：${esc(error instanceof Error ? error.message : String(error))}</div>`;
        }
      }
      async function loadNotebook(name, force) {
        if (name === null) return;
        if (!force && nbCache.agent === name) {
          paintNotebook();
          return;
        }
        try {
          const body = await api(`/api/agents/${encodeURIComponent(name)}/notebook`);
          const current = agentByName(name);
          if (current !== null) loadedRoundAt[name] = current.lastRoundAt;
          nbCache = { agent: name, files: body.files, path: nbCache.agent === name ? nbCache.path : null, content: nbCache.agent === name ? nbCache.content : "" };
          if (nbCache.path === null || !body.files.some((file) => file.path === nbCache.path)) {
            nbCache.path = body.files.length > 0 ? body.files[0].path : null;
            nbCache.content = "";
            if (nbCache.path !== null) {
              await loadNotebookFile(nbCache.path);
              return;
            }
          }
          paintNotebook();
        } catch (error) {
          $("nbFiles").innerHTML = `<div class="empty small">读取失败：${esc(error instanceof Error ? error.message : String(error))}</div>`;
        }
      }
      async function loadNotebookFile(path) {
        if (dlgAgent === null || nbLoading) return;
        nbLoading = true;
        try {
          const body = await api(
            `/api/agents/${encodeURIComponent(dlgAgent)}/notebook/file?path=${encodeURIComponent(path)}`,
          );
          nbCache.path = path;
          nbCache.content = String(body.content || "");
          paintNotebook();
        } catch (error) {
          $("nbContent").textContent = "读取失败：" + (error instanceof Error ? error.message : String(error));
        } finally {
          nbLoading = false;
        }
      }

      // ----------------------------------------------------------- bootstrap
      $("dlg").addEventListener("close", () => {
        if (dlgAgent !== null) {
          dlgAgent = null;
          if (window.location.hash !== "#/agents") window.location.hash = "#/agents";
        }
      });
      $("dlg").addEventListener("click", (event) => {
        if (event.target === $("dlg")) closeAgent();
      });
      window.addEventListener("hashchange", applyRoute);
      if (!window.location.hash) window.location.hash = "#/agents";
      applyRoute();
      void refresh();
      setInterval(() => {
        void refresh();
      }, 3000);
    </script>
  </body>
</html>
