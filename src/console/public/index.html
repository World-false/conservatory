    <title>CONSERVATORY · 生物遥测操作台</title>
    <!-- Webfonts are an enhancement, never a dependency: the stylesheet loads
         without blocking first paint, and every stack falls back to the local
         Cascadia / Segoe UI faces when this machine is offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"

    <noscript>
      <link

        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      />
    </noscript>
    <style>
      /* ==========================================================================
         CONSERVATORY · QUIET MICA & PHYSICAL SPECULAR GLASS
         --------------------------------------------------------------------------
         Design metaphor : a precision instrument pod. A near-white paper
                           substrate, translucent Mica panels the light passes
                           through, and one cool accent reserved for whatever the
                           operator has selected. Nothing here shouts; the numbers
                           carry the console.
         Colour budget   : ink, slate and white paint the whole deck. A single
                           deep blue marks activation and selection. Crimson is
                           allowed only at a genuine danger threshold. There is no
                           amber anywhere: a frozen life clock is a calm standby
                           state, never an alarm, and a physical constant is not a
                           warning just because it is worth reading.
         Shape lock      : pill for every button, badge and chip; 14px cards,
                           18px panels.
         Depth           : white is the material, not the absence of it. Depth
                           comes from translucency, a hairline slate border and a
                           single inset white highlight on each top edge.
         Motion          : restrained tactile physics only — a 1px lift, a 2% press
                           and a specular cut-face that catches the light on hover.
                           No sweeps, no glows, no dispersion rainbows.
         Type            : Plus Jakarta Sans / Inter for prose, JetBrains Mono with
                           tabular figures for every number, path and token count.
         ========================================================================== */
      :root {
        /* ----------------------------------------------------------- 画布与云母底板 */
        --bg: #FAFAFA;                            /* 极简通透画卷白 */
        --surface: rgba(255, 255, 255, 0.85);     /* 高透微透云母底板 */
        --surface-blur: blur(20px) saturate(160%);
        --card: #FFFFFF;                          /* 纯白模块卡片 */
        --card-hover: #FFFFFF;
        --line: #E2E8F0;                          /* 纯净石板细分界线 */
        --line-soft: #F1F5F9;
        --line-strong: #CBD5E1;

        /* ----------------------------------------------------------- 文本对比度阶梯 */
        --text: #0F172A;                          /* 深度碳素黑 */
        --text-muted: #64748B;                    /* 沉稳副文本灰 */
        --text-sub: #94A3B8;                      /* 辅助说明灰 */

        /* ----------------------------------------------------------- 唯一主强调色 */
        --accent: #0F172A;                        /* 默认主视觉回归深色极简，不喧宾夺主 */
        --accent-cool: #2563EB;                   /* 仅用于激活状态 / 选中的纯净深蓝 */
        --accent-cool-soft: #EFF6FF;
        --accent-dim: #EFF6FF;                    /* 设置导航激活态的深蓝浅底 */

        /* --------------------------------- 状态静音化：暂停 = Calm Standby，绝非火警 */
        --standby: #475569;                       /* 平静休眠的静谧冰川灰蓝 */
        --standby-soft: #F1F5F9;
        --standby-border: #CBD5E1;

        /* ---------------------------------------- 仅在真正危险时保留的极克制深红 */
        --danger: #DC2626;
        --danger-soft: #FEF2F2;
        --danger-edge: #FECACA;

        /* ---------------------------------------- 正常生命状态保留的极细微翠绿点缀 */
        --alive: #059669;
        --alive-soft: #ECFDF5;

        /* ----------------------------------------------------------- 圆角与物理阴影 */
        --r-pill: 9999px;                         /* 按钮与徽章全弧形全胶囊 */
        --r-card: 14px;
        --r-panel: 18px;
        --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.04), 0 6px 16px -2px rgba(15, 23, 42, 0.02);
        --shadow-hover: 0 4px 20px -2px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04);

        /* --------------------------------------------------------------------
           兼容层：样式表与页面脚本里仍有多处引用旧词汇，因此这些旧名字保留为
           新调色板之上的一层薄翻译，而不是逐条重写规则。

           唯一重要的语义挪动是 `--warn-*`：它不再代表橙黄。休眠状态、逼近阈值
           的读数与普通提示一律留在墨黑 / 石板灰家族里；只有 `--danger-*` 允许
           变红，且只在真正的危险阈值上。

           `--vital-amber` 是刻意留下的墓碑：任何一条残留规则引用它，拿到的是
           平静的冰川灰蓝，橙黄警报因此不可能复活。 -------------------------- */
        --muted: var(--text-muted);
        --secondary: var(--text-muted);
        --accent-hi: var(--accent-cool);
        --accent-edge: rgba(37, 99, 235, 0.34);
        --warn: var(--standby);
        --warn-hi: var(--standby);
        --vital-amber: var(--standby);             /* 墓碑：橙黄警报彻底退场 */
        --vital-green: var(--alive);
        --vital-crimson: var(--danger);
        --danger-hi: var(--danger);
        --danger-dim: var(--danger-soft);
        --shadow-soft: var(--shadow-card);
        --shadow-lift: var(--shadow-hover);
        --glass-inset: inset 0 1px 0 #FFFFFF;     /* 顶边棱光 */
        --glass-border: 1px solid var(--line);
        --sunk: #F8FAFC;                          /* 内凹浅槽 */

        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        --sans: "Plus Jakarta Sans", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", system-ui, sans-serif;
        --mono: "JetBrains Mono", "Cascadia Code", "Cascadia Mono", Consolas, monospace;
      }

      /* ------------------------------------------------------------------ base */
      * { box-sizing: border-box; }
      /* `hidden` must always mean hidden. Several rules below set an explicit
         `display` (`.btn`, `.tag`, `.badge`), and an author `display` beats the
         UA stylesheet's `[hidden] { display: none }` — which silently made
         `node.hidden = true` a no-op and left the dead-agent wake button and
         the "已冻结" tag on screen. This one rule makes the attribute win. */
      [hidden] { display: none !important; }
      html, body { height: 100%; }
      body {
        margin: 0;
        /* One flat, quiet paper white. Depth comes from the Mica panels sitting
           on it, never from a coloured light pool drifting behind them. */
        background: var(--bg);
        color: var(--text);
        font: 14px/1.55 var(--sans);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        overflow: hidden;
      }
      ::selection { background: rgba(37, 99, 235, 0.18); color: var(--text); }
      * { scrollbar-width: thin; scrollbar-color: rgba(148, 163, 184, 0.5) transparent; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.42);
        border: 3px solid transparent;
        background-clip: content-box;
        border-radius: var(--r-pill);
      }
      ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.65); background-clip: content-box; }
      ::-webkit-scrollbar-corner { background: transparent; }

      :where(button, input, textarea, select, summary, [data-act]):focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.32);
        border-radius: var(--r-pill);
      }

      .mono, pre, code, .num {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
        font-feature-settings: "tnum" 1, "zero" 1;
      }
      .small { font-size: 12px; }
      .muted { color: var(--muted); }
      .empty { color: var(--secondary); font-style: normal; letter-spacing: 0.01em; }
      .empty::before { content: "◇ "; color: var(--text-sub); }
      .grow { flex: 1 1 auto; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .col-stack { display: grid; gap: 10px; }
      .contents { display: contents; }

      /* ----------------------------------------------------------------- shell */
      .app { display: flex; height: 100vh; }
      .rail {
        flex: 0 0 232px;
        width: 232px;
        /* Frosted white Mica: the near-white paper behind it stays faintly visible. */
        background: var(--surface);
        backdrop-filter: var(--surface-blur);
        -webkit-backdrop-filter: var(--surface-blur);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }
      /* The glass cut-face down the console's spine: one hairline highlight, no
         tinted light of any kind. */
      .rail::after {
        content: "";
        position: absolute;
        top: 0;
        right: -1px;
        width: 1px;
        height: 100%;
        background: linear-gradient(
          180deg,
          transparent,
          rgba(255, 255, 255, 0.9) 30%,
          rgba(255, 255, 255, 0.2) 70%,
          transparent
        );
        pointer-events: none;
      }
      .brand {
        padding: 17px 16px 14px;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.015em;
        display: flex;
        align-items: center;
        gap: 9px;
        border-bottom: 1px solid var(--line-soft);
      }
      .brand-name { display: block; line-height: 1.15; }
      /* The lockup's mark. It is drawn in `currentColor`, so this light rail gets
         the black cut of the logo and any dark panel that hosts it would get the
         white one. The viewBox is cropped to the artwork itself (plus half the
         26-unit stroke), so a 26px box is filled by the glyph instead of by the
         source file's 1024x1024 of padding. */
      .brand-mark {
        position: relative;
        flex: 0 0 26px;
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        color: var(--text);
      }
      .brand-logo { display: block; width: 26px; height: 26px; }
      /* The vital LED clips onto the mark's corner, so the greenhouse's state
         keeps a home even though the dot's old slot now holds the logo. The ring
         is a border rather than a shadow because the pulse keyframes own the
         element's box-shadow. */
      .brand .vital {
        position: absolute;
        right: -2px;
        bottom: -2px;
        width: 11px;
        height: 11px;
        flex: none;
        border: 2px solid var(--card);
      }
      .brand small {
        display: block;
        font-weight: 500;
        font-size: 9.5px;
        color: var(--secondary);
        letter-spacing: 0.19em;
        text-transform: uppercase;
        margin-top: 2px;
      }
      /* Pulsing vital indicator: the greenhouse is breathing. It now rides the
         corner of the lockup's mark, so it keeps a tight ring in its own colour
         instead of a 10px bloom that would wash across the logo. */
      .vital {
        flex: 0 0 9px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--vital-green);
        box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.16);
        animation: vital-pulse 2.4s var(--ease) infinite;
      }
      /* Standby: the greenhouse is held, not in danger. The lamp simply stops
         breathing and settles into a slate chip — no amber, no alarm halo. */
      .vital.warn { background: var(--standby); box-shadow: none; animation: none; }
      .vital.bad { background: var(--danger); box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.18); animation-duration: 1s; }

      .nav { flex: 1; overflow: auto; padding: 10px 9px 8px; }
      .nav-item {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        height: 38px;
        padding: 0 13px;
        border-radius: var(--r-pill);
        cursor: pointer;
        color: var(--muted);
        user-select: none;
        font-size: 13.5px;
        border: 1px solid transparent;
        transition: background 0.22s var(--ease), color 0.22s var(--ease), border-color 0.22s var(--ease),
          box-shadow 0.22s var(--ease), transform 0.22s var(--ease);
      }
      .nav-item + .nav-item { margin-top: 3px; }
      /* The active marker is a lit pill rail, not a bar: it reads on white. */
      .nav-item::before {
        content: "";
        position: absolute;
        left: 4px;
        top: 50%;
        width: 3px;
        height: 0;
        border-radius: var(--r-pill);
        background: var(--accent-cool);
        box-shadow: none;
        transform: translateY(-50%);
        transition: height 0.24s var(--ease);
      }
      .nav-item:hover {
        background: #FFFFFF;
        border-color: var(--line);
        color: var(--text);
        box-shadow: var(--shadow-card), var(--glass-inset);
      }
      .nav-item:hover::before { height: 15px; background: var(--line-strong); box-shadow: none; }
      .nav-item.active {
        background: linear-gradient(90deg, rgba(37, 99, 235, 0.09), rgba(37, 99, 235, 0.025) 62%, transparent);
        border-color: rgba(37, 99, 235, 0.18);
        color: var(--accent-cool);
        font-weight: 600;
        box-shadow: var(--glass-inset);
      }
      .nav-item.active::before { height: 20px; background: var(--accent-cool); box-shadow: none; }
      .nav-item svg {
        width: 16px;
        height: 16px;
        flex: 0 0 16px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.9;
      }
      .nav-item.active svg { opacity: 1; }
      .nav-label { flex: 1; }

      /* --------------------------------------------------- rail bottom deck */
      /* Settings lives here — pinned under the telemetry at the very base of the
         rail — so it reads as an operator-wide tool rather than one more page in
         the specimen list. The divider belongs to `.rail-foot` above it. */
      .rail-bottom {
        padding: 8px 9px 10px;
        display: grid;
        gap: 6px;
      }
      /* The operator's one tool, pinned to the base of the rail: a translucent
         Mica pill card rather than one more page in the specimen list. */
      .nav-settings {
        height: 40px;
        padding: 0 13px;
        background: var(--surface);
        backdrop-filter: var(--surface-blur);
        -webkit-backdrop-filter: var(--surface-blur);
        border: 1px solid var(--line);
        box-shadow: var(--shadow-card), var(--glass-inset);
      }
      .nav-settings:hover { border-color: var(--line-strong); background: #FFFFFF; }
      .nav-settings.active {
        background: var(--accent-cool-soft);
        border-color: var(--accent-edge);
        color: var(--accent-cool);
        box-shadow: var(--glass-inset);
      }
      .nav-settings::before { left: 6px; }

      .badge {
        min-width: 19px;
        height: 19px;
        padding: 0 6px;
        border-radius: var(--r-pill);
        background: var(--text);
        border: 1px solid var(--text);
        color: #FFFFFF;
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
        font-size: 11px;
        line-height: 17px;
        text-align: center;
        font-weight: 600;
      }
      /* A pending-count chip stays quiet slate. Work waiting for review is work
         to do, not a hazard, so it never earns a warning colour. */
      .badge.warn {
        background: var(--standby-soft);
        border-color: var(--standby-border);
        color: var(--standby);
        box-shadow: none;
      }

      /* Micro chip telemetry cluster at the base of the rail. */
      .rail-foot {
        border-top: 1px solid var(--line);
        padding: 11px 13px 13px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.5), rgba(248, 250, 252, 0.28));
        display: grid;
        gap: 6px;
      }
      .rail-chip {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 26px;
        padding: 0 9px;
        border: 1px solid var(--line);
        border-radius: var(--r-pill);
        background: rgba(255, 255, 255, 0.75);
        box-shadow: var(--glass-inset);
        font-size: 11px;
        letter-spacing: 0.02em;
      }
      .rail-chip .chip-k {
        color: var(--secondary);
        text-transform: uppercase;
        font-size: 9.5px;
        letter-spacing: 0.12em;
        white-space: nowrap;
      }
      .rail-chip .chip-v {
        margin-left: auto;
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        font-size: 11.5px;
        color: var(--text);
      }
      .rail-chip .chip-v.accent { color: var(--vital-green); }
      .rail-chip .chip-v.warn { color: var(--warn-hi); }
      .rail-chip .chip-v.bad { color: var(--danger-hi); }
      .rail-chip .chip-v.muted { color: var(--muted); font-weight: 500; }
      .rail-chip .chip-u { color: var(--secondary); font-weight: 500; }
      .rail-chip .led {
        width: 6px;
        height: 6px;
        flex: 0 0 6px;
        border-radius: 50%;
        background: var(--vital-green);
        box-shadow: 0 0 8px rgba(5, 150, 105, 0.7);
      }
      .rail-chip .led.standby { background: var(--standby); box-shadow: 0 0 0 2px var(--standby-soft); }
      .rail-chip .led.red { background: var(--vital-crimson); box-shadow: 0 0 8px rgba(220, 38, 38, 0.7); }
      .rail-error {
        border: 1px solid var(--danger-edge);
        background: var(--danger-dim);
        color: var(--danger-hi);
        border-radius: var(--r-card);
        padding: 6px 9px;
        font-size: 11px;
        line-height: 1.45;
        word-break: break-word;
      }

      .main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }

      /* --------------------------------------------------------------- notices */
      /* Floating frosted toasts, pinned clear of the workspace so a stack of
         alerts never pushes the console around. */
      .notices {
        position: fixed;
        top: 14px;
        right: 14px;
        z-index: 60;
        width: min(400px, calc(100vw - 28px));
        display: grid;
        gap: 8px;
        justify-items: stretch;
        pointer-events: none;
      }
      .notices:empty { display: none; }
      /* While the freeze banner is up, drop the toast lane below it so a notice
         can never cover the "restore" affordance. */
      body.is-paused .notices { top: 66px; }
      .notice {
        pointer-events: auto;
        position: relative;
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 10px 11px 10px 14px;
        border: var(--glass-border);
        border-radius: var(--r-card);
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        box-shadow: var(--shadow-lift), inset 0 1px 0 rgba(255, 255, 255, 0.95);
        font-size: 12.5px;
        line-height: 1.5;
        color: var(--text);
        overflow: hidden;
        animation: toast-in 0.36s var(--ease) both;
        transition: box-shadow 0.25s var(--ease), border-color 0.25s var(--ease);
      }
      /* Reaching for a toast simply lifts it off the deck — the edge stays slate. */
      .notice:hover {
        border-color: var(--line-strong);
        box-shadow: var(--shadow-hover), inset 0 1px 0 #FFFFFF;
      }
      /* Information arrives as an ink-edged telemetry card... */
      .notice::before {
        content: "";
        position: absolute;
        left: 0;
        top: 10px;
        bottom: 10px;
        width: 2px;
        border-radius: var(--r-pill);
        background: var(--standby);
        box-shadow: none;
      }
      /* ...a failure arrives as crimson glass. */
      .notice.err {
        border-color: var(--danger-edge);
        background: linear-gradient(180deg, var(--danger-soft), #FFFFFF 86%);
      }
      .notice.err::before { background: var(--danger); box-shadow: none; }
      .notice.err:hover { border-color: var(--danger-edge); }
      .notice-body { display: grid; gap: 3px; min-width: 0; }
      .notice-who {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 11px;
        letter-spacing: 0.04em;
      }
      .notice-who b { color: var(--text); font-weight: 650; }
      .notice.err .notice-who b { color: var(--danger-hi); }
      .notice-who .at { color: var(--secondary); font-family: var(--mono); font-size: 10.5px; }
      .notice-msg { color: var(--text); word-break: break-word; }
      .notice .close {
        margin-left: auto;
        flex: 0 0 auto;
        align-self: flex-start;
      }

      /* ----------------------------------------------------------- page + grid */
      .pages { flex: 1; overflow: auto; padding: 16px 18px 44px; }
      .page {
        display: none;
        width: 100%;
        max-width: 1120px;
        margin-left: auto;
        margin-right: auto;
      }
      .page.active { display: block; animation: page-in 0.34s var(--ease) both; }
      h2.page-title {
        font-size: 15px;
        margin: 0 0 15px;
        font-weight: 650;
        letter-spacing: 0.01em;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      h2.page-title::before {
        content: "";
        width: 3px;
        height: 15px;
        border-radius: var(--r-pill);
        background: var(--accent);
      }
      .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-content: start; }
      @media (max-width: 1080px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      .split { display: grid; grid-template-columns: minmax(320px, 420px) minmax(320px, 1fr); gap: 16px; align-items: start; }
      .list { display: grid; gap: 8px; }
      .scroll-list { max-height: 46vh; overflow: auto; padding-right: 2px; }

      /* ----------------------------------------------------------------- cards */
      .card {
        position: relative;
        background: var(--card);
        backdrop-filter: var(--surface-blur);
        -webkit-backdrop-filter: var(--surface-blur);
        border: 1px solid var(--line);
        border-radius: var(--r-card);
        padding: 13px;
        box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }
      .agent-card {
        cursor: pointer;
        transition: transform 0.24s var(--ease), border-color 0.24s var(--ease), background 0.24s var(--ease),
          box-shadow 0.24s var(--ease);
      }
      .agent-card:hover {
        transform: translateY(-2px);
        background: var(--card-hover);
        border-color: var(--line-strong);
        box-shadow: var(--shadow-hover), inset 0 1px 0 #FFFFFF;
      }
      .card-head { display: flex; align-items: center; gap: 7px; margin-bottom: 9px; }
      .card-name {
        font-weight: 650;
        font-size: 15px;
        letter-spacing: -0.01em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #CBD5E1;
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.9);
        flex: 0 0 8px;
      }
      .dot.busy {
        background: var(--vital-green);
        box-shadow: 0 0 9px rgba(5, 150, 105, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.9);
        animation: vital-pulse 1.7s var(--ease) infinite;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 0 8px;
        height: 19px;
        border-radius: var(--r-pill);
        font-size: 11px;
        line-height: 1;
        border: 1px solid var(--line);
        color: var(--muted);
        background: rgba(255, 255, 255, 0.7);
        white-space: nowrap;
        font-weight: 500;
      }
      .tag.ok { color: var(--alive); border-color: rgba(5, 150, 105, 0.24); background: var(--alive-soft); }
      .tag.bad { color: var(--danger); border-color: var(--danger-edge); background: var(--danger-soft); }
      .tag.warn { color: var(--standby); border-color: var(--standby-border); background: var(--standby-soft); }

      /* Capsule energy slot: carbon while healthy, quiet slate as it thins,
         necrosis crimson once the death line is close. */
      .bar {
        position: relative;
        height: 8px;
        border-radius: var(--r-pill);
        background: rgba(15, 23, 42, 0.07);
        box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.12), inset 0 0 0 1px rgba(15, 23, 42, 0.04);
        overflow: hidden;
      }
      .bar > span {
        position: relative;
        display: block;
        height: 100%;
        border-radius: var(--r-pill);
        background: var(--accent);
        transition: width 0.5s var(--ease), background-color 0.5s var(--ease);
      }
      .bar > span::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0) 62%);
        pointer-events: none;
      }
      /* While the life clock is frozen the energy slots read as held ice: the
         colour drains out and a still slate hatch settles over the fill. The
         fill colour arrives as an inline `style="background: …"`, and an inline
         shorthand resets `background-image` to `none`, so the frost is drawn on
         the `::after` overlay (which is never inlined) rather than on the span. */
      body.is-paused .bar > span { filter: saturate(0.12) brightness(1.04); }
      body.is-paused .bar > span::after {
        background:
          repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.55) 0 2px, rgba(255, 255, 255, 0) 2px 7px),
          linear-gradient(180deg, rgba(226, 232, 240, 0.9), rgba(203, 213, 225, 0.7));
      }
      body.is-paused .bar { box-shadow: inset 0 0 0 1px var(--standby-border), inset 0 1px 2px rgba(15, 23, 42, 0.08); }

      .kv { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; align-items: baseline; }
      .kv .k { color: var(--muted); }
      .kv .num, .kv > span:last-child:not(.k) { font-family: var(--mono); font-variant-numeric: tabular-nums; }
      .kv > span:last-child:not(.k):not(.num) { color: var(--text); font-size: 12px; }
      /* Scoped to telemetry values only, so a `.danger` or `.warn` utility on a
         tag or banner is never painted by this rule. */
      .kv .num.danger { color: var(--danger-hi); }
      .kv .num.warn { color: var(--warn-hi); }
      .card-reply {
        margin-top: 9px;
        padding-top: 9px;
        border-top: 1px dashed var(--line);
        font-size: 12px;
        color: var(--muted);
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 46px;
        overflow: hidden;
        line-height: 1.5;
      }
      .slot-card {
        border-style: dashed;
        border-color: var(--line-strong);
        background: var(--sunk);
        box-shadow: none;
        display: grid;
        gap: 9px;
        align-content: start;
      }
      .slot-card .slot-title {
        color: var(--secondary);
        font-size: 10.5px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .slot-card input { width: 100%; }

      /* --------------------------------------------------------- form controls */
      input, textarea, select, button { font: inherit; color: var(--text); }
      input, textarea, select {
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid var(--line-strong);
        border-radius: var(--r-card);
        padding: 7px 10px;
        min-width: 0;
        box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.04);
        transition: border-color 0.18s var(--ease), box-shadow 0.18s var(--ease), background 0.18s var(--ease);
      }
      input::placeholder, textarea::placeholder { color: var(--text-muted); }
      input:hover, textarea:hover, select:hover { border-color: rgba(148, 163, 184, 0.8); }
      input:focus, textarea:focus, select:focus {
        outline: none;
        background: #FFFFFF;
        border-color: rgba(37, 99, 235, 0.65);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12), inset 0 1px 1px #FFFFFF;
      }
      textarea { min-height: 62px; width: 100%; resize: vertical; }
      select {
        appearance: none;
        background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
          linear-gradient(135deg, var(--muted) 50%, transparent 50%);
        background-position: calc(100% - 16px) calc(50% + 1px), calc(100% - 11px) calc(50% + 1px);
        background-size: 5px 5px, 5px 5px;
        background-repeat: no-repeat;
        padding-right: 30px;
      }
      select option { background: #FFFFFF; color: var(--text); }
      input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); }

      /* ---------------------------------------------------------------- buttons
         Every control is a pill cut from the same glass. Two layers carry it: an
         outer hairline slate border, and a 1px specular cut face masked down to
         the border box alone, which catches the light as the cursor arrives. The
         interior stays clean white pearl — no prism, no rainbow, no glow. ----- */
      .btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border-radius: var(--r-pill);
        border: 1px solid var(--line);
        background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%);
        padding: 7px 14px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
        white-space: nowrap;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), inset 0 1px 0 #FFFFFF;
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      }
      /* The optical cut face: one white-to-slate gradient clipped to the 1px
         border box, so only the pill's own edge is lit and the interior stays
         untouched glass. */
      .btn::after {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgba(203, 213, 225, 0.5) 100%);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        mask-composite: exclude;
        opacity: 0.8;
        pointer-events: none;
        transition: all 0.2s ease;
      }
      .btn:hover {
        transform: translateY(-1px);
        background: #FFFFFF;
        border-color: var(--line-strong);
        box-shadow: var(--shadow-hover), inset 0 1px 0 #FFFFFF;
      }
      .btn:hover::after {
        background: linear-gradient(180deg, #FFFFFF 0%, rgba(37, 99, 235, 0.35) 100%);
        opacity: 1;
      }
      .btn:active {
        transform: translateY(1px) scale(0.98);
        box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.08);
      }
      .btn:disabled { opacity: 0.42; cursor: not-allowed; transform: none; box-shadow: var(--glass-inset); }
      .btn:disabled::after { opacity: 0; }
      .btn:focus-visible { box-shadow: inset 0 1px 0 #FFFFFF, 0 0 0 3px rgba(37, 99, 235, 0.22); }
      .btn.primary {
        background: var(--text);
        border-color: var(--text);
        color: #FFFFFF;
        font-weight: 600;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.14);
      }
      /* On the dark key the same cut face reads as a soft white edge. */
      .btn.primary::after {
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0.06) 100%);
      }
      .btn.primary:hover {
        background: #1E293B;
        border-color: #1E293B;
        color: #FFFFFF;
        box-shadow: var(--shadow-hover), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      }
      .btn.danger {
        color: var(--danger);
        border-color: var(--danger-edge);
        background: linear-gradient(180deg, #FFFFFF 0%, var(--danger-soft) 100%);
      }
      .btn.danger:hover {
        background: #FFFFFF;
        border-color: rgba(220, 38, 38, 0.45);
        box-shadow: var(--shadow-hover), inset 0 1px 0 #FFFFFF;
      }
      .btn.tiny { padding: 3px 10px; font-size: 12px; }
      .btn.active {
        background: var(--accent-cool-soft);
        border-color: var(--accent-edge);
        color: var(--accent-cool);
        font-weight: 600;
        box-shadow: inset 0 1px 0 #FFFFFF;
      }
      .btn.icon { padding: 6px 8px; line-height: 0; }
      .btn.icon svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }

      .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }

      /* Labelled fields: the label sits above its control, never inside it. */
      .field { display: grid; gap: 6px; }
      .field.inline { grid-auto-flow: column; align-items: center; gap: 9px; }
      .field-k {
        font-size: 11px;
        color: var(--secondary);
        letter-spacing: 0.11em;
        text-transform: uppercase;
        font-weight: 600;
      }
      .field.inline .field-k { text-transform: none; letter-spacing: 0.02em; font-size: 12px; color: var(--muted); }

      .list-item {
        border: 1px solid var(--line);
        border-left: 2px solid rgba(148, 163, 184, 0.35);
        border-radius: var(--r-card);
        padding: 9px 11px;
        cursor: pointer;
        background: var(--card);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85);
        transition: border-color 0.18s var(--ease), background 0.18s var(--ease), transform 0.18s var(--ease),
          box-shadow 0.18s var(--ease);
      }
      .list-item:hover {
        border-color: rgba(148, 163, 184, 0.7);
        background: var(--card-hover);
        transform: translateX(1px);
        box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }
      .list-item.active {
        border-color: var(--accent-edge);
        border-left-color: var(--accent-cool);
        background: linear-gradient(90deg, rgba(37, 99, 235, 0.08), rgba(37, 99, 235, 0.02) 55%, transparent), var(--card-hover);
        box-shadow: inset 0 1px 0 #FFFFFF;
      }
      .list-item .title { font-weight: 600; }
      .list-item .sub { font-size: 12px; color: var(--muted); }

      /* --------------------------------------------------- code / disclosure */
      pre {
        background: rgba(248, 250, 252, 0.9);
        border: 1px solid var(--line);
        border-radius: var(--r-card);
        padding: 11px;
        margin: 0;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 420px;
        font-size: 12.5px;
        line-height: 1.6;
        color: #1E293B;
        box-shadow: inset 0 1px 3px rgba(15, 23, 42, 0.06);
      }
      /* Inline code is a slab of the same paper, not a second colour. */
      code {
        background: var(--line-soft);
        border-radius: 6px;
        padding: 1px 5px;
        font-size: 0.92em;
        color: var(--text);
      }
      pre code { background: none; padding: 0; color: inherit; }

      details {
        border: 1px solid var(--line);
        border-radius: var(--r-card);
        padding: 8px 11px;
        background: rgba(255, 255, 255, 0.5);
        transition: border-color 0.18s var(--ease), background 0.18s var(--ease);
      }
      details + details { margin-top: 8px; }
      details:hover { border-color: var(--line-strong); }
      details > summary {
        cursor: pointer;
        font-size: 12.5px;
        color: var(--muted);
        list-style: none;
        display: flex;
        align-items: center;
        gap: 7px;
        transition: color 0.16s var(--ease);
      }
      details > summary::-webkit-details-marker { display: none; }
      details > summary::before {
        content: "";
        width: 0;
        height: 0;
        border-left: 4px solid currentColor;
        border-top: 3.5px solid transparent;
        border-bottom: 3.5px solid transparent;
        transition: transform 0.2s var(--ease);
        opacity: 0.7;
      }
      details[open] > summary::before { transform: rotate(90deg); }
      details > summary:hover { color: var(--text); }
      details[open] > summary { margin-bottom: 9px; color: var(--text); }

      table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
      th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
      th {
        color: var(--secondary);
        font-weight: 600;
        font-size: 10.5px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        background: rgba(248, 250, 252, 0.75);
      }
      tbody tr { transition: background 0.14s var(--ease); }
      tbody tr:hover { background: rgba(15, 23, 42, 0.02); }
      tbody tr:last-child td { border-bottom: 0; }
      a { color: var(--accent-hi); }

      /* ---------------------------------------------------------------- dialog */
      dialog#dlg {
        width: 1120px;
        max-width: 92vw;
        height: 760px;
        max-height: 85vh;
        margin: auto;
        padding: 0;
        border: var(--glass-border);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(28px) saturate(180%);
        -webkit-backdrop-filter: blur(28px) saturate(180%);
        box-shadow: 0 30px 80px -24px rgba(15, 23, 42, 0.28), 0 0 0 1px rgba(226, 232, 240, 0.8),
          inset 0 1px 0 rgba(255, 255, 255, 0.95);
        overflow: hidden;
        color: var(--text);
      }
      dialog#dlg::backdrop {
        background: rgba(15, 23, 42, 0.55);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      /* ------------------------------------------------------- settings modal
         The operator's tooling floats over the workspace instead of replacing
         it: a dimmed, blurred backdrop keeps the page underneath legible but
         clearly out of focus, and the card is a two-column instrument — a fixed
         category rail on the left, one independently scrolling panel on the
         right. The four panels keep their original mount ids, so the three
         second poll paints into them wherever they live. */
      dialog#settingsDlg {
        width: 1120px;
        max-width: 92vw;
        height: 680px;
        max-height: 86vh;
        padding: 0;
        outline: none;
        border-radius: 16px;
        border: 1px solid var(--line-strong);
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(20px) saturate(160%);
        -webkit-backdrop-filter: blur(20px) saturate(160%);
        box-shadow: 0 25px 70px -15px rgba(15, 23, 42, 0.35), 0 0 0 1px rgba(226, 232, 240, 0.6);
        overflow: hidden;
        color: var(--text);
      }
      dialog#settingsDlg::backdrop {
        background: rgba(15, 23, 42, 0.55);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      dialog#settingsDlg[open] { animation: settings-in 0.26s var(--ease) both; }
      dialog#settingsDlg[open]::backdrop { animation: settings-backdrop-in 0.26s var(--ease) both; }
      /* Closing is the same motion played backwards; the script holds `close()`
         until this animation lands, so the card never blinks out. */
      dialog#settingsDlg.is-closing {
        animation: settings-out 0.2s var(--ease) both;
        pointer-events: none;
      }
      dialog#settingsDlg.is-closing::backdrop { animation: settings-backdrop-out 0.2s var(--ease) both; }

      @keyframes settings-in {
        from { opacity: 0; transform: translateY(10px) scale(0.985); }
        to { opacity: 1; transform: none; }
      }
      @keyframes settings-out {
        from { opacity: 1; transform: none; }
        to { opacity: 0; transform: translateY(8px) scale(0.99); }
      }
      @keyframes settings-backdrop-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes settings-backdrop-out { from { opacity: 1; } to { opacity: 0; } }

      .settings-shell { display: flex; flex-direction: column; height: 100%; min-height: 0; }
      .settings-head {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 15px 18px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.4));
      }
      .settings-head-icon {
        width: 34px;
        height: 34px;
        flex: 0 0 34px;
        border-radius: 11px;
        display: grid;
        place-items: center;
        background: var(--standby-soft);
        color: var(--standby);
        border: 1px solid var(--line);
      }
      .settings-head-icon svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .settings-head-text { display: grid; gap: 2px; min-width: 0; }
      .settings-title { font-size: 16.5px; font-weight: 650; letter-spacing: -0.01em; }

      .settings-body { flex: 1; min-height: 0; display: flex; }
      .settings-nav {
        width: 210px;
        flex: 0 0 210px;
        padding: 12px 10px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        border-right: 1px solid var(--line);
        background: rgba(248, 250, 252, 0.72);
        overflow-y: auto;
      }
      .settings-nav-item {
        display: flex;
        align-items: center;
        gap: 9px;
        width: 100%;
        padding: 9px 11px;
        border: 1px solid transparent;
        border-radius: var(--r-pill);
        background: none;
        color: var(--muted);
        font: inherit;
        font-size: 12.5px;
        text-align: left;
        cursor: pointer;
        transition: background 0.2s var(--ease), color 0.2s var(--ease), border-color 0.2s var(--ease);
      }
      .settings-nav-item svg {
        width: 15px;
        height: 15px;
        flex: 0 0 15px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.75;
      }
      .settings-nav-item:hover { background: rgba(15, 23, 42, 0.05); color: var(--text); }
      .settings-nav-item.active {
        background: var(--accent-dim);
        border-color: var(--accent-edge);
        color: var(--accent-cool);
        font-weight: 600;
        box-shadow: var(--glass-inset);
      }
      .settings-nav-item.active svg { opacity: 1; }

      .settings-content {
        flex: 1;
        min-width: 0;
        padding: 22px 26px;
        overflow-y: auto;
        overflow-x: hidden;
      }
      .settings-tab-panel { display: block; }
      .dlg-wrap { display: flex; flex-direction: column; height: 100%; min-height: 0; }
      .dlg-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 13px 17px;
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
        background: rgba(255, 255, 255, 0.6);
      }
      .dlg-name { font-size: 16.5px; font-weight: 650; letter-spacing: -0.01em; }
      .dlg-sat { display: flex; align-items: center; gap: 7px; width: 190px; }
      .dlg-sat .bar { flex: 1; }

      /* Segmented capsule rail for the specimen views. */
      .dlg-tabs {
        display: flex;
        gap: 3px;
        padding: 8px 14px;
        border-bottom: 1px solid var(--line);
        overflow-x: auto;
        background: rgba(248, 250, 252, 0.72);
      }
      .tab {
        border: 1px solid transparent;
        background: none;
        padding: 7px 14px;
        color: var(--muted);
        cursor: pointer;
        border-radius: var(--r-pill);
        white-space: nowrap;
        font-size: 12.5px;
        transition: background 0.22s var(--ease), color 0.22s var(--ease), box-shadow 0.22s var(--ease),
          border-color 0.22s var(--ease);
      }
      .tab:hover { color: var(--text); background: rgba(15, 23, 42, 0.05); }
      .tab.active {
        color: var(--accent-hi);
        background: linear-gradient(180deg, rgba(37, 99, 235, 0.14), rgba(37, 99, 235, 0.06));
        border-color: var(--accent-edge);
        box-shadow: 0 2px 10px -4px rgba(37, 99, 235, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.9);
        font-weight: 600;
      }

      .dlg-body { flex: 1; min-height: 0; display: flex; }
      .pane { display: none; flex: 1; min-height: 0; padding: 15px 17px; }
      .pane.active { display: flex; flex-direction: column; gap: 10px; overflow: auto; }
      /* Life and messages own a nested scroll area, so the pane itself clips
         instead of scrolling twice. Memory is a full-width document and lets
         the pane scroll, which is why it is deliberately not listed here. */
      #pane-life.active, #pane-messages.active { overflow: hidden; }
      .pane-col { min-height: 0; overflow: auto; display: grid; gap: 8px; align-content: start; }

      /* ---------------------------------------------------- life: sessions */
      /* Two levels inside one pane: the session list, and the transcript of
         the session the operator opened. Exactly one is visible, so neither
         has to share the width with a second column. */
      .life-view { display: none; flex: 1; min-height: 0; }
      .life-view.active { display: flex; flex-direction: column; gap: 10px; }
      #lifeSessions.active { overflow: auto; }
      .life-bar { flex: 0 0 auto; }

      .session-grid {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
        align-content: start;
      }
      .session-card {
        border: 1px solid var(--line);
        border-left: 2px solid rgba(148, 163, 184, 0.35);
        border-radius: var(--r-card);
        padding: 11px 13px;
        cursor: pointer;
        background: var(--card);
        display: grid;
        gap: 7px;
        align-content: start;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85);
        transition: border-color 0.18s var(--ease), background 0.18s var(--ease), box-shadow 0.18s var(--ease);
      }
      .session-card:hover {
        border-color: rgba(148, 163, 184, 0.7);
        background: var(--card-hover);
        box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }
      .session-card .s-head { display: flex; gap: 8px; align-items: center; }
      .session-card .s-no { font-size: 13.5px; font-weight: 650; letter-spacing: -0.01em; }
      .session-card .s-sub { font-size: 11.5px; color: var(--muted); }
      .session-card .s-metrics { display: flex; flex-wrap: wrap; gap: 6px; }
      .s-metric {
        display: inline-flex;
        align-items: baseline;
        gap: 4px;
        font-size: 11px;
        color: var(--muted);
        border: 1px solid var(--line);
        background: var(--line-soft);
        border-radius: var(--r-pill);
        padding: 1px 8px;
      }
      .s-metric b {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        color: var(--text);
      }
      /* The reply preview is a lead, not the record: clamp it and let the
         transcript hold the whole thing. */
      .session-card .s-summary {
        font-size: 12px;
        line-height: 1.55;
        color: var(--text);
        font-family: var(--mono);
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .session-card .s-summary.void { font-family: inherit; color: var(--secondary); font-style: normal; }

      /* -------------------------------------------------- life: transcript */
      #lifeTranscript.active { overflow: auto; }
      .t-top {
        display: flex;
        align-items: center;
        gap: 9px;
        flex-wrap: wrap;
        flex: 0 0 auto;
        position: sticky;
        top: 0;
        z-index: 2;
        padding-bottom: 9px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.96) 70%, rgba(255, 255, 255, 0));
      }
      /* A turn is one step of the flow. The spine belongs to the flow itself,
         so it reads as one continuous line down the conversation rather than
         a dashed rail restarting at every step. */
      .t-flow { display: flex; flex-direction: column; gap: 9px; padding: 0 0 4px 13px; border-left: 1px solid var(--line); }
      .t-turn { display: grid; gap: 8px; }
      .t-think {
        border: 1px solid var(--line);
        border-radius: var(--r-card);
        padding: 10px 12px;
        background: var(--surface);
        backdrop-filter: var(--surface-blur);
        -webkit-backdrop-filter: var(--surface-blur);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85);
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.65;
        font-size: 13px;
      }
      .t-think .who {
        display: block;
        font-size: 10.5px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--secondary);
        margin-bottom: 6px;
      }
      .t-context { flex: 0 0 auto; }
      .tool-item summary strong { font-weight: 650; }
      .tool-item > summary code { font-family: var(--mono); }
      .t-anchor {
        font-size: 11px;
        color: var(--muted);
        font-family: var(--mono);
        padding-left: 2px;
      }

      .tool-item { border-left: 2px solid var(--accent); }
      .tool-item.bad { border-left-color: var(--danger); }
      .tool-sum { color: var(--muted); margin-left: 6px; font-size: 12px; }
      .final {
        border: 1px solid var(--accent-edge);
        background: linear-gradient(180deg, rgba(37, 99, 235, 0.06), transparent), var(--surface);
        border-radius: var(--r-card);
        padding: 11px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85);
      }
      .final .label {
        font-size: 11px;
        color: var(--accent);
        font-weight: 650;
        margin-bottom: 7px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .final pre { background: rgba(248, 250, 252, 0.9); border-color: var(--line); max-height: 300px; }
      .event-line {
        font-size: 12.5px;
        color: var(--muted);
        padding: 2px 0;
        border-bottom: 1px solid var(--line-soft);
      }
      .event-line:last-child { border-bottom: 0; }

      /* ----------------------------------------------------------- memory */
      .mem-pane { overflow: visible; align-content: start; }
      .mem-bar { flex: 0 0 auto; align-items: center; gap: 8px; flex-wrap: wrap; }
      /* The wound index, inside the status bar: one chip per active wound. */
      .mem-wounds {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
        padding-left: 8px;
        margin-left: 2px;
        border-left: 1px solid var(--line);
      }
      .mem-body {
        border: 1px solid var(--line);
        border-radius: var(--r-card);
        overflow: auto;
        max-height: 56vh;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: inset 0 1px 3px rgba(15, 23, 42, 0.06);
      }
      .mem-line {
        padding: 1px 12px;
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.8;
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
        font-size: 12.5px;
        color: #1E293B;
      }
      .mem-line:hover { background: rgba(15, 23, 42, 0.025); }
      /* The lines the last consolidation rewrote: marked with a slate rail, not
         by introducing a second accent colour. */
      .mem-born {
        background: var(--line-soft);
        color: var(--text);
        box-shadow: inset 2px 0 0 var(--standby);
      }
      .mem-born .hint {
        color: var(--secondary);
        font-size: 10.5px;
        margin-left: 9px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      /* An untreated wound reads as a censor bar stamped over the page: ink
         with the taken-character count knocked out in white. Seized evidence,
         never amber decoration. It is also the button that opens treatment. */
      .redact {
        background: var(--text);
        color: #FFFFFF;
        border-radius: 4px;
        padding: 0 3px;
        margin: 0 1px;
        box-shadow: none;
        letter-spacing: 0.01em;
        font-weight: 600;
      }
      .redact::before { content: "["; opacity: 0.5; }
      .redact::after { content: "]"; opacity: 0.5; }
      button.redact {
        border: 0;
        cursor: pointer;
        font: inherit;
        line-height: inherit;
        transition: box-shadow 0.16s var(--ease), background 0.16s var(--ease);
      }
      button.redact:hover { background: var(--accent-cool); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18); }
      button.redact:focus-visible { outline: 2px solid var(--accent-cool); outline-offset: 2px; }
      /* A scar: the characters are back, but the page is not healed. */
      .scar {
        background: rgba(100, 116, 139, 0.12);
        border-bottom: 1px dashed var(--standby-border);
        border-radius: 3px;
        padding: 0 2px;
        color: #334155;
      }
      /* Revealed original text: what the redaction took, restored for the
         operator alone. It is marked as evidence, never as normal prose. */
      .truetext {
        background: var(--accent-cool-soft);
        border-bottom: 1px solid var(--accent-cool);
        border-radius: 3px;
        padding: 0 2px;
        color: var(--text);
        font-weight: 600;
      }
      /* The in-place treatment card, anchored under the wound it belongs to. */
      .wound-pop {
        border: 1px solid var(--accent-edge);
        border-radius: var(--r-card);
        background: rgba(255, 255, 255, 0.97);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 18px 44px -18px rgba(15, 23, 42, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.95);
        padding: 12px 14px;
        display: grid;
        gap: 8px;
        align-content: start;
        position: sticky;
        bottom: 0;
        z-index: 3;
      }
      .wound-pop[hidden] { display: none; }
      .wound-pop .wp-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .wound-pop .wp-k { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; }
      .wound-pop pre { max-height: 150px; }
      .mem-history { margin-top: 4px; }
      .mem-history > summary { font-weight: 600; }

      /* -------------------------------------------------------------- messages */
      .chat { display: flex; flex-direction: column; min-height: 0; flex: 1; gap: 8px; }
      .chat-list { flex: 1; min-height: 0; overflow: auto; display: grid; gap: 8px; align-content: start; padding-right: 2px; }
      .msg {
        max-width: 72%;
        padding: 8px 11px;
        border-radius: var(--r-card);
        border: 1px solid var(--line);
        background: var(--surface);
        backdrop-filter: var(--surface-blur);
        -webkit-backdrop-filter: var(--surface-blur);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85);
        animation: page-in 0.28s var(--ease) both;
      }
      .msg.op {
        justify-self: end;
        background: linear-gradient(180deg, rgba(37, 99, 235, 0.1), rgba(37, 99, 235, 0.04));
        border-color: var(--accent-edge);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }
      .msg .who {
        font-size: 10.5px;
        color: var(--secondary);
        margin-bottom: 4px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .msg.op .who { color: var(--accent-cool); }
      .msg .body { white-space: pre-wrap; word-break: break-word; line-height: 1.6; }
      .chat-input { display: flex; gap: 8px; }
      .chat-input input { flex: 1; }

      /* --------------------------------------------------------------- banners */
      .banner {
        border-radius: var(--r-card);
        padding: 10px 12px;
        font-size: 12.5px;
        line-height: 1.55;
        border: 1px solid var(--line);
        background: var(--surface);
        backdrop-filter: var(--surface-blur);
        -webkit-backdrop-filter: var(--surface-blur);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85);
      }
      /* A standby notice is a quiet slate card with a 3px rail on its left edge.
         Slate is the colour of "held", not of danger. */
      .banner.warn {
        background: var(--standby-soft);
        border-color: var(--standby-border);
        color: var(--standby);
        box-shadow: inset 3px 0 0 var(--standby);
      }
      .banner.danger {
        background: var(--danger-soft);
        border-color: var(--danger-edge);
        color: #991B1B;
        box-shadow: inset 3px 0 0 var(--danger);
      }

      /* ---------------------------------------------------------------- pause */

      /* iOS-style capsule switch: the state of the life clock, not a raw checkbox. */
      .toggle { display: inline-flex; align-items: center; gap: 11px; cursor: pointer; user-select: none; }
      .toggle input { position: absolute; opacity: 0; width: 0; height: 0; margin: 0; pointer-events: none; }
      .toggle-track {
        position: relative;
        flex: 0 0 44px;
        width: 44px;
        height: 24px;
        border-radius: var(--r-pill);
        background: rgba(15, 23, 42, 0.1);
        border: 1px solid var(--line-strong);
        box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.08);
        transition: background 0.25s var(--ease), border-color 0.25s var(--ease), box-shadow 0.25s var(--ease);
      }
      .toggle-knob {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #FFFFFF;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.24), inset 0 1px 1px #FFFFFF;
        transition: transform 0.28s var(--ease), background 0.25s var(--ease), box-shadow 0.25s var(--ease);
      }
      .toggle:hover .toggle-track { border-color: var(--accent-edge); }
      /* Engaged: a carbon key with a white dot. Standby is a state, not a hazard,
         so the switch never turns amber. */
      .toggle input:checked ~ .toggle-track {
        background: var(--text);
        border-color: var(--text);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.16);
      }
      .toggle input:checked ~ .toggle-track .toggle-knob {
        transform: translateX(20px);
        background: #FFFFFF;
        box-shadow: 0 2px 6px rgba(15, 23, 42, 0.3), inset 0 1px 1px #FFFFFF;
      }
      .toggle input:focus-visible ~ .toggle-track { box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.22); }
      .toggle-text { font-weight: 650; font-size: 14px; }
      .toggle-state {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
        font-size: 11.5px;
        letter-spacing: 0.04em;
        padding: 3px 9px;
        border-radius: var(--r-pill);
        border: 1px solid var(--line);
        background: var(--line-soft);
        color: var(--text);
      }
      .toggle-state.warn {
        border-color: var(--standby-border);
        background: var(--standby-soft);
        color: var(--standby);
      }

      /* A frozen life clock is a standby condition, not a fire alarm: one still
         band of translucent glacial slate, with a 3px rail on its left edge. No
         gold, no sweep, no glow — the greenhouse is simply breathing slowly. */
      .banner.pause-banner {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        width: calc(100% - 36px);
        max-width: 1120px;
        margin: 11px auto 0;
        padding: 11px 14px;
        cursor: pointer;
        font-weight: 500;
        font-size: 13px;
        letter-spacing: 0.01em;
        color: var(--standby);
        border: 1px solid var(--standby-border);
        border-radius: var(--r-panel);
        background: var(--standby-soft);
        box-shadow: var(--shadow-card), inset 3px 0 0 var(--standby);
        transition: background 0.2s var(--ease), border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
      }
      .pause-banner .pb-dot {
        width: 8px;
        height: 8px;
        flex: 0 0 8px;
        border-radius: 50%;
        background: var(--standby);
        box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.26);
        animation: standby-pulse 3.2s var(--ease) infinite;
      }
      .banner.pause-banner:hover {
        background: #FFFFFF;
        border-color: var(--text-sub);
        box-shadow: var(--shadow-hover), inset 3px 0 0 var(--standby);
      }
      .pause-banner .go {
        margin-left: auto;
        font-weight: 600;
        font-size: 12px;
        opacity: 0.85;
        white-space: nowrap;
      }

      /* The rail carries a compact standby chip: a light slate capsule that only
         brightens faintly on hover, never a yellow warning tag. */
      .pause-rail {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 13px 11px;
        padding: 6px 10px;
        border: 1px solid var(--standby-border);
        border-radius: var(--r-pill);
        background: var(--standby-soft);
        color: var(--standby);
        box-shadow: var(--glass-inset);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.02em;
        cursor: pointer;
        transition: background 0.18s var(--ease), border-color 0.18s var(--ease), box-shadow 0.18s var(--ease);
      }
      .pause-rail:hover {
        background: #FFFFFF;
        border-color: var(--text-sub);
        box-shadow: var(--shadow-card), var(--glass-inset);
      }
      .pause-rail .led {
        width: 6px;
        height: 6px;
        flex: 0 0 6px;
        border-radius: 50%;
        background: var(--standby);
        box-shadow: 0 0 0 2px rgba(148, 163, 184, 0.25);
        animation: standby-pulse 3.2s var(--ease) infinite;
      }

      /* ------------------------------------------------------- settings bento */
      .settings-bento {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        align-items: start;
      }
      @media (max-width: 1180px) { .settings-bento { grid-template-columns: minmax(0, 1fr); } }

      .mod {
        background: var(--card);
        backdrop-filter: var(--surface-blur);
        -webkit-backdrop-filter: var(--surface-blur);
        border: 1px solid var(--line);
        border-radius: var(--r-panel);
        box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255, 255, 255, 0.9);
        overflow: hidden;
        transition: border-color 0.22s var(--ease), box-shadow 0.22s var(--ease), transform 0.22s var(--ease);
      }
      .mod:hover {
        border-color: var(--line-strong);
        box-shadow: var(--shadow-hover), inset 0 1px 0 #FFFFFF;
      }
      .mod.span2 { grid-column: 1 / -1; }
      .mod-head {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 13px 15px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.3));
      }
      /* Module glyphs are die-stamped in the same slate. The bento gets its
         rhythm from spacing and type weight, not from a four-colour icon set. */
      .mod-icon {
        width: 32px;
        height: 32px;
        flex: 0 0 32px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        background: var(--standby-soft);
        color: var(--standby);
        border: 1px solid var(--line);
      }
      .mod-icon svg {
        width: 17px;
        height: 17px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .mod-head-text { display: grid; gap: 2px; flex: 1 1 auto; min-width: 0; }
      .mod-title { display: block; font-weight: 650; font-size: 14px; letter-spacing: -0.005em; }
      .mod-sub { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.4; }
      .mod-head .pill, .mod-head .tag { margin-left: auto; flex: 0 0 auto; }
      .mod-body { padding: 14px 15px 15px; display: grid; gap: 12px; }

      .metric-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      /* Four across only while there is room; the media query below still wins
         because this is a class rule rather than an inline style. */
      .metric-grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      @media (max-width: 1180px) { .metric-grid.cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      @media (max-width: 620px) { .metric-grid, .metric-grid.cols-4 { grid-template-columns: minmax(0, 1fr); } }
      .metric {
        background: rgba(255, 255, 255, 0.66);
        border: 1px solid var(--line-soft);
        border-radius: var(--r-card);
        padding: 10px 12px;
        display: grid;
        gap: 3px;
        align-content: start;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
        transition: border-color 0.18s var(--ease), background 0.18s var(--ease), box-shadow 0.18s var(--ease);
      }
      .metric:hover {
        border-color: var(--line-strong);
        background: #FFFFFF;
        box-shadow: var(--shadow-card), inset 0 1px 0 #FFFFFF;
      }
      .metric-k {
        font-size: 11.5px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 6px;
        line-height: 1.4;
      }
      .metric-v {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
        font-size: 19px;
        font-weight: 700;
        letter-spacing: -0.025em;
        line-height: 1.15;
        color: var(--text);
      }
      .metric-v .metric-u {
        font-size: 11.5px;
        font-weight: 500;
        color: var(--secondary);
        margin-left: 4px;
        letter-spacing: 0;
      }
      .metric-note { font-size: 11.5px; color: var(--text-sub); line-height: 1.5; }
      /* An editable metric: the box takes the value's place, so it carries the
         value's type rather than the form controls' default size. */
      .metric-v input[data-sys-field] {
        width: 100%;
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.025em;
        padding: 3px 7px;
      }
      /* Used deliberately on the last cell of an odd-count row so the grid keeps
         its rhythm instead of leaving a hole. */
      .metric.wide { grid-column: 1 / -1; }
      .metric.wide .metric-v { font-size: 17px; }
      /* A metric value is ink. `tone-accent` is a no-op kept for the call sites
         that still pass it; `tone-warn` is the standby slate used by the frozen
         clock; only `tone-danger` is allowed to go red, and only on the death
         line. */
      .metric.tone-accent .metric-v { color: var(--text); }
      .metric.tone-warn .metric-v { color: var(--standby); }
      .metric.tone-danger .metric-v { color: var(--danger); }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 20px;
        padding: 0 9px;
        border-radius: var(--r-pill);
        font-size: 11px;
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
        border: 1px solid var(--line);
        color: var(--muted);
        background: rgba(255, 255, 255, 0.7);
        white-space: nowrap;
        font-weight: 500;
      }
      .pill.ok { color: var(--alive); border-color: rgba(5, 150, 105, 0.24); background: var(--alive-soft); }
      .pill.warn { color: var(--standby); border-color: var(--standby-border); background: var(--standby-soft); }
      .pill.bad { color: var(--danger); border-color: var(--danger-edge); background: var(--danger-soft); }
      .pill.info { color: var(--text-muted); border-color: var(--line-strong); background: var(--line-soft); }

      /* Segmented control: a sunken light trough with a floating white key. */
      .seg {
        display: inline-flex;
        gap: 3px;
        padding: 3px;
        background: rgba(15, 23, 42, 0.05);
        border: 1px solid var(--line);
        border-radius: var(--r-pill);
        box-shadow: inset 0 1px 3px rgba(15, 23, 42, 0.07);
      }
      .seg-opt { position: relative; cursor: pointer; display: inline-flex; }
      .seg-opt input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
      .seg-face {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: 28px;
        padding: 0 14px;
        border-radius: var(--r-pill);
        font-size: 12.5px;
        color: var(--muted);
        white-space: nowrap;
        transition: background 0.22s var(--ease), color 0.22s var(--ease), box-shadow 0.22s var(--ease);
      }
      .seg-face .led { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.55; }
      .seg-opt:hover .seg-face { color: var(--text); background: rgba(255, 255, 255, 0.75); }
      .seg-opt input:checked + .seg-face {
        background: #FFFFFF;
        color: var(--accent-cool);
        font-weight: 600;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.14), 0 4px 10px -4px rgba(15, 23, 42, 0.18),
          inset 0 1px 0 rgba(255, 255, 255, 0.95);
      }
      .seg-opt input:checked + .seg-face .led { opacity: 1; box-shadow: 0 0 8px currentColor; }
      .seg-opt input:focus-visible + .seg-face { box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2); }

      /* Prompt template file cards: name and health, never a raw disk path. */
      .tpl-list { display: grid; gap: 8px; }
      .tpl-card {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 11px;
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid var(--line-soft);
        border-radius: var(--r-card);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
        transition: border-color 0.18s var(--ease), background 0.18s var(--ease), box-shadow 0.18s var(--ease);
      }
      .tpl-card:hover {
        border-color: var(--line-strong);
        background: #FFFFFF;
        box-shadow: var(--shadow-card), inset 0 1px 0 #FFFFFF;
      }
      .tpl-card.bad { border-color: var(--standby-border); }
      .tpl-file {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
        font-size: 12.5px;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tpl-dir {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--secondary);
        margin-left: auto;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 40%;
        text-align: right;
      }
      .tpl-card .pill { flex: 0 0 auto; }

      /* Fetched remote models picker inside the provider editor. */
      .fetched-models-box {
        margin-top: 6px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: var(--r-card);
        background: var(--sunk);
        display: grid;
        gap: 8px;
      }
      .fetched-toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .fetched-toolbar input {
        flex: 1 1 180px;
        padding: 5px 10px;
        font-size: 12.5px;
      }
      .fetched-models-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        max-height: 210px;
        overflow-y: auto;
        padding: 2px;
      }
      .fetched-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 11px;
        border-radius: var(--r-pill);
        border: 1px solid var(--line-strong);
        background: #FFFFFF;
        color: var(--text);
        font-family: var(--mono);
        font-size: 12px;
        cursor: pointer;
        user-select: none;
        transition: background 0.16s var(--ease), border-color 0.16s var(--ease), color 0.16s var(--ease),
          box-shadow 0.16s var(--ease);
      }
      .fetched-chip:hover {
        border-color: var(--accent-edge);
      }
      .fetched-chip.active {
        background: var(--accent-cool-soft);
        border-color: var(--accent-cool);
        color: var(--accent-cool);
        font-weight: 600;
      }
      .fetched-chip-mark {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 1px solid var(--line-strong);
        display: inline-grid;
        place-items: center;
        font-size: 10px;
        line-height: 1;
        background: #FFFFFF;
        color: transparent;
      }
      .fetched-chip.active .fetched-chip-mark {
        background: var(--accent-cool);
        border-color: var(--accent-cool);
        color: #FFFFFF;
      }

      .hint-line {
        font-size: 11.5px;
        color: var(--muted);
        line-height: 1.6;
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .hint-line::before {
        content: "";
        flex: 0 0 2px;
        align-self: stretch;
        border-radius: var(--r-pill);
        background: var(--line-strong);
      }
      details.raw-config { margin-top: 14px; }
      details.raw-config > summary { font-size: 12.5px; }

      /* Only genuinely decorative micro-labels opt into the faint tier. Table
         column headers and form-field labels are content, so they are NOT in
         this list — they keep the readable `--secondary` from their own rules
         above (this block sits later in the sheet, so an equal-specificity
         selector here would silently win). */
      .brand small,
      .rail-chip .chip-k,
      .slot-card .slot-title,
      .mem-born .hint {
        color: var(--text-sub);
      }

      /* ------------------------------------------------------------ animation */
      /* Breathing only: the ring colours are static so a degraded lamp can never
         pulse green rings around a crimson dot. */
      @keyframes vital-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
      }
      @keyframes toast-in {
        from { opacity: 0; transform: translateX(18px) scale(0.98); }
        to { opacity: 1; transform: none; }
      }
      @keyframes page-in {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: none; }
      }
      /* A slow, low-contrast breath for the standby markers: a frozen clock is
         held, not flashing. */
      @keyframes standby-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
        .agent-card:hover { transform: none; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="rail">
        <div class="brand">
          <span class="brand-mark">
            <svg class="brand-logo" viewBox="228 245 568 533" aria-hidden="true" focusable="false">
              <g fill="currentColor" stroke="currentColor">
                <!-- Greenhouse outer frame -->
                <path d="M 241 705 L 358 765 L 666 765 L 783 705 L 783 529 A 271 271 0 0 0 241 529 Z"
                  fill="none" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
                <!-- Greenhouse inner arch -->
                <path d="M 358 765 L 358 529 A 154 154 0 0 1 666 529 L 666 765"
                  fill="none" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
                <!-- Top vertical strut -->
                <line x1="512" y1="258" x2="512" y2="375" stroke-width="26" stroke-linecap="round" />
                <!-- Diagonal struts -->
                <line x1="376" y1="456" x2="273" y2="401" stroke-width="26" stroke-linecap="round" />
                <line x1="648" y1="456" x2="751" y2="401" stroke-width="26" stroke-linecap="round" />
                <!-- Curved roof ribs -->
                <path d="M 465 275 C 444 320, 415 362, 390 405"
                  fill="none" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M 559 275 C 580 320, 609 362, 634 405"
                  fill="none" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
                <!-- Plant sprout (stem and leaves) -->
                <path d="M 598 475
                         C 624 500, 582 571, 538 565
                         C 543 544, 556 528, 571 511
                         C 555 513, 530 541, 525 565
                         L 525 765
                         L 499 765
                         L 499 620
                         C 495 599, 475 579, 455 567
                         C 451 574, 497 613, 479 621
                         C 438 618, 414 576, 416 537
                         C 455 516, 513 576, 512 604
                         C 501 542, 530 475, 598 475 Z"
                  stroke="none" />
              </g>
            </svg>
            <span class="vital" id="brandVital" title="温室运行中"></span>
          </span>
          <span>
            <span class="brand-name">Conservatory</span>
            <small>OPERATOR CONSOLE</small>
          </span>
        </div>
        <nav class="nav" id="nav">
          <div class="nav-item" data-act="nav" data-page="agents">
            <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2" /><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5" /><path d="M16 6.6a3 3 0 0 1 0 5.8" /><path d="M17.5 19c0-2.1-.7-3.8-2-4.8" /></svg>
            <span class="nav-label">所有 Agent</span>
            <span class="badge" data-badge="agents" hidden></span>
          </div>
          <div class="nav-item" data-act="nav" data-page="tasks">
            <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2" /><path d="M7.5 9.5h6M7.5 13.5h9M7.5 17h6" /></svg>
            <span class="nav-label">任务板</span>
            <span class="badge warn" data-badge="tasks" hidden></span>
          </div>
          <div class="nav-item" data-act="nav" data-page="income">
