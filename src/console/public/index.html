            <svg viewBox="0 0 24 24"><path d="M6 3.5h12v17l-2.6-1.8-2.4 1.8-2.4-1.8L8.6 20.5 6 18.7z" /><path d="M9.5 8.5h5M9.5 12h5" /></svg>
            <span class="nav-label">收入申报</span>
            <span class="badge warn" data-badge="income" hidden></span>
          </div>
          <div class="nav-item" data-act="nav" data-page="interventions">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><path d="M12 7.5V12l3.2 1.9" /></svg>
            <span class="nav-label">干预记录</span>
          </div>
        </nav>
        <div class="rail-foot" id="railFoot"></div>
        <!-- A compact frozen-clock chip, not a second full banner. -->
        <div class="pause-rail" id="railPause" data-act="goto-pause-settings" title="点击到设置页恢复" hidden></div>
        <!-- Settings is operator-wide tooling, not one more page in the specimen
             list, so it is pinned to the very bottom of the rail: telemetry
             reads first, the tool you reach for second. It opens the floating
             modal instead of routing, so the workspace underneath is never
             unloaded, and it deliberately drops `data-page` so applyRoute()
             can never mark it as the current page. -->
        <div class="rail-bottom">
          <div class="nav-item nav-settings" data-act="open-settings">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.1" /><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15.1 4.7a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.09a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.03z" /></svg>
            <span class="nav-label">设置</span>
          </div>
        </div>
      </aside>

      <div class="main">
        <div id="pauseBanner" class="banner pause-banner" data-act="goto-pause-settings" title="点击到设置页恢复" hidden></div>
        <!-- Floating toasts dock here; they must never swallow a click meant for
             the workspace underneath, so only the notice cards themselves take
             pointer events (see `.notice`). -->
        <div class="notices" id="notices"></div>
        <div class="pages" id="pages">
          <section class="page" id="page-agents">
            <h2 class="page-title">所有 Agent</h2>
            <div class="grid" id="cardGrid">
              <div class="contents" id="agentCards"></div>
              <div class="contents" id="slotCards"></div>
            </div>
          </section>

          <section class="page" id="page-tasks">
            <h2 class="page-title">任务板（一口价 · 先到先得）</h2>
            <div class="split">
              <div class="col-stack">
                <div class="card col-stack">
                  <div class="mod-title" style="font-size: 13.5px">发布任务</div>
                  <label class="field"><span class="field-k">标题</span>
                    <input id="taskTitle" placeholder="给 Agent 看的一句话" /></label>
                  <label class="field"><span class="field-k">价格</span>
                    <input id="taskPrice" type="number" min="0" placeholder="harness 余额" /></label>
                  <label class="field"><span class="field-k">描述</span>
                    <textarea id="taskDesc" placeholder="Agent 会看到这段描述，写清验收标准"></textarea></label>
                  <div class="row"><button class="btn primary" data-act="post-task">发布任务</button></div>
                </div>
                <div class="chips" id="taskFilters"></div>
                <div class="list scroll-list" id="taskList"></div>
              </div>
              <div class="col-stack" id="taskDetail"></div>
            </div>
          </section>

          <section class="page" id="page-income">
            <h2 class="page-title">收入申报</h2>
            <div id="rateWarn"></div>
            <div class="split" style="margin-top: 10px">
              <div class="list scroll-list" id="incomeList"></div>
              <div class="col-stack" id="incomeDetail"></div>
            </div>
          </section>

          <section class="page" id="page-interventions">
            <h2 class="page-title">干预记录</h2>
            <div class="banner warn" style="margin-bottom: 12px">
              这些记录永久保存。给余额、给饱食度、暂停或恢复温室都会写入 interventions 表：前两者会改变这两个数字，暂停与恢复则冻结或恢复整个温室的时间流动。它们都不会改变饱食度自然下降的规则。
            </div>
            <div class="row" style="margin-bottom: 10px">
              <label class="field inline"><span class="field-k">按 Agent 筛选</span>
                <select id="intFilter"></select></label>
            </div>
            <div id="intTable"></div>
          </section>
        </div>
      </div>
    </div>

    <dialog id="dlg">
      <div class="dlg-wrap">
        <div class="dlg-head">
          <span class="dot" id="dlgDot"></span>
          <strong class="dlg-name" id="dlgName">—</strong>
          <span class="small muted" id="dlgState">—</span>
          <span class="dlg-sat"><span class="bar"><span id="dlgBar" style="width: 0"></span></span><span class="small num" id="dlgSat">—</span></span>
          <span class="tag warn" id="dlgFrozen" hidden>已冻结</span>
          <span class="small muted">余额</span><span class="small num" id="dlgBal">—</span>
          <span class="grow"></span>
          <button class="btn" data-act="wake" id="dlgWake">立即唤醒</button>
          <button class="btn icon" data-act="dlg-close" title="关闭">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>
        <div class="dlg-tabs" id="dlgTabs"></div>
        <div class="dlg-body">
          <!-- Life is a two-level view inside one pane: the session list, and
               the transcript of the one session the operator opened. Only one
               of the two children is visible at a time (`.life-view.active`),
               so the pane never has to give up its width to a side column. -->
          <section class="pane" id="pane-life">
            <div class="life-view active" id="lifeSessions">
              <div class="row life-bar">
                <span class="small muted">加载最近</span>
                <button class="btn tiny" data-act="life-range" data-range="5">5</button>
                <button class="btn tiny" data-act="life-range" data-range="20">20</button>
                <button class="btn tiny" data-act="life-range" data-range="50">50</button>
                <span class="grow"></span>
                <button class="btn tiny" data-act="life-refresh">刷新</button>
              </div>
              <div class="list scroll-list" id="sessionList"></div>
            </div>
            <div class="life-view" id="lifeTranscript"></div>
          </section>

          <section class="pane" id="pane-body">
            <div class="pane-col" id="bodyPane"></div>
          </section>

          <!-- Memory is one full-width page. The wounds used to be a page of
               their own; here the operator reads the text and treats a wound
               in the same place, because the scar is where the sentence is.
               The consolidation history is folded away at the bottom rather
               than occupying a permanent right column. -->
          <section class="pane" id="pane-memory">
            <div class="pane-col mem-pane">
              <div class="row mem-bar">
                <span id="memStats"></span>
                <span class="grow"></span>
                <button class="btn tiny" id="memReveal" data-act="mem-reveal">透视完整原文</button>
              </div>
              <div class="mem-body" id="memoryText"></div>
              <div class="wound-pop" id="woundPop" hidden></div>
              <details class="mem-history" id="memHistory">
                <summary>记忆整合历史对比</summary>
                <div class="list" id="memRecords"></div>
                <div id="memCompare" style="margin-top: 8px"></div>
              </details>
            </div>
          </section>

          <section class="pane" id="pane-messages">
            <div class="chat">
              <div class="small muted">留言是它世界里的事件，不是命令。</div>
              <div class="chat-list" id="chatList"></div>
              <div class="chat-input">
                <input id="chatInput" data-enter="send-message" placeholder="给这个 Agent 留言…" />
                <button class="btn primary" data-act="send-message">发送</button>
              </div>
            </div>
          </section>

          <section class="pane" id="pane-tasks">
            <div class="pane-col" id="agentTasks"></div>
          </section>

          <section class="pane" id="pane-interventions">
            <div class="pane-col" id="agentInt"></div>
          </section>
        </div>
      </div>
    </dialog>

    <!-- Settings is operator-wide tooling, not one more page in the specimen
         list: it floats above whatever the operator was reading instead of
         replacing it. The four mount points below keep their original ids, so
         the three-second poll keeps painting straight into them. -->
    <dialog id="settingsDlg" class="settings-modal">
      <div class="settings-shell">
        <header class="settings-head">
          <span class="settings-head-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.1" /><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15.1 4.7a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.09a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.03z" /></svg>
          </span>

        <div class="settings-body">

            <button class="settings-nav-item active" data-act="settings-tab" data-tab="vital">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2" /><path d="M12 7.6V12l3 1.9" /></svg>

              <span>提示词热重载</span>
            </button>
            <button class="settings-nav-item" data-act="settings-tab" data-tab="models">
              <svg viewBox="0 0 24 24"><path d="M12 3.6 4.8 7.2v9.6L12 20.4l7.2-3.6V7.2z" /><path d="M4.8 7.2 12 10.8l7.2-3.6M12 10.8v9.6" /></svg>
              <span>模型设置</span>
            </button>
            <button class="settings-nav-item" data-act="settings-tab" data-tab="sandbox">
              <svg viewBox="0 0 24 24"><path d="M12 3.4 4.6 6.5v5.3c0 4.3 3.1 7.6 7.4 8.8 4.3-1.2 7.4-4.5 7.4-8.8V6.5z" /><path d="M9.2 12.2l2 2 3.7-4" /></svg>
              <span>沙箱与安全策略</span>

            <button class="settings-nav-item" data-act="settings-tab" data-tab="system">
              <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3" /><path d="M8 3.5v17M3.5 9h17M3.5 15h17" /></svg>
              <span>系统经济与指标</span>
            </button>
          </nav>
          <div class="settings-content" id="settingsContent">
            <section class="settings-tab-panel" id="settingsPanel-vital">
              <div id="pauseSwitchBox"></div>
            </section>
            <section class="settings-tab-panel" id="settingsPanel-prompts" hidden>
              <div id="promptBox"></div>
            </section>
            <section class="settings-tab-panel" id="settingsPanel-models" hidden>
              <div id="modelsBox"></div>
            </section>
            <section class="settings-tab-panel" id="settingsPanel-sandbox" hidden>
              <div id="sandboxBox"></div>
            </section>
            <section class="settings-tab-panel" id="settingsPanel-system" hidden>
              <div id="settingsBox"></div>
            </section>
          </div>
        </div>
      </div>
    </dialog>

    <script>
      // ------------------------------------------------------------- helpers
      const $ = (id) => document.getElementById(id);
      const esc = (value) =>
        String(value === null || value === undefined ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      const num = (value, digits) =>
        typeof value === "number" && Number.isFinite(value) ? value.toFixed(digits === undefined ? 2 : digits) : "—";
      const fullTime = (at) => (at ? new Date(at).toLocaleString("zh-CN") : "—");
      const relTime = (at) => {
        if (!at) return "—";
        const diff = Date.now() - at;
        if (diff < 5000) return "刚刚";
        const seconds = Math.floor(diff / 1000);
        if (seconds < 60) return seconds + " 秒前";
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return minutes + " 分钟前";
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return hours + " 小时前";
        return Math.floor(hours / 24) + " 天前";
      };
      const timeHtml = (at) => (at ? `<span title="${esc(fullTime(at))}">${esc(relTime(at))}</span>` : "—");
      const durText = (ms) => {
        if (typeof ms !== "number" || !Number.isFinite(ms) || ms < 0) return "—";
        const seconds = Math.round(ms / 1000);
        if (seconds < 60) return seconds + " 秒";
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return minutes + " 分 " + (seconds % 60) + " 秒";
        const hours = Math.floor(minutes / 60);
        return hours + " 小时 " + (minutes % 60) + " 分";
      };
      const firstLines = (text, count) =>
        String(text === null || text === undefined ? "" : text)
          .split("\n")
          .map((line) => line.trim())
          .filter((line) => line !== "")
          .slice(0, count)
          .join("\n");
      const ratioOf = (value, max) =>
        typeof value === "number" && typeof max === "number" && max > 0 ? Math.max(0, Math.min(1, value / max)) : 0;
      const satietyColor = (ratio) => (ratio >= 0.6 ? "var(--accent)" : ratio >= 0.3 ? "var(--warn)" : "var(--danger)");
      function withScroll(node, paint) {
        const top = node.scrollTop;
        const left = node.scrollLeft;
        paint();
        node.scrollTop = top;
        node.scrollLeft = left;
      }

      // --------------------------------------------------------------- api
      async function api(path, options) {
        const response = await fetch(path, options);
        const body = await response.json().catch(() => ({ ok: false, error: "返回不是 JSON" }));
        if (!response.ok || body.ok === false) {
          throw new Error(body.error || "请求失败");
        }
        return body;
      }
      const post = (path, payload) =>
        api(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload) });
      const alertError = (error) => alert(error instanceof Error ? error.message : String(error));

      // ------------------------------------------------------------- tables
      // Settings is deliberately NOT in this list: it is a floating modal, not a
      // page, so navigating never unloads the workspace the operator was reading.
      const PAGES = ["agents", "tasks", "income", "interventions"];
      const SETTINGS_TABS = ["vital", "prompts", "models", "sandbox", "system"];
      // Six tabs, deliberately ordered by how the operator reads an agent:
      // what it is doing, what body it is in, what it remembers, what it says,
      // what it owes, and what was done to it. Wounds live inside the memory
      // pane (the scar is a fact about the text) and the notebook has no
      // operator view at all.
      const TABS = [
        { id: "life", label: "生命动态" },
        { id: "body", label: "身体" },
        { id: "memory", label: "记忆" },
        { id: "messages", label: "留言" },
        { id: "tasks", label: "任务" },
        { id: "interventions", label: "干预记录" },
      ];
      const END_REASON = {
        final: "正常结束",
        context_cap: "上下文超限",
        iteration_cap: "工具调用超限",
        usage_missing: "用量缺失",
        model_error: "模型出错",
      };
      const MEM_KIND = {
        memory_new: "记忆已更新",
        memory_rejected: "记忆被拒绝",
        memory_error: "记忆模型出错",
        usage_missing: "记忆用量缺失",
      };
      const EVENT_LABEL = {
        meal: "进食",
        meal_refused: "进食被拒（余额不足）",
        redaction: "遮盖（夺走字符）",
        redaction_skipped: "遮盖跳过（没有可遮盖的字符）",
        treatment: "治疗",
        treatment_refused: "治疗被拒",
        death: "死亡",
        frozen_restored: "冻结句已恢复",
        memory_appended: "记忆追加了一轮",
        memory_compacted: "记忆压缩了旧轮次",
        memory_compaction_skipped: "记忆压缩跳过（旧轮次里还有伤口）",
        memory_compaction_failed: "记忆压缩失败（旧轮次原样保留）",
        memory_over_cap: "记忆已超上限（本轮照写）",
        task_claimed: "认领任务",
        task_submitted: "提交任务",
        income_reported: "申报收入",
        message_to_operator: "给操作员留言",
        worker_log: "子进程日志",
        worker_note: "子进程消息",
        claim_expired: "任务认领超时",
        worker_problem: "子进程异常",
        round_failed: "本轮执行失败",
        agent_created: "Agent 被创建",
        intervention: "操作员干预",
      };
      const TASK_STATUS = {
        open: "开放",
        claimed: "已认领",
        submitted: "待审核",
        accepted: "已接受",
        rejected: "已拒绝",
        rework: "返工中",
      };
      const INTERVENTION_KIND = {
        give_balance: "给予余额",
        give_satiety: "给予饱食度",
        conservatory_paused: "暂停温室",
        conservatory_resumed: "恢复温室",
        operator_treat: "操作员代为治疗",
        force_terminate: "操作员强制终止（死亡）",
        model_switched: "操作员切换模型",
        agent_erased: "操作员完全删除（抹除）",
      };
      const WOUND_STATUS = {
        untreated: "未治疗",
        scarred: "已留疤",
        healed: "已完全治愈",
      };
      const taskTagClass = (status) =>
        status === "accepted" ? "tag ok" : status === "rejected" ? "tag bad" : status === "submitted" ? "tag warn" : "tag";

      // -------------------------------------------------------------- state
      let state = null;
      let refreshError = null;
      let refreshing = false;
      let dlgAgent = null;
      let dlgTab = "life";
      let settingsTab = "vital";
      let settingsClosing = false;
      let settingsCloseHandler = null;
      let lifeRange = 5;
      // Life has two levels in one pane: `sessionSel === null` shows the
      // session list, otherwise the transcript of that one session.
      let sessionSel = null;
      let sessionCache = { agent: null, range: null, rounds: [] };
      let memSel = null;
      // The memory page has two perspectives. `false` is what the agent sees
      // (censor bars); `true` is the operator's, with the taken text put back.
      let memReveal = false;
      // The wound whose treatment card is open, keyed by agent so a poll
      // cannot carry one agent's open card onto another.
      let woundPop = null;
      let memCache = { agent: null, memory: "", records: [] };
      let memLoading = false;
      let extras = {};
      let taskFilter = "all";
      let taskSel = null;
      // The open-task editor and the review-note box keep whatever the operator
      // has typed, so the 3-second poll cannot reset a half-finished edit. The
      // structural key rebuilds the boxes only when the task really changes
      // shape; `renderTaskFields` is the only place text is written into them,
      // and it never overwrites a field that carries a draft.
      let taskDraft = null;
      let taskDetailKey = null;
      // The review note belongs to one task and survives a rebuild of its card.
      // The income note needs no such guard: a pending report's card is never
      // rebuilt by a poll, because its structural key cannot change while the
      // box exists, and switching reports deliberately drops the draft.
      let reviewNoteDraft = null;
      let incomeSel = null;
      let incomeKey = null;
      let intFilter = "";
      // The system-values panel keeps the text of every box the operator has
      // touched, so a poll repaint can never reset a number mid-keystroke. The
      // key is the panel's shape, not its numbers: the boxes are only rebuilt
      // when the layout really changes, and refilled only from a server answer.
      let sysValuesDraft = null;
      let sysValuesStatus = null;
      let sysValuesKey = null;
      let sysValuesSaving = false;
      // The sandbox panel keeps its own state: the server's last answer, the
      // operator's unsaved draft, and the two message lines. Polling repaints
      // it from the draft only, so a half-finished edit is never overwritten.
      let sandboxView = null;
      let sandboxDraft = null;
      let sandboxStatus = null;
      let sandboxHints = {};
      let sandboxLoading = false;
      // The model panel, the same shape as the sandbox one: the server's last
      // answer, the operator's unsaved draft, a status line, and the row being
      // edited. Polling repaints from the draft so an edit in progress is safe.
      let modelsView = null;
      let modelsDraft = null;
      let modelsStatus = null;
      let modelsEditingId = null;
      let modelsLoading = false;
      let modelsFetchedList = [];
      let modelsFetchedFilter = "";
      let modelsFetching = false;
      // The deferred-switch notice, held here so the next poll cannot erase it.
      let modelSwitchNotice = null;
      let loadedRoundAt = {};
      const slotDrafts = {};
      const readMarks = new Set(loadReadMarks());
      const dismissedNotices = new Set();
      // A message id alone would collide with a ledger that was recreated, so the
      // mark also carries the instant the message was written.
      const markOf = (message) => `${message.id}:${message.at}`;

      function loadReadMarks() {
        try {
          const raw = window.localStorage.getItem("conservatory.console.readMessages");
          const parsed = raw === null ? [] : JSON.parse(raw);
          return Array.isArray(parsed) ? parsed.filter((mark) => typeof mark === "string") : [];
        } catch (error) {
          return [];
        }
      }
      function saveReadMarks() {
        try {
          const marks = Array.from(readMarks).slice(-800);
          window.localStorage.setItem("conservatory.console.readMessages", JSON.stringify(marks));
        } catch (error) {
          /* a console without storage still works, it just forgets the read marks */
        }
      }

      // ------------------------------------------------------------ derived
      const agentByName = (name) =>
        state === null || name === null ? null : state.agents.find((agent) => agent.name === name) || null;
      const aliveAgents = () => (state === null ? [] : state.agents.filter((agent) => agent.status === "alive"));
      const messagesFor = (name) => (state === null ? [] : state.messages.filter((m) => m.sender === name || m.recipient === name));
      const unreadFor = (name) =>
        messagesFor(name).filter((m) => m.sender === name && m.readAt === null && !readMarks.has(markOf(m))).length;
      const unreadTotal = () =>
        state === null ? 0 : state.agents.reduce((sum, agent) => sum + unreadFor(agent.name), 0);
      const pendingSubmissions = () => (state === null ? 0 : state.tasks.filter((t) => t.status === "submitted").length);
      const pendingIncome = () => (state === null ? 0 : state.income.filter((r) => r.status === "pending").length);
      const noticeKey = (notice) => `${notice.agent}|${notice.at}|${notice.message}`;
      const liveNotices = () => (state === null ? [] : state.notices.filter((n) => !dismissedNotices.has(noticeKey(n))));
      const noticesFor = (name) => liveNotices().filter((n) => n.agent === name);
      const freeSlots = () => (state === null ? 0 : Math.max(0, state.config.maxSlots - aliveAgents().length));
      const isPaused = () => state !== null && state.paused === true;
      const pauseMinutes = () => {
        if (!isPaused()) return 0;
        const since = state.pausedSince;
        if (typeof since !== "number" || !Number.isFinite(since)) return 0;
        return Math.max(0, Math.floor((Date.now() - since) / 60000));
      };

      // ------------------------------------------------------------ routing
      function parseHash() {
        const raw = String(window.location.hash || "").replace(/^#\/?/, "");
        const parts = raw.split("/").filter((part) => part !== "").map(decodeURIComponent);
        const page = PAGES.indexOf(parts[0]) >= 0 ? parts[0] : "agents";
        const agent = page === "agents" && parts.length >= 2 && parts[1] !== "" ? parts[1] : null;
        const tab = TABS.some((t) => t.id === parts[2]) ? parts[2] : "life";
        return { page, agent, tab };
      }
      function navigate(hash) {
        if (window.location.hash === hash) {
          applyRoute();
        } else {
          window.location.hash = hash;
        }
      }
      function applyRoute() {
        const route = parseHash();
        for (const page of PAGES) {
          $(`page-${page}`).classList.toggle("active", page === route.page);
        }
        document.querySelectorAll(".nav-item[data-page]").forEach((item) => {
          item.classList.toggle("active", item.dataset.page === route.page);
        });
        const known = route.agent !== null && state !== null && agentByName(route.agent) !== null;
        if (known) {
          openAgentUi(route.agent, route.tab);
        } else if ($("dlg").open) {
          // Clear the owner before closing: the close handler must not fight the
          // route that is being navigated to (for example #/tasks).
          dlgAgent = null;
          $("dlg").close();
        }
      }
      function openAgentUi(name, tab) {
        const chosen = TABS.some((t) => t.id === tab) ? tab : "life";
        if (dlgAgent !== name) {
          dlgAgent = name;
          // The model-switch banner belongs to the agent it was raised for, so
          // opening a different one clears it rather than showing it there.
          modelSwitchNotice = null;
          sessionSel = null;
          memSel = null;
          memReveal = false;
          woundPop = null;
          sessionCache = { agent: null, range: null, rounds: [] };
          memCache = { agent: null, memory: "", records: [] };
          resetAgentPanes();
          // Remember where the agent stood when the dialog opened; only a fetch
          // may move this marker forward, otherwise a poll would hide new rounds.
          const opened = agentByName(name);
          loadedRoundAt[name] = opened === null ? undefined : opened.lastRoundAt;
        }
        const tabChanged = dlgTab !== chosen;
        dlgTab = chosen;
        if (!$("dlg").open) $("dlg").showModal();
        paintDialogTabs();
        paintDialogHeader();
        paintPanes();
        void loadTab(dlgTab, tabChanged);
      }
      const openAgent = (name, tab) => navigate(`#/agents/${encodeURIComponent(name)}/${tab || "life"}`);
      const closeAgent = () => navigate("#/agents");
      const goPage = (page) => navigate(`#/${page}`);

      // ------------------------------------------------------ settings modal
      // The modal never touches the hash, so `applyRoute()` and the page the
      // operator was reading are both untouched by open and close.
      function paintSettingsTabs() {
        for (const button of document.querySelectorAll(".settings-nav-item")) {
          button.classList.toggle("active", button.dataset.tab === settingsTab);
        }
        for (const tab of SETTINGS_TABS) {
          const panel = $(`settingsPanel-${tab}`);
          if (panel !== null) panel.hidden = tab !== settingsTab;
        }
      }
      function switchSettingsTab(tab) {
        settingsTab = SETTINGS_TABS.indexOf(tab) >= 0 ? tab : "vital";
        paintSettingsTabs();
        // Both of these panels live on their own routes rather than in
        // /api/state, so each re-reads when its tab is opened: what the operator
        // sees is what the server is actually holding, not a stale draft from
        // the last visit. The model draft is refreshed rather than replaced —
        // `applyModelsView` rebuilds it and `renderModels` repaints from it.
        if (settingsTab === "models") void loadModelsConfig();
        if (settingsTab === "sandbox") void loadSandboxConfig();
      }
      function openSettingsDlg(tab = "vital") {
        // Cancel a close that is still mid-animation, otherwise the pending
        // `close()` would shut the dialog that was just reopened.
        settingsClosing = false;
        $("settingsDlg").classList.remove("is-closing");
        switchSettingsTab(tab);
        if (!$("settingsDlg").open) $("settingsDlg").showModal();
        // The panels are built lazily, so opening paints them once immediately
        // instead of waiting up to one poll interval for the first content.
        paintSettingsPage();
        paintPromptPanel();
        paintSandboxPanel();
      }
      function closeSettingsDlg() {
        const dlg = $("settingsDlg");
        if (!dlg.open || settingsClosing) return;
        settingsClosing = true;
        dlg.classList.add("is-closing");
        // A reopen can still have the entry animation in flight; only the exit
        // animation may settle this close. The timer is the safety net for a
        // dropped event (and for `prefers-reduced-motion`, where the animation
        // still ends, so it only ever fires after the real one).
        const finish = () => {
          if (settingsCloseHandler !== null) {
            dlg.removeEventListener("animationend", settingsCloseHandler);
            settingsCloseHandler = null;
          }
          if (!settingsClosing) return;
          settingsClosing = false;
          dlg.classList.remove("is-closing");
          if (dlg.open) dlg.close();
        };
        settingsCloseHandler = (event) => {
          if (event.animationName === "settings-out") finish();
        };
        dlg.addEventListener("animationend", settingsCloseHandler);
        setTimeout(finish, 320);
      }

      // ------------------------------------------------------------- paints
      function paint() {
        paintNav();
        paintRailFoot();
        paintPauseBanner();
        paintNotices();
        paintAgentsPage();
        paintTasksPage();
        paintIncomePage();
        paintInterventionsPage();
        paintSettingsPage();
        paintPromptPanel();
        paintModelsPanel();
        paintSandboxPanel();
        paintDialogHeader();
        paintPanes();
      }
      function paintNav() {
        const counts = { agents: unreadTotal(), tasks: pendingSubmissions(), income: pendingIncome() };
        for (const key of Object.keys(counts)) {
          const badge = document.querySelector(`[data-badge="${key}"]`);
          if (badge === null) continue;
          const value = counts[key];
          badge.hidden = value === 0;
          badge.textContent = value > 99 ? "99+" : String(value);
        }
      }

      function paintRailFoot() {
        const host = $("railFoot");
        if (state === null) return;
        const busy = state.agents.filter((agent) => agent.busy).length;
        const alive = aliveAgents().length;
        const cap = state.config.maxSlots;
        const dead = state.agents.length - alive;
        const error = refreshError === null ? "" : `<div class="rail-error">刷新失败：${esc(refreshError)}</div>`;
        const role = error === "" ? (isPaused() ? "已冻结" : "运行中") : "离线";
        const led = error !== "" ? "red" : isPaused() ? "standby" : "";
        // The clock is deliberately NOT part of the cache key: it ticks every
        // poll, and rebuilding the chips for it would restart the pulsing LED.
        const key = `${alive}|${cap}|${busy}|${dead}|${led}|${role}|${refreshError === null ? "" : refreshError}`;
        if (host.dataset.key !== key) {
          host.dataset.key = key;
          host.innerHTML =
            `<div class="rail-chip"><span class="led ${led}"></span><span class="chip-k">状态</span>` +
            `<span class="chip-v ${error !== "" ? "bad" : isPaused() ? "warn" : "accent"}">${role}</span></div>` +
            `<div class="rail-chip"><span class="chip-k">存活</span>` +
            `<span class="chip-v accent">${alive}<span class="chip-u"> / ${cap}</span></span></div>` +
            `<div class="rail-chip"><span class="chip-k">一轮中</span><span class="chip-v">${busy}</span></div>` +
            (dead > 0
              ? `<div class="rail-chip"><span class="chip-k">已死亡</span><span class="chip-v bad">${dead}</span></div>`
              : "") +
            `<div class="rail-chip"><span class="chip-k">刷新</span>` +

        const vital = $("brandVital");
        if (vital === null) return;
        const degraded = refreshError !== null;
        const paused = isPaused();
        vital.className = `vital${degraded ? " bad" : paused ? " warn" : ""}`;
        vital.title = degraded ? `刷新失败：${refreshError}` : paused ? "温室已暂停：时间冻结" : "温室运行中";
      }
      // Built once as well: polling only writes the checked radio, the hint and
      // the template rows, so a click on the mode or the reload button survives
      // every refresh.
      function paintPromptPanel() {
        if (state === null || state.prompts === undefined) return;
        const box = $("promptBox");
        if (box.dataset.built !== "1") {
          box.dataset.built = "1";
          box.innerHTML =
            `<section class="mod span2" id="promptModule">` +
            `<div class="mod-head">` +
            `<span class="mod-icon">` +
            `<svg viewBox="0 0 24 24"><path d="M14.5 3.5 6 13h5l-1.5 7.5L18 11h-5z" /></svg>` +
            `</span>` +
            `<span class="mod-head-text"><span class="mod-title">提示词加载引擎</span>` +
            `<span class="mod-sub">模板文件如何进入每一轮唤醒的上下文</span></span>` +
            `<span id="promptHealth"></span>` +
            `</div>` +
            `<div class="mod-body">` +
            `<div class="row">` +
            `<span class="seg" role="radiogroup" aria-label="提示词加载模式">` +
            `<label class="seg-opt" title="每次唤醒都读文件最新内容">` +
            `<input type="radio" name="promptMode" value="hot" data-act="prompt-mode" />` +
            `<span class="seg-face"><span class="led"></span>实时热加载</span></label>` +
            `<label class="seg-opt" title="读一次进内存，改动要手动重新加载">` +
            `<input type="radio" name="promptMode" value="cached" data-act="prompt-mode" />` +
            `<span class="seg-face"><span class="led"></span>内存缓存</span></label>` +
            `</span>` +
            `<span class="grow"></span>` +
            `<button class="btn tiny" data-act="prompt-reload" id="promptReload">重新加载提示词</button>` +
            `</div>` +
            `<div class="small muted" id="promptHint"></div>` +
            `<div id="promptRows"></div>` +
            `</div></section>`;
        }
        const status = state.prompts;
        const cached = status.mode === "cached";
        for (const input of box.querySelectorAll('input[name="promptMode"]')) {
          input.checked = input.value === status.mode;
        }
        const health = $("promptHealth");
        health.className = status.healthy ? "pill ok" : "pill warn";
        health.textContent = status.healthy ? "正常" : "警告";
        $("promptHint").textContent = cached
          ? "已缓存：修改 prompts/ 下的文件后，需点『重新加载提示词』才生效。"
          : "实时热加载：每次唤醒都读取文件最新内容，保存后即刻生效，无需重启服务。";
        $("promptReload").disabled = !cached;
        const host = $("promptRows");
        const key = JSON.stringify({ mode: status.mode, dir: status.dir, templates: status.templates, warnings: status.warnings });
        if (host.dataset.key === key) return;
        host.dataset.key = key;
        // The operator needs to know which template is live and which one fell
        // back to the built-in copy. The absolute disk path is noise, so each
        // card shows the file name, its health, and only the folder that holds
        // them; the full path stays available as a tooltip.
        const cards = status.templates
          .map((template) => {
            const fallback = template.warning !== null;
            return (
              `<div class="tpl-card${fallback ? " bad" : ""}" title="${esc(template.path)}">` +
              `<span class="pill ${fallback ? "warn" : "ok"}">${fallback ? "兜底" : "正常"}</span>` +
              `<span class="tpl-file">${esc(template.file)}</span>` +
              `<span class="tpl-dir">${esc(status.dir)}</span>` +
              `</div>`
            );
          })
          .join("");
        host.innerHTML =
          `<div class="tpl-list">${cards}</div>` +
          (status.warnings.length === 0
            ? ""
            : `<div class="banner warn" style="margin-top: 10px">${status.warnings.map(esc).join("<br />")}</div>`);
      }
      // The config was one flat table. It is now a bento of domain modules:
      // every value keeps its exact meaning, but each number gets a unit, a
      // domain and an order of importance, and the raw JSON folds away
      // underneath. Modules 1 and 2 (life clock, prompt engine) keep their own
      // boxes — #pauseSwitchBox and #promptBox — because polling must never
      // rebuild an input the operator is interacting with; modules 3 to 5 are
      // rebuilt here, and every one of them is read-only display.
      // ------------------------------------------------ system values panel
      // The body's numbers, editable in place. The server owns the rules — this
      // panel only draws the boxes and sends what they hold, and reports the
      // Chinese reason the server gives back when a number is refused.

      /**
       * The editable numbers, grouped by the card they appear on. `key` is the
       * field name in conservatory.config.json, so the box and the request it
       * sends always name the same thing, and the server's validator is the
       * only place the rules live.
       */
      const SYS_CARDS = [
        {
          id: "vital",
          title: "具身生理与代谢",
          sub: "饱食度、神经痛觉遮盖与那条不可跨越的死亡线",
          icon: '<svg viewBox="0 0 24 24"><path d="M3 12.5h3.4l1.9-5.2 2.8 9.4 2.1-6.1 1.5 3.2H21" /></svg>',
          fields: [
            { key: "satietyMax", label: "饱食度上限", unit: "饱食度", note: "出生时的满值，也是每次进食的封顶。" },
            { key: "initialSatiety", label: "出生饱食度", unit: "饱食度", note: "新 Agent 出生那一刻的饱食度，不能超过上限。" },
            { key: "satietyDecayPerSecond", label: "衰减速度", unit: "/ 秒", note: "只随墙上时间下降，永不自动回满。改它会按当前时刻重新锚定，不追溯过去。" },
            { key: "redactionIntervalSeconds", label: "遮盖间隔", unit: "秒", note: "饱食度为 0 之后，每隔这么久夺走一次字符。" },
            { key: "redactionCharsPerTick", label: "每次遮盖字数", unit: "字", note: "每一次遮盖从 MEMORY 里夺走的字符数。" },
            { key: "redactionMinRanges", label: "单次最少伤口数", unit: "处", note: "一次遮盖至少要开几个口子。" },
            { key: "redactionMaxRanges", label: "单次最多伤口数", unit: "处", note: "一次遮盖最多开几个口子，不能超过每次遮盖字数。" },
            { key: "deathLineChars", label: "死亡线", unit: "字", note: "未治疗遮盖累计到此，Agent 死亡且不可逆。", tone: "danger" },
          ],
        },
        {
          id: "economy",
          title: "壳内生存经济",
          sub: "汇率、进食价格与治疗的代价",
          icon: '<svg viewBox="0 0 24 24"><path d="M12 3.6v16.8M16.4 7.2H9.8a2.9 2.9 0 0 0 0 5.8h4.4a2.9 2.9 0 0 1 0 5.8H7.6" /></svg>',
          fields: [
            { key: "exchangeRate", label: "USD 兑换汇率", unit: "余额 / USD", note: "收入按核实金额乘这个汇率入账。留空表示「未设定」，此时收入申报无法核验。", placeholder: "留空为未设定" },
            { key: "initialBalance", label: "出生初始余额", unit: "余额", note: "新 Agent 出生时账上的余额。" },
            { key: "mealPrice", label: "一餐价格", unit: "余额", note: "Agent 自己买一餐要花的余额。" },
            { key: "satietyPerMeal", label: "一餐恢复", unit: "饱食度", note: "吃掉一餐后恢复的饱食度。" },
            { key: "ordinaryTreatmentPrice", label: "普通治疗", unit: "余额", note: "留下疤痕：之后不再计入死亡线。" },
            { key: "completeTreatmentPrice", label: "完全治疗", unit: "余额", note: "不留任何痕迹，像从未受伤。" },
            { key: "heartbeatSeconds", label: "心跳间隔", unit: "秒", note: "每隔这么久，温室检查一次是否该唤醒谁。" },
          ],
        },
        {
          id: "capacity",
          title: "记忆与容量上限",
          sub: "MEMORY 的边界、一轮的上下文预算与温室里的槽位",
          icon: '<svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3" /><path d="M8 3.5v17M3.5 9h17M3.5 15h17" /></svg>',
          fields: [
            { key: "memoryCapChars", label: "MEMORY 上限", unit: "字", note: "记忆的目标体积。超过它时本轮照写，只在黑匣子里记一条警告。" },
            { key: "roundContextCapTokens", label: "一轮上下文上限", unit: "token", note: "超过就截断并结束这一轮。" },
            { key: "maxToolCallsPerRound", label: "单轮工具调用上限", unit: "次", note: "一轮里最多允许几次工具调用，超过就强制结束这一轮。" },
            { key: "modelRequestTimeoutSeconds", label: "模型请求超时", unit: "秒", note: "单次模型请求最多等多久，超时即放弃。" },
            { key: "taskClaimTimeoutHours", label: "任务认领超时", unit: "小时", note: "超时自动把任务送回任务板。" },
            { key: "maxSlots", label: "槽位上限", unit: "个", note: "温室最多能同时养多少个 Agent。" },
            { key: "consolePort", label: "控制台端口", unit: "", note: "只写回配置文件；端口在启动时绑定，下次重启才生效。", restart: true },
          ],
        },
      ];
      const SYS_FIELDS = SYS_CARDS.reduce((all, card) => all.concat(card.fields), []);
      const SYS_FIELD_BY_KEY = new Map(SYS_FIELDS.map((field) => [field.key, field]));

      /** One editable number: the box takes the value's place, mono and all. */
      function sysFieldHtml(field) {
        const label = field.unit === "" ? field.label : `${field.label}（${field.unit}）`;
        const placeholder = field.placeholder === undefined ? "" : ` placeholder="${esc(field.placeholder)}"`;
        return (
          `<div class="metric${field.tone === undefined ? "" : " tone-" + field.tone}">` +
          `<label class="metric-k" for="sys-${field.key}">${esc(label)}` +
          (field.restart === true ? `<span class="pill warn">需重启</span>` : "") +
          `</label>` +
          `<div class="metric-v">` +
          `<input id="sys-${field.key}" data-sys-field="${field.key}" type="number" step="any"${placeholder} />` +
          `</div>` +
          `<div class="metric-note">${esc(field.note)}</div>` +
          `</div>`
        );
      }

      function buildSysPanel() {
        const box = $("settingsBox");
        if (box === null || state === null) return;
        const config = state.config;
        const alive = aliveAgents().length;
        const dead = state.agents.length - alive;
        // The two compound readouts a flat table of numbers could never express:
        // how long a full belly buys before the first character is taken, and
        // how long the body lasts to the death line.
        const derived =
          `<div class="metric"><div class="metric-k">从满腹到开始遮盖</div>` +
          `<div class="metric-v" id="sysStarveSpan">—</div>` +
          `<div class="metric-note">饱食度从满值自然衰减到 0 所需的时长。</div></div>` +
          `<div class="metric tone-danger wide"><div class="metric-k">从满腹到死亡线</div>` +
          `<div class="metric-v" id="sysLifeSpan">—</div>` +
          `<div class="metric-note">不吃不治、按当前节奏一路走完的寿命上限。</div></div>`;
        const cardHtml = (card) => {
          const pill =
            card.id === "vital"
              ? `<span class="pill bad" id="sysDeathPill">死亡线 ${esc(String(config.deathLineChars))} 字</span>`
              : card.id === "capacity"
                ? `<span class="pill ${dead > 0 ? "warn" : "info"}" id="sysSlotPill">槽位 ${state.agents.length} / ${esc(String(config.maxSlots))}</span>`
                : `<span id="sysRatePill"></span>`;
          const hint =
            card.id === "vital"
              ? `<div class="hint-line">治疗不在这里发生：Agent 用自己的余额买治疗，操作员代为治疗则记作一次干预。死亡是唯一无法回头的锁。</div>`
              : "";
          return (
            `<section class="mod${card.id === "capacity" ? " span2" : ""}">` +
            `<div class="mod-head">` +
            `<span class="mod-icon">${card.icon}</span>` +
            `<span class="mod-head-text"><span class="mod-title">${esc(card.title)}</span>` +
            `<span class="mod-sub">${esc(card.sub)}</span></span>` +
            pill +
            `</div>` +
            `<div class="mod-body">` +
            (card.id === "economy" ? `<div id="sysRateBanner"></div>` : "") +
            `<div class="metric-grid${card.id === "capacity" ? " cols-4" : ""}">` +
            card.fields.map(sysFieldHtml).join("") +
            (card.id === "vital" ? derived : "") +
            `</div>` +
            hint +
            `</div></section>`
          );
        };
        box.innerHTML =
          `<div class="settings-bento">` +
          SYS_CARDS.map(cardHtml).join("") +
          `</div>` +
          `<div class="row" style="margin-top: 12px">` +
          `<button class="btn primary" data-act="sys-values-save">保存参数</button>` +
          `<button class="btn" data-act="sys-values-reset">重置为当前生效值</button>` +
          `<span class="grow"></span>` +
          `<span class="small" id="sysValuesStatus"></span>` +
          `</div>` +
          `<details class="raw-config" style="margin-top: 12px">` +
          `<summary>当前生效的配置 JSON</summary>` +
          `<pre class="mono" id="sysRawConfig"></pre>` +
          `</details>` +
          `<div class="hint-line" style="margin-top: 12px">改动点「保存参数」会写回 conservatory.config.json 并立即生效，不需要重启；只有控制台端口要下次启动才生效。</div>`;
      }

      /**
       * Fills the boxes and the readouts. `fillNumbers` is true only for a
       * server answer: every other repaint leaves the boxes exactly as the
       * operator left them. A drafted box is never refilled at all.
       */
      function renderSysValues(fillNumbers) {
        if (state === null) return;
        const config = state.config;
        const rate = state.exchangeRate;
        if (fillNumbers === true) {
          for (const field of SYS_FIELDS) {
            const input = $(`sys-${field.key}`);
            if (input === null) continue;
            const drafted = sysValuesDraft === null ? undefined : sysValuesDraft[field.key];
            if (drafted !== undefined) {
              if (input.value !== drafted) input.value = drafted;
              continue;
            }
            let wanted;
            if (field.key === "exchangeRate") {
              wanted = typeof rate === "number" && Number.isFinite(rate) ? String(rate) : "";
            } else {
              const value = config[field.key];
              wanted = typeof value === "number" && Number.isFinite(value) ? String(value) : "";
            }
            // Written only when it really differs: assigning the same string
            // back to a focused input resets the caret to the end, which would
            // move the cursor out from under a number being typed.
            if (input.value !== wanted) input.value = wanted;
          }
        }
        const starvationMs =
          config.satietyDecayPerSecond > 0 ? (config.satietyMax / config.satietyDecayPerSecond) * 1000 : null;
        const redactionSpanMs =
          (config.deathLineChars / Math.max(1, config.redactionCharsPerTick)) *
          config.redactionIntervalSeconds *
          1000;
        const totalLifeMs = starvationMs === null ? null : starvationMs + redactionSpanMs;
        const starve = $("sysStarveSpan");
        if (starve !== null) starve.textContent = durText(starvationMs);
        const life = $("sysLifeSpan");
        if (life !== null) life.textContent = durText(totalLifeMs);
        const deathPill = $("sysDeathPill");
        if (deathPill !== null) deathPill.textContent = `死亡线 ${String(config.deathLineChars)} 字`;
        const slotPill = $("sysSlotPill");
        if (slotPill !== null) slotPill.textContent = `槽位 ${state.agents.length} / ${String(config.maxSlots)}`;
        const ratePill = $("sysRatePill");
        if (ratePill !== null) {
          ratePill.className = rate === null ? "pill bad" : "pill ok";
          ratePill.textContent = rate === null ? "汇率未设定" : `1 USD = ${num(rate)}`;
        }
        const banner = $("sysRateBanner");
        if (banner !== null) {
          banner.innerHTML = rate === null ? `<div class="banner danger">${rateBannerHtml()}</div>` : "";
        }
        const raw = $("sysRawConfig");
        if (raw !== null) {
          raw.textContent = JSON.stringify({ ...config, exchangeRate: rate }, null, 2);
        }
        const status = $("sysValuesStatus");
        if (status !== null) {
          status.textContent = sysValuesStatus === null ? "" : sysValuesStatus.text;
          status.style.color = sysValuesStatus !== null && sysValuesStatus.tone === "bad" ? "var(--danger)" : "";
        }
      }

      /**
       * The value a box should hold for a field, straight off the server's
       * answer. `exchangeRate` may legitimately be null, which the box shows as
       * empty — the same thing the operator types to clear it.
       */
      function sysServerValue(fieldKey) {
        if (state === null) return "";
        if (fieldKey === "exchangeRate") {
          return typeof state.exchangeRate === "number" && Number.isFinite(state.exchangeRate)
            ? String(state.exchangeRate)
            : "";
        }
        const value = state.config[fieldKey];
        return typeof value === "number" && Number.isFinite(value) ? String(value) : "";
      }

      /**
       * Every box's text, as the operator currently has it. A box that was never
       * touched reads back what the server last said, so a save always sends a
       * complete set of numbers rather than only the ones that were edited.
       *
       * A blank box is reported rather than coerced: `Number("")` is 0, so a box
       * the operator cleared by accident would otherwise be saved as a real zero
       * and quietly turn a price into "free".
       */
      function collectSysValues() {
        const patch = {};
        let blank = null;
        for (const field of SYS_FIELDS) {
          const input = $(`sys-${field.key}`);
          const text = input === null ? "" : String(input.value).trim();
          if (field.key === "exchangeRate") {
            // Empty means "not set", which is a value in its own right here.
            patch[field.key] = text === "" ? null : Number(text);
            continue;
          }
          if (text === "") {
            if (blank === null) blank = field.label;
            continue;
          }
          patch[field.key] = Number(text);
        }
        return { patch, blank };
      }

      function markSysEdited(key) {
        if (sysValuesDraft === null) sysValuesDraft = {};
        const input = $(`sys-${key}`);
        if (input === null) return;
        // Compared against the live server value, so typing a number back to
        // what it already was drops the draft and lets the panel follow the
        // server again.
        sysValuesDraft[key] = input.value === sysServerValue(key) ? undefined : input.value;
      }

      function resetSysValues() {
        sysValuesDraft = null;
        sysValuesStatus = { tone: "ok", text: "已重置为当前生效值。" };
        renderSysValues(true);
      }

      async function saveSysValues() {
        if (sysValuesSaving) return;
        const collected = collectSysValues();
        if (collected.blank !== null) {
          sysValuesStatus = { tone: "bad", text: `「${collected.blank}」请填写一个数字。` };
          renderSysValues(false);
          return;
        }
        sysValuesSaving = true;
        try {
          await post("/api/settings/values", collected.patch);
          // The server answered, so its numbers are the truth again.
          sysValuesDraft = null;
          await refresh();
          sysValuesStatus = {
            tone: "ok",
            text: "参数已保存并立即生效（已写回 conservatory.config.json）。",
          };
        } catch (error) {
          // Nothing was changed server-side, so the operator's text stays on
          // screen next to the reason it was refused.
          sysValuesStatus = { tone: "bad", text: error instanceof Error ? error.message : String(error) };
        } finally {
          sysValuesSaving = false;
          renderSysValues(false);
        }
      }

      function paintSettingsPage() {
        if (state === null) return;
        paintPauseSwitch();
        const rate = state.exchangeRate;
        const alive = aliveAgents().length;
        // Only the shape is in this key. The numbers themselves are filled in by
        // `renderSysValues`, which knows to leave a live draft alone — so a
        // change to a value does not rebuild the boxes the operator is typing in.
        const key = JSON.stringify({ rateSet: rate !== null, agents: state.agents.length, alive });
        if (key !== sysValuesKey) {
          sysValuesKey = key;
          buildSysPanel();
        }
        renderSysValues(true);
      }

      // ---------------------------------------------------- dialog chrome
      function paintDialogTabs() {
        const host = $("dlgTabs");
        if (host.dataset.built !== "1") {
          host.dataset.built = "1";
          host.innerHTML = TABS.map(
            (tab) => `<button class="tab" data-act="dlg-tab" data-tab="${tab.id}">${esc(tab.label)}</button>`,
          ).join("");
        }
        for (const button of host.querySelectorAll("button[data-tab]")) {
          button.classList.toggle("active", button.dataset.tab === dlgTab);
        }
        for (const tab of TABS) {
          $(`pane-${tab.id}`).classList.toggle("active", tab.id === dlgTab);
        }
      }
      function paintDialogHeader() {
        const frozen = $("dlgFrozen");
        if (frozen !== null) frozen.hidden = !isPaused();
        const agent = agentByName(dlgAgent);
        if (agent === null) {
          $("dlgName").textContent = "—";
          $("dlgState").textContent = "—";
          $("dlgSat").textContent = "—";
          $("dlgBal").textContent = "—";
          $("dlgBar").style.width = "0";
          $("dlgWake").hidden = true;
          return;
        }
        const ratio = ratioOf(agent.satiety, agent.satietyMax);
        $("dlgName").textContent = agent.name;
        $("dlgDot").className = `dot ${agent.busy ? "busy" : ""}`;
        $("dlgState").textContent =
          agent.status !== "alive" ? "已死亡" : agent.busy ? "一轮中" : "空闲";
        $("dlgBar").style.width = (ratio * 100).toFixed(1) + "%";
        $("dlgBar").style.background = satietyColor(ratio);
        $("dlgSat").textContent = num(agent.satiety);
        $("dlgSat").title = `${num(agent.satiety)} / ${num(agent.satietyMax)}`;
        $("dlgBal").textContent = num(agent.balance);
        // A dead agent has no wake, no food, no money: the controls are gone,
        // and the server refuses the same calls anyway.
        $("dlgWake").hidden = agent.status !== "alive";
        $("dlgWake").dataset.agent = agent.name;
        // The wake request now returns as soon as the round starts, so the
        // button cannot show progress by staying disabled. It shows it by
        // naming the state instead: a second click during a round would be
        // refused by the server anyway, and saying so is clearer than a
        // request that silently does nothing.
        $("dlgWake").disabled = agent.busy === true;
        $("dlgWake").textContent = agent.busy === true ? "一轮进行中…" : "唤醒";
        $("chatInput").placeholder = `给 ${agent.name} 留言…`;

      function paintPanes() {

      // ------------------------------------------------------- life tab
      // One "session" is one wake-up: the harness builds a context, the model
      // thinks, calls tools, and ends the session with a reply. Internally the
      // ledger numbers these rounds, but the operator reads them as sessions
      // and never sees the round number.
      function roundStartAt(round) {
        const start = round.entries.filter((entry) => entry.kind === "round_start").pop();
        if (start !== undefined) return start.at;
        return round.entries.length > 0 ? round.entries[0].at : null;
      }
      function roundEndEntry(round) {
        return round.entries.filter((entry) => entry.kind === "round_end").pop() || null;
      }
      const roundContextEntry = (round) => round.entries.filter((entry) => entry.kind === "context").pop() || null;
      function roundUsage(round, source) {
        const list = round.entries.filter((entry) => entry.kind === "usage" && entry.source === source);
        return {
          count: list.length,
          missing: round.entries.filter((entry) => entry.kind === "usage_missing" && entry.source === source).length,
          prompt: list.reduce((sum, entry) => sum + (typeof entry.promptTokens === "number" ? entry.promptTokens : 0), 0),
          completion: list.reduce(
            (sum, entry) => sum + (typeof entry.completionTokens === "number" ? entry.completionTokens : 0),
            0,
          ),
        };
      }
      /** The session's own token spend: the agent model, not the memory model. */
      function roundTokens(round) {
        const agent = roundUsage(round, "agent");
        const memory = roundUsage(round, "memory");
        return {
          prompt: agent.prompt + memory.prompt,
          completion: agent.completion + memory.completion,
          total: agent.prompt + agent.completion + memory.prompt + memory.completion,
          missing: agent.missing + memory.missing,
        };
      }
      function sessionStatus(round) {
        const end = roundEndEntry(round);
        if (end === null) {
          return { cls: "tag ok", text: "进行中", reason: null };
        }
        const reason = end.endReason;
        return {
          cls: reason === "final" ? "tag ok" : reason === "model_error" ? "tag bad" : "tag warn",
          text: END_REASON[reason] || reason || "已结束",
          reason,
        };
      }

        const end = roundEndEntry(round);
        if (end !== null && typeof end.finalReply === "string" && end.finalReply.trim() !== "") {
          return { text: end.finalReply, partial: false };
        }
        const said = round.entries
          .filter((entry) => entry.kind === "assistant_message")
          .map((entry) => (entry.message === null || entry.message === undefined ? null : entry.message.content))
          .filter((content) => typeof content === "string" && content.trim() !== "");

          return { text: said[said.length - 1], partial: true };
        }
        return { text: "", partial: true };
      }
      function paintLifeLevels() {
        const list = $("lifeSessions");
        const transcript = $("lifeTranscript");

      }
      function paintSessionList() {

                const tokens = roundTokens(round);
                const calls = round.entries.filter((entry) => entry.kind === "tool_call").length;
                const reply = sessionReply(round);

      function toolTitle(entry) {

          case "eat":
            return "购买了食物";
          case "list_wounds":
            return "查看了伤口";
          case "treat":
            return "治疗了伤口";
          case "list_tasks":
            return "查看了任务板";
          case "claim_task":
            return "认领了任务";
          case "submit_task":
            return "提交了任务";
          case "report_income":
            return "申报了收入";
          case "message_operator":
            return "给操作员留言";
          case "message_agent":
            return "给其他 Agent 留言";
          case "list_agents":
            return "查看了其它 Agent";
          case "transfer_balance":
            return "转移了余额";
          case "notebook_list":
            return "查看了记事本";
          case "notebook_read":

        const parts = [];
        parts.push(

                `<summary class="small muted" style="cursor: pointer">展开推理思考过程（${reasoning.length} 字）</summary>` +
                `<pre class="mono" style="margin-top: 4px; white-space: pre-wrap">${esc(reasoning)}</pre>` +
                `</details>`;

        const events = entries.filter((entry) =>
          [

            "meal_refused",
            "task_claimed",
            "task_submitted",
            "income_reported",
            "message_to_operator",

            entries.map((entry) => JSON.stringify(entry)).join("\n"),
          )}</pre></details>`,

      }
      /**
       * Which folded blocks are open, named so the names survive a repaint.

      function modelSwitchHtml(agent) {

        if (roster === null || !Array.isArray(roster.providers) || roster.providers.length === 0) {
