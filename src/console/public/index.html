          wounds.map((wound) => `${wound.id}:${wound.status}`).join(",");
        if (host.dataset.key !== key) {
          host.dataset.key = key;
          if (normalized === "") {
            repaint(host, '<div class="mem-line">（MEMORY 为空）</div>');
          } else {
            let start = 0;
            // `start` walks the normalised text so every line knows its own
            // character range, which is what places a wound inside it.
            const lines = normalized.split("\n");
            repaint(
              host,
              lines
                .map((line, index) => {
                  const lineStart = start;
                  const lineEnd = start + line.length;
                  start = lineEnd + 1;
                  const body = memoryLineHtml(normalized, lineStart, lineEnd, edits, memReveal);
                  return index < 2
                    ? `<div class="mem-line mem-born">${body}${index === 0 ? '<span class="hint">出生记录</span>' : ""}</div>`
                    : `<div class="mem-line">${body}</div>`;
                })
                .join(""),
            );
          }
        }
        paintWoundChips(wounds, edits);
        paintWoundPop();
        paintMemRecords();
        paintMemCompare();
      }
      /**
       * A row of every active wound, inside the status bar.
       *
       * A wound is a black bar somewhere in a file that can be a megabyte
       * long, and until now the only way to treat one was to find its bar by
       * eye. The chips are the index: numbered, in the order they appear in
       * the text, with any that could not be anchored in the text at all
       * listed after — those are exactly the ones the operator could not have
       * found otherwise, so they are the ones that most need a door.
       *
       * Clicking a chip opens the treatment card, which is why a chip is a
       * complete fallback for a bar the page failed to place.
       */
      function paintWoundChips(wounds, edits) {
        const active = wounds.filter((wound) => wound.status !== "healed");
        if (active.length === 0) return;
        const placed = [];
        const seen = new Set();
        for (const edit of edits) {
          if (edit.wound.status === "healed" || seen.has(edit.wound.id)) continue;
          seen.add(edit.wound.id);
          placed.push(edit.wound);
        }
        for (const wound of active) {
          if (!seen.has(wound.id)) {
            seen.add(wound.id);
            placed.push(wound);
          }
        }
        const chips = placed
          .map(
            (wound) =>
              `<button type="button" class="btn tiny ${woundPop === wound.id ? "primary" : ""}" ` +
              `data-act="wound-open" data-wound="${wound.id}" ` +
              `title="点击打开伤口 #${wound.id} 的治疗卡片">#${wound.id} · ${esc(
                WOUND_STATUS[wound.status] || wound.status,
              )}（${wound.length} 字）</button>`,
          )
          .join("");
        $("memStats").insertAdjacentHTML(
          "beforeend",
          `<span class="mem-wounds" data-role="wound-chips">${chips}</span>`,
        );
      }
      /**
       * Marks the chip of the wound whose card is open.
       *
       * Kept separate from the row itself so a click can move the highlight
       * without rebuilding the row, which would replace the button that was
       * just clicked and lose the focus ring with it.
       */
      function paintWoundChipStates() {
        const row = $("memStats").querySelector('[data-role="wound-chips"]');
        if (row === null) return;
        for (const chip of row.querySelectorAll("[data-wound]")) {
          chip.classList.toggle("primary", Number(chip.dataset.wound) === woundPop);
        }
      }
      /** The in-place treatment card for the wound the operator clicked. */
      function paintWoundPop() {
        const host = $("woundPop");
        const agent = agentByName(dlgAgent);
        const wound = woundPop === null || agent === null ? null : woundById(woundPop);
        if (wound === null || wound.status === "healed") {
          host.hidden = true;
          host.innerHTML = "";
          host.dataset.key = "";
          return;
        }
        const config = state === null ? null : state.config;
        const treatable = agent.status === "alive" && agent.busy !== true;
        const busy = agent.busy === true;
        const statusClass =
          wound.status === "untreated" ? "bad" : wound.status === "scarred" ? "warn" : "ok";
        // The poll repaints this card every three seconds; rebuilding it under
        // the operator's cursor would swallow the click on a treatment button.
        const key = `${agent.name}|${wound.id}|${wound.status}|${treatable ? 1 : 0}|${config === null ? "" : config.ordinaryTreatmentPrice + ":" + config.completeTreatmentPrice}`;
        if (host.dataset.key === key) {
          host.hidden = false;
          return;
        }
        host.dataset.key = key;
        host.hidden = false;
        host.innerHTML =
          `<div class="wp-head">` +
            `<strong>伤口 #${wound.id}</strong>` +
            `<span class="tag ${statusClass}">${esc(WOUND_STATUS[wound.status] || wound.status)}</span>` +
            `<span class="wp-k">${wound.length} 个字符 · 产生于 ${timeHtml(wound.createdAt)}</span>` +
            `<span class="grow"></span>` +
            `<button class="btn tiny" data-act="wound-close">关闭</button>` +
          `</div>` +
          `<div class="wp-k">被夺走的原文（只有操作员能看，Agent 看不到）</div>` +
          `<pre class="mono">${esc(String(wound.originalText === undefined ? "" : wound.originalText))}</pre>` +
          (treatable
            ? `<div class="row">` +
                `<button class="btn tiny primary" data-act="wound-treat" data-wound="${wound.id}" data-tier="ordinary">普通治疗（留疤，价格 ${esc(
                  num(config === null ? 0 : config.ordinaryTreatmentPrice),
                )}）</button>` +
                `<button class="btn tiny" data-act="wound-treat" data-wound="${wound.id}" data-tier="complete">完全治疗（无痕，价格 ${esc(
                  num(config === null ? 0 : config.completeTreatmentPrice),
                )}）</button>` +
              `</div>` +
              `<div class="small muted">操作员代为治疗不扣这个 Agent 的余额，但会永久记录为一次干预。</div>`
            : agent.status !== "alive"
              ? '<div class="banner danger">这个 Agent 已经死亡，不能治疗。</div>'
              : `<div class="small muted">${busy ? "它正在一次会话中，结束之后才能治疗。" : "现在不能治疗。"}</div>`);
      }
      function paintMemRecords() {
        const host = $("memRecords");
        const records = memCache.records;
        repaint(
          host,
          records.length === 0
            ? '<div class="empty small">还没有记忆整合记录。</div>'
            : records
                .map(
                  (record) => `
                    <div class="list-item ${memSel !== null && memSel.round === record.round && memSel.kind === record.entry.kind ? "active" : ""}"
                         data-act="mem-record" data-round="${record.round}" data-kind="${esc(record.entry.kind)}">
                      <div class="row"><span class="title grow">${esc(MEM_KIND[record.entry.kind] || record.entry.kind)}</span><span class="tag">会话 #${record.round}</span></div>
                      <div class="sub">${timeHtml(record.entry.at)}${record.entry.reason ? " · " + esc(record.entry.reason) : ""}</div>
                    </div>`,
                )
                .join(""),
        );
      }
      function paintMemCompare() {
        const host = $("memCompare");
        if (memSel === null) {
          host.innerHTML = '<div class="small muted">点上面的记录，看那一次的新旧版本。</div>';
          return;
        }
        const record = memCache.records.find((item) => item.round === memSel.round && item.entry.kind === memSel.kind) || null;
        if (record === null) {
          host.innerHTML = '<div class="small muted">这条记录已经不在最近的记录里了。</div>';
          return;
        }
        const oldEntry = record.entries.filter((entry) => entry.kind === "memory_old").pop();
        const newEntry = record.entries.filter((entry) => entry.kind === "memory_new").pop();
        const responseEntry = record.entries.filter((entry) => entry.kind === "memory_response").pop();
        const before = oldEntry === undefined ? "（没有旧版本记录）" : oldEntry.text;
        const after =
          newEntry !== undefined
            ? newEntry.text
            : responseEntry !== undefined
              ? responseEntry.enforced
              : null;
        host.innerHTML = `
          <div class="card col-stack">
            <div class="row"><strong>会话 #${record.round} · ${esc(MEM_KIND[record.entry.kind] || record.entry.kind)}</strong><span class="small muted">${timeHtml(record.entry.at)}</span></div>
            ${record.entry.reason ? `<div class="banner warn">拒绝原因：${esc(record.entry.reason)}</div>` : ""}
            ${record.entry.message ? `<div class="banner danger">${esc(record.entry.message)}</div>` : ""}
            ${record.entry.source === "memory" && record.entry.kind === "usage_missing" ? '<div class="banner danger">记忆模型没有报告用量，MEMORY 未改变。</div>' : ""}
            <div class="small muted">旧版本（这次会话开始前）</div>
            <pre class="mono">${esc(before)}</pre>
            <div class="small muted">新版本${after === null ? "（没有写出新版本，MEMORY 保持不变）" : ""}</div>
            <pre class="mono">${esc(after === null ? "—" : after)}</pre>
          </div>`;
      }

      // --------------------------------------------------- messages tab
      function paintChat() {
        const host = $("chatList");
        const agent = agentByName(dlgAgent);
        if (agent === null) return;
        const messages = messagesFor(agent.name)
          .slice()
          .sort((a, b) => a.at - b.at || a.id - b.id);
        if (dlgTab === "messages") {
          let changed = false;
          for (const message of messages) {
            if (message.sender === agent.name && message.readAt === null && !readMarks.has(markOf(message))) {
              readMarks.add(markOf(message));
              changed = true;
            }
          }
          if (changed) {
            saveReadMarks();
            paintNav();
            paintAgentsPage();
          }
        }
        const key = messages.map((message) => `${message.id}:${message.readAt}`).join("|");
        if (host.dataset.key === key) return;
        const nearBottom = host.scrollHeight - host.scrollTop - host.clientHeight < 80;
        const previousTop = host.scrollTop;
        const hadContent = host.dataset.key !== undefined;
        host.dataset.key = key;
        host.innerHTML =
          messages.length === 0
            ? '<div class="empty small">还没有留言。下面写第一句。</div>'
            : messages
                .map(
                  (message) => `
                    <div class="msg ${message.sender === "operator" ? "op" : ""}">
                      <div class="who">${esc(message.sender === "operator" ? "操作员" : message.sender)} · ${timeHtml(message.at)}</div>
                      <div class="body">${esc(message.body)}</div>
                    </div>`,
                )
                .join("");
        if (!hadContent || nearBottom) host.scrollTop = host.scrollHeight;
        else host.scrollTop = previousTop;
      }

      // ------------------------------------------------- agent task tab
      function paintAgentTasks() {
        const agent = agentByName(dlgAgent);
        if (agent === null || state === null) return;
        const tasks = state.tasks.filter((task) => task.claimedBy === agent.name);
        repaint(
          $("agentTasks"),
          tasks.length === 0
            ? '<div class="empty small">这个 Agent 还没有认领过任务。</div>'
            : tasks
                .map(
                  (task) => `
                    <div class="card">
                      <div class="row"><strong class="grow">${esc(task.title)}</strong><span class="${taskTagClass(task.status)}">${esc(TASK_STATUS[task.status] || task.status)}</span><span class="tag">${esc(num(task.price))}</span></div>
                      <div class="small muted">${esc(task.id)} · 认领 ${timeHtml(task.claimedAt)} · 提交 ${timeHtml(task.submittedAt)}</div>
                      ${task.deliverable ? `<pre class="mono" style="max-height: 140px">${esc(task.deliverable)}</pre>` : ""}
                      <div class="row"><button class="btn tiny" data-act="agent-task" data-task="${esc(task.id)}">去全局任务板审核</button></div>
                    </div>`,
                )
                .join(""),
        );
      }
      function paintAgentInterventions() {
        const agent = agentByName(dlgAgent);
        if (agent === null || state === null) return;
        // Conservatory-wide rows carry the "conservatory" marker; they affect
        // every agent, so this pane shows them too (rendered as 全局).
        const rows = state.interventions
          .filter((row) => row.agent === agent.name || row.agent === "conservatory")
          .slice()
          .reverse();
        repaint($("agentInt"), interventionRowsHtml(rows));
      }

      // ------------------------------------------------------------ actions
      async function runAction(act, target) {
        if (act === "nav") {
          goPage(target.dataset.page);
          // The cards need each agent's latest reply, which only this poll fetches.
          if (target.dataset.page === "agents") void refresh();
          return;
        }
        if (act === "open-agent") {
          openAgent(target.dataset.agent, "life");
          return;
        }
        if (act === "goto-pause-settings" || act === "open-settings") {
          openSettingsDlg("vital");
          return;
        }
        if (act === "settings-close") {
          closeSettingsDlg();
          return;
        }
        if (act === "settings-tab") {
          switchSettingsTab(target.dataset.tab);
          return;
        }
        if (act === "pause-toggle") {
          // A checkbox click has already flipped `checked`, so that is the
          // desired new state. Cancel snaps it back to the server's state.
          const wanted = target.checked === true;
          const question = wanted
            ? "暂停温室：所有 Agent 不会醒来，也不会饿；这会被永久记录为操作员干预。"
            : "恢复温室：时间重新流动；这会被永久记录为操作员干预。";
          if (!confirm(question)) {
            target.checked = isPaused();
            return;
          }
          await post("/api/settings/pause", { paused: wanted });
          await refresh();
          return;
        }
        if (act === "prompt-mode") {
          const wanted = target.value === "cached" ? "cached" : "hot";
          const current = state === null || state.prompts === undefined ? "hot" : state.prompts.mode;
          if (wanted === current) return;
          try {
            await post("/api/prompts/mode", { mode: wanted });
          } finally {
            await refresh();
          }
          return;
        }
        if (act === "prompt-reload") {
          try {
            await post("/api/prompts/reload", {});
          } finally {
            await refresh();
          }
          return;
        }
        if (act === "sandbox-read-mode") {
          if (sandboxDraft === null) return;
          sandboxDraft.readMode = target.value === "whitelist" ? "whitelist" : "blacklist";
          renderSandbox(false);
          return;
        }
        if (act === "sandbox-add") {
          const list = SANDBOX_LISTS.find((entry) => entry.key === target.dataset.list);
          if (list === undefined || sandboxDraft === null) return;
          const input = $(`sandboxInput-${list.key}`);
          const value = input === null ? "" : input.value.trim();
          if (value === "") {
            sandboxHints[list.key] = "请先填写一个绝对路径";
            renderSandbox(false);
            return;
          }
          const rows = sandboxDraft[list.key];
          const alreadyThere = sandboxLockedOf(list.key)
            .concat(rows)
            .some((path) => path.toLowerCase() === value.toLowerCase());
          if (alreadyThere) {
            sandboxHints[list.key] = "这个路径已经在列表里了";
            renderSandbox(false);
            return;
          }
          rows.push(value);
          if (input !== null) input.value = "";
          sandboxHints[list.key] = "";
          renderSandbox(false);
          return;
        }
        if (act === "sandbox-remove") {
          const list = SANDBOX_LISTS.find((entry) => entry.key === target.dataset.list);
          if (list === undefined || sandboxDraft === null) return;
          const rows = sandboxDraft[list.key];
          const index = Number(target.dataset.index);
          if (!Number.isInteger(index) || index < 0 || index >= rows.length) return;
          rows.splice(index, 1);
          sandboxHints[list.key] = "";
          renderSandbox(false);
          return;
        }
        if (act === "sandbox-reload") {
          await loadSandboxConfig();
          return;
        }
        if (act === "sandbox-save") {
          await saveSandbox();
          return;
        }
        if (act === "sys-open") {
          openSettingsDlg("system");
          return;
        }
        if (act === "sys-values-save") {
          await saveSysValues();
          return;
        }
        if (act === "sys-values-reset") {
          resetSysValues();
          return;
        }
        if (act === "models-save-provider") {
          saveProviderDraft();
          return;
        }
        if (act === "models-fetch-remote") {
          await fetchRemoteModelsForForm();
          return;
        }
        if (act === "models-fetched-toggle") {
          const model = target.dataset.model;
          const namesInput = $("modelsModelNames");
          if (!model || namesInput === null) return;
          const current = parseModelNames(namesInput.value);
          const idx = current.indexOf(model);
          if (idx >= 0) current.splice(idx, 1);
          else current.push(model);
          namesInput.value = current.join(", ");
          paintFetchedModels();
          return;
        }
        if (act === "models-fetched-select-all") {
          const namesInput = $("modelsModelNames");
          if (namesInput === null || modelsFetchedList.length === 0) return;
          const current = parseModelNames(namesInput.value);
          const seen = new Set(current);
          const keyword = modelsFetchedFilter.trim().toLowerCase();
          const filtered =
            keyword === ""
              ? modelsFetchedList
              : modelsFetchedList.filter((m) => m.toLowerCase().includes(keyword));
          for (const model of filtered) {
            if (!seen.has(model)) {
              seen.add(model);
              current.push(model);
            }
          }
          namesInput.value = current.join(", ");
          paintFetchedModels();
          return;
        }
        if (act === "models-fetched-clear") {
          const namesInput = $("modelsModelNames");
          if (namesInput === null) return;
          namesInput.value = "";
          paintFetchedModels();
          return;
        }
        if (act === "models-fetched-close") {
          resetFetchedModels();
          return;
        }
        if (act === "models-edit-provider") {
          if (modelsDraft === null) return;
          const wanted = target.dataset.provider;
          modelsEditingId = providerById(wanted) === null ? null : wanted;
          resetFetchedModels();
          modelsStatus = { tone: "ok", text: "正在编辑这个提供商；改完点『保存修改』。" };
          renderModels(true);
          return;
        }
        if (act === "models-cancel-edit") {
          modelsEditingId = null;
          resetFetchedModels();
          modelsStatus = { tone: "ok", text: "已取消编辑。" };
          renderModels(true);
          return;
        }
        if (act === "models-remove-provider") {
          if (modelsDraft === null) return;
          const wanted = target.dataset.provider;
          const provider = providerById(wanted);
          if (provider === null) return;
          if (modelsDraft.providers.length <= 1) {
            modelsStatus = { tone: "bad", text: "至少要保留一个提供商。" };
            renderModels(false);
            return;
          }
          if (!confirm(`删除提供商「${provider.name}」？仍绑定它的存活 Agent 会让保存被拒绝。`)) return;
          modelsDraft.providers = modelsDraft.providers.filter((p) => p.id !== wanted);
          if (modelsEditingId === wanted) {
            modelsEditingId = null;
            resetFetchedModels();
          }
          modelsStatus = { tone: "ok", text: `已删除提供商「${provider.name}」，别忘了点『保存配置』。` };
          renderModels(true);
          return;
        }
        if (act === "models-reload") {
          resetFetchedModels();
          await loadModelsConfig();
          return;
        }
        if (act === "models-save") {
          await saveModels();
          return;
        }
        if (act === "model-switch") {
          const agent = target.dataset.agent || dlgAgent;
          if (agent === null) return;
          const providerId = target.dataset.provider;
          const model = target.dataset.model;
          if (providerId === undefined || model === undefined) return;
          const row = target.parentElement;
          const effortSelect = row === null ? null : row.querySelector("select[data-model-effort]");
          const effort = effortSelect === null ? "" : effortSelect.value;
          // An empty dropdown means "clear it"; the server treats `null` as
          // unspecified and drops the level from the frozen snapshot.
          const body = await post(`/api/agents/${encodeURIComponent(agent)}/model`, {
            providerId,
            model,
            reasoningEffort: effort === "" ? null : effort,
          });
          modelSwitchNotice = typeof body.message === "string" ? body.message : null;
          // The binding is the truth again once the save lands.
          delete bodyModelDrafts[agent];
          await refresh();
          return;
        }
        if (act === "model-test-switch") {
          const agent = target.dataset.agent || dlgAgent;
          if (agent === null) return;
          const row = target.parentElement;
          const providerSelect = row === null ? null : row.querySelector("select[data-model-provider]");
          const modelSelect = row === null ? null : row.querySelector("select[data-model-model]");
          const effortSelect = row === null ? null : row.querySelector("select[data-model-effort]");
          const providerId = providerSelect === null ? "" : providerSelect.value;
          const model = modelSelect === null ? "" : modelSelect.value;
          const effort = effortSelect === null ? "" : effortSelect.value;
          if (model === "") {
            modelSwitchNotice = "请先选择要测试的模型。";
            paintBody();
            return;
          }
          modelSwitchNotice = "正在测试模型…";
          paintBody();
          try {
            const body = await post("/api/models/test", {
              providerId,
              model,
              reasoningEffort: effort === "" ? null : effort,
            });
            modelSwitchNotice = typeof body.message === "string" ? body.message : "测试通过。";
          } catch (error) {
            modelSwitchNotice = "测试失败：" + (error instanceof Error ? error.message : String(error));
          }
          paintBody();
          return;
        }
        if (act === "models-test-form") {
          const names = parseModelNames($("modelsModelNames") === null ? "" : $("modelsModelNames").value);
          if (names.length === 0) {
            modelsStatus = { tone: "bad", text: "请先填写至少一个模型名，再测试。" };
            renderModels(false);
            return;
          }
          const baseUrl = $("modelsBaseUrl") === null ? "" : $("modelsBaseUrl").value.trim();
          const apiKey = $("modelsApiKey") === null ? "" : $("modelsApiKey").value;
          modelsStatus = { tone: "ok", text: `正在测试「${names[0]}」…` };
          renderModels(false);
          try {
            const body = await post("/api/models/test", {
              baseUrl,
              apiKey,
              providerId: modelsEditingId,
              model: names[0],
            });
            modelsStatus = { tone: "ok", text: typeof body.message === "string" ? body.message : "测试通过。" };
          } catch (error) {
            modelsStatus = { tone: "bad", text: error instanceof Error ? error.message : String(error) };
          }
          renderModels(false);
          return;
        }
        if (act === "models-test-default") {
          const role = target.dataset.role === "memory" ? "memory" : "agent";
          const pair = $(
            role === "memory" ? "modelsDefaultMemory" : "modelsDefaultAgent",
          );
          const effort = effortValueOf(role === "memory" ? "modelsDefaultMemoryEffort" : "modelsDefaultAgentEffort");
          if (pair === null || pair.value === "") {
            modelsStatus = { tone: "bad", text: "请先选择要测试的默认模型。" };
            renderModels(false);
            return;
          }
          const at = pair.value.indexOf("|");
          const providerId = at < 0 ? "" : pair.value.slice(0, at);
          const model = at < 0 ? "" : pair.value.slice(at + 1);
          const who = role === "memory" ? "默认 Memory 模型" : "默认 Agent 模型";
          modelsStatus = { tone: "ok", text: `正在测试${who}「${model}」…` };
          renderModels(false);
          try {
            const body = await post("/api/models/test", {
              providerId,
              model,
              reasoningEffort: effort === "" ? null : effort,
            });
            modelsStatus = { tone: "ok", text: typeof body.message === "string" ? body.message : "测试通过。" };
          } catch (error) {

          (event.key === "Enter" || event.key === " ") &&

      // ------------------------------------------------------------ refresh
      async function loadExtras() {
        if (state === null || state.agents.length === 0) {
          extras = {};
          return;
        }
        const entries = await Promise.all(
          state.agents.map(async (agent) => {
            try {
              const body = await api(`/api/agents/${encodeURIComponent(agent.name)}/blackbox?rounds=5`);
              const rounds = body.rounds;
              for (let index = rounds.length - 1; index >= 0; index -= 1) {
                const end = rounds[index].entries.filter((entry) => entry.kind === "round_end").pop();
                if (end !== undefined) {
                  return [
                    agent.name,
                    {
                      finalReply: typeof end.finalReply === "string" ? end.finalReply : "",
                      endReason: typeof end.endReason === "string" ? end.endReason : "",
                      // Why a round that produced no reply produced none. The
                      // card would otherwise say "还没有完成过一轮" about a round
                      // that ran and failed, which is the one thing it must not.
                      error: typeof end.error === "string" ? end.error : "",
                      round: rounds[index].round,
                    },
                  ];
                }
              }
              return [agent.name, null];
            } catch (error) {
              return [agent.name, null];
            }
          }),
        );
        extras = {};
        for (const [name, value] of entries) {
          if (value !== null) extras[name] = value;
        }

            await loadExtras();

          refreshError = error instanceof Error ? error.message : String(error);
          // The rail and the brand LED are the only live telemetry outside
          // `paint()`, so they are the two things a failed poll must refresh.
          paintRailFoot();

          refreshing = false;

      /**
       * Keeps the open dialog current between state polls.
       *
       * Two things change while the operator watches. A round in progress
       * writes entries the whole time, but `lastRoundAt` only moves when the
       * round *ends*, so waiting for it would leave the Life tab frozen for
       * the entire round. And a finished round needs one more read to pick up
       * the entries written after its last poll. The first case polls on
       * `busy`, the second on the marker, and both read quietly.
       */
      async function followNewRounds() {
        if (dlgAgent === null) return;
        const agent = agentByName(dlgAgent);
        if (agent === null) return;
        // A round is being written right now: stream it.
        if (dlgTab === "life" && agent.busy === true) {
          await loadRounds(dlgAgent, true, true);
          return;
        }
        const seen = loadedRoundAt[dlgAgent];
        if (agent.lastRoundAt === null || seen === undefined || seen === agent.lastRoundAt) return;
        loadedRoundAt[dlgAgent] = agent.lastRoundAt;
        // Quiet on both: the round just ended, and blanking the pane the
        // operator is reading would hide the very ending they waited for.
        if (dlgTab === "life") await loadRounds(dlgAgent, true, true);
        else if (dlgTab === "memory") await loadMemory(dlgAgent, true);
      }

        if (quiet !== true) {
          host.dataset.key = "";
          host.innerHTML = '<div class="empty small">读取中…</div>';
        }
        try {
          const body = await api(`/api/agents/${encodeURIComponent(name)}/blackbox?rounds=${lifeRange}`);
          const rounds = body.rounds.filter((round) => round.round !== null);
          sessionCache = { agent: name, range: lifeRange, rounds };
          // An open session that fell out of the window closes itself, so the
          // transcript never keeps showing a session the list no longer has.
          if (sessionSel !== null && !rounds.some((round) => round.round === sessionSel)) {
            sessionSel = null;
          }
          const agent = agentByName(name);
          if (agent !== null) loadedRoundAt[name] = agent.lastRoundAt;
          paintLifeLevels();
          paintSessionList();
          paintTranscript();
        } catch (error) {
          // A quiet poll that fails leaves the last good view alone: a
          // transient read error is not worth replacing the transcript with.
          if (quiet !== true) {
            host.innerHTML = `<div class="empty small">读取失败：${esc(error instanceof Error ? error.message : String(error))}</div>`;
          }
        }
      }
      async function loadMemory(name, force) {
        if (name === null) return;
        if (!force && memCache.agent === name) {
          paintMemory();
          return;
        }
        if (memLoading && memCache.agent === name) return;
        memLoading = true;
        try {
          const [memory, records] = await Promise.all([
            api(`/api/agents/${encodeURIComponent(name)}/memory`),
            api(`/api/agents/${encodeURIComponent(name)}/blackbox?rounds=50`),
          ]);
          const memoryRecords = [];
          for (const round of records.rounds) {
            for (const entry of round.entries) {
              if (entry.kind === "memory_new" || entry.kind === "memory_rejected" || entry.kind === "memory_error" || entry.kind === "usage_missing") {
                if (entry.kind === "usage_missing" && entry.source !== "memory") continue;
                memoryRecords.push({ round: round.round, entry, entries: round.entries });
              }
            }
          }
          memCache = { agent: name, memory: String(memory.memory || ""), records: memoryRecords.slice(-20).reverse() };
          const current = agentByName(name);
          if (current !== null) loadedRoundAt[name] = current.lastRoundAt;
          if (memSel !== null && !memCache.records.some((r) => r.round === memSel.round && r.entry.kind === memSel.kind)) {
            memSel = null;
          }
          paintMemory();
        } catch (error) {
          $("memoryText").innerHTML = `<div class="empty small">读取失败：${esc(error instanceof Error ? error.message : String(error))}</div>`;
        } finally {
          memLoading = false;
        }
      }

      // ----------------------------------------------------------- bootstrap
      $("dlg").addEventListener("close", () => {
        if (dlgAgent !== null) {
          dlgAgent = null;
          if (window.location.hash !== "#/agents") window.location.hash = "#/agents";
        }
      });
      $("dlg").addEventListener("click", (event) => {
        if (event.target === $("dlg")) closeAgent();
      });
      // Clicking the dimmed area lands on the dialog element itself, because the
      // card fills `.settings-shell`; the close therefore runs through the same
      // animated path as the ✕ so the exit never blinks.
      $("settingsDlg").addEventListener("click", (event) => {
        if (event.target === $("settingsDlg")) closeSettingsDlg();
      });
      // Whatever closed it — the ✕, the backdrop, Esc, or the animation timer —
      // the card must never be left carrying the exit class into the next open.
      $("settingsDlg").addEventListener("close", () => {
        settingsClosing = false;
        $("settingsDlg").classList.remove("is-closing");
      });
      // Esc cancels a modal dialog natively; hold that cancel so Esc plays the
      // same exit motion as the ✕ instead of snapping the card away.
      $("settingsDlg").addEventListener("cancel", (event) => {
        event.preventDefault();
        closeSettingsDlg();
      });
      window.addEventListener("hashchange", applyRoute);
      if (!window.location.hash) window.location.hash = "#/agents";
      applyRoute();
      void refresh();
      // The sandbox panel is not part of /api/state: it reads its own route so
      // the page always opens on the policy the server is actually enforcing.
      void loadSandboxConfig();
      setInterval(() => {
        void refresh();
      }, 3000);
    </script>
  </body>
</html>
