<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CONSERVATORY · 操作台</title>
    <style>
      :root {
        --bg: #ffffff;
        --rail: #f7f7f8;
        --line: #e5e7eb;
        --text: #1f2328;
        --muted: #6b7280;
        --accent: #1f7a4d;
        --accent-soft: #eef6f1;
        --danger: #b42318;
        --danger-soft: #fdf3f2;
        --warn: #b54708;
        --warn-soft: #fffaeb;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.55 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        overflow: hidden;
      }
      .mono, pre, code, .num { font-family: Consolas, "Cascadia Mono", monospace; }
      .small { font-size: 12px; }
      .muted { color: var(--muted); }
      .empty { color: var(--muted); font-style: italic; }
      .grow { flex: 1 1 auto; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .col-stack { display: grid; gap: 10px; }
      .contents { display: contents; }

      /* ---------------------------------------------------------------- shell */
      .app { display: flex; height: 100vh; }
      .rail {
        flex: 0 0 220px;
        width: 220px;
        background: var(--rail);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .brand { padding: 16px 16px 12px; font-size: 16px; font-weight: 700; }
      .brand small { display: block; font-weight: 400; font-size: 10px; color: var(--muted); letter-spacing: 0.16em; }
      .nav { flex: 1; overflow: auto; padding: 2px 8px 8px; }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 9px;
        height: 36px;
        padding: 0 10px;
        border-radius: 8px;
        cursor: pointer;
        color: var(--text);
        user-select: none;
      }
      .nav-item + .nav-item { margin-top: 2px; }
      .nav-item:hover { background: #ececee; }
      .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
      .nav-item svg { width: 16px; height: 16px; flex: 0 0 16px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .nav-label { flex: 1; }
      .badge {
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-size: 11px;
        line-height: 18px;
        text-align: center;
      }
      .badge.warn { background: var(--warn); }
      .rail-foot {
        border-top: 1px solid var(--line);
        padding: 10px 14px 12px;
        font-size: 12px;
        color: var(--muted);
        display: grid;
        gap: 3px;
      }
      .rail-foot strong { color: var(--text); font-weight: 600; }
      .main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }

      /* -------------------------------------------------------------- notices */
      .notices { padding: 10px 18px 0; display: grid; gap: 6px; }
      .notices:empty { padding: 0; }
      .notice {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        border: 1px solid #f2d9a8;
        border-left: 3px solid var(--warn);
        background: var(--warn-soft);
        color: #6b3d05;
        border-radius: 8px;
        padding: 7px 10px;
        font-size: 12.5px;
      }
      .notice b { color: var(--warn); }
      .notice .close { margin-left: auto; }

      /* ---------------------------------------------------------------- pages */
      .pages { flex: 1; overflow: auto; padding: 16px 18px 40px; }
      .page { display: none; }
      .page.active { display: block; }
      h2.page-title { font-size: 17px; margin: 0 0 14px; font-weight: 600; }
      .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-content: start; }
      @media (min-width: 1500px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
      @media (max-width: 1080px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      .split { display: grid; grid-template-columns: minmax(320px, 420px) minmax(320px, 1fr); gap: 16px; align-items: start; }
      .list { display: grid; gap: 8px; }
      .scroll-list { max-height: 46vh; overflow: auto; padding-right: 2px; }

      /* ---------------------------------------------------------------- cards */
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
      }
      .agent-card { cursor: pointer; }
      .agent-card:hover { border-color: var(--accent); }
      .card-head { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; }
      .card-name { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; flex: 0 0 8px; }
      .dot.busy { background: var(--accent); }
      .tag {
        display: inline-block;
        padding: 0 7px;
        border-radius: 999px;
        font-size: 11px;
        line-height: 18px;
        border: 1px solid var(--line);
        color: var(--muted);
        background: #fff;
        white-space: nowrap;
      }
      .tag.ok { color: var(--accent); border-color: #cbe3d6; background: var(--accent-soft); }
      .tag.bad { color: var(--danger); border-color: #f1c9c4; background: var(--danger-soft); }
      .tag.warn { color: var(--warn); border-color: #f2d9a8; background: var(--warn-soft); }
      .bar { height: 8px; border-radius: 999px; background: #eef0f2; overflow: hidden; }
      .bar > span { display: block; height: 100%; background: var(--accent); }
      .kv { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; }
      .kv .k { color: var(--muted); }
      .card-reply { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--muted); white-space: pre-wrap; word-break: break-word; max-height: 46px; overflow: hidden; }
      .slot-card { border-style: dashed; background: #fcfcfd; display: grid; gap: 8px; align-content: start; }
      .slot-card .slot-title { color: var(--muted); font-size: 12.5px; }
      .slot-card input { width: 100%; }

      /* --------------------------------------------------------------- inputs */
      input, textarea, select, button { font: inherit; color: var(--text); }
      input, textarea, select {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 9px;
        min-width: 0;
      }
      input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(31, 122, 77, 0.12); }
      textarea { min-height: 62px; width: 100%; resize: vertical; }
      .btn {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
      }
      .btn:hover { border-color: var(--accent); color: var(--accent); }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      .btn.primary:hover { color: #fff; opacity: 0.92; }
      .btn.danger { color: var(--danger); border-color: #f1c9c4; }
      .btn.danger:hover { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
      .btn.tiny { padding: 2px 9px; font-size: 12px; }
      .btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
      .btn.icon { padding: 4px 8px; line-height: 0; }
      .btn.icon svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }
      .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
      .list-item { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; cursor: pointer; background: #fff; }
      .list-item:hover { border-color: var(--accent); }
      .list-item.active { border-color: var(--accent); background: var(--accent-soft); }
      .list-item .title { font-weight: 600; }
      .list-item .sub { font-size: 12px; color: var(--muted); }

      pre {
        background: #fafafa;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        margin: 0;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 420px;
        font-size: 12.5px;
        line-height: 1.5;
      }
      details { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: #fff; }
      details + details { margin-top: 8px; }
      details > summary { cursor: pointer; font-size: 12.5px; color: var(--muted); }
      details[open] > summary { margin-bottom: 8px; }
      table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
      th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
      th { color: var(--muted); font-weight: 600; background: #fafafa; }
      a { color: var(--accent); }

      /* --------------------------------------------------------------- dialog */
      dialog#dlg {
        width: 92vw;
        max-width: 92vw;
        height: 88vh;
        max-height: 88vh;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(17, 24, 39, 0.1);
        overflow: hidden;
        color: var(--text);
      }
      dialog#dlg::backdrop { background: rgba(17, 24, 39, 0.35); }
      .dlg-wrap { display: flex; flex-direction: column; height: 100%; min-height: 0; }
      .dlg-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }
      .dlg-name { font-size: 16px; }
      .dlg-sat { display: flex; align-items: center; gap: 6px; width: 190px; }
      .dlg-sat .bar { flex: 1; }
      .dlg-tabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--line); overflow-x: auto; }
      .tab {
        border: 0;
        background: none;
        padding: 9px 12px;
        color: var(--muted);
        cursor: pointer;
        border-bottom: 2px solid transparent;
        white-space: nowrap;
      }
      .tab:hover { color: var(--text); }
      .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
      .dlg-body { flex: 1; min-height: 0; display: flex; }
      .pane { display: none; flex: 1; min-height: 0; padding: 14px 16px; }
      .pane.active { display: flex; flex-direction: column; gap: 10px; overflow: auto; }
      #pane-messages.active { overflow: hidden; }
      .pane.active.split { display: grid; grid-template-columns: minmax(240px, 300px) minmax(280px, 1fr); gap: 14px; overflow: hidden; }
      .pane-col { min-height: 0; overflow: auto; display: grid; gap: 8px; align-content: start; }

      /* ----------------------------------------------------------- life tab */
      .round-item { border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; cursor: pointer; background: #fff; }
      .round-item:hover { border-color: var(--accent); }
      .round-item.active { border-color: var(--accent); background: var(--accent-soft); }
      .round-item .r1 { display: flex; gap: 8px; align-items: center; font-size: 12.5px; }
      .say { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: #fff; white-space: pre-wrap; word-break: break-word; }
      .say.meta { font-size: 11.5px; color: var(--muted); margin-top: 4px; white-space: normal; }
      .tool-item { border-left: 3px solid var(--accent); }
      .tool-item.bad { border-left-color: var(--danger); }
      .tool-sum { color: var(--muted); margin-left: 6px; }
      .final { border: 1px solid #cbe3d6; background: var(--accent-soft); border-radius: 10px; padding: 10px; }
      .final .label { font-size: 12px; color: var(--accent); font-weight: 600; margin-bottom: 6px; }
      .final pre { background: #fff; border-color: #d9e9e0; max-height: 300px; }
      .event-line { font-size: 12.5px; color: var(--muted); }

      /* -------------------------------------------------------- memory/notebook */
      .mem-body { border: 1px solid var(--line); border-radius: 8px; overflow: auto; max-height: 52vh; background: #fff; }
      .mem-line { padding: 1px 10px; white-space: pre-wrap; word-break: break-word; line-height: 1.75; font-family: Consolas, "Cascadia Mono", monospace; font-size: 12.5px; }
      .mem-born { background: #f3f4f6; color: var(--muted); }
      .mem-born .hint { color: #9ca3af; font-size: 11px; margin-left: 8px; }
      .nb-file { text-align: left; }

      /* ------------------------------------------------------------- messages */
      .chat { display: flex; flex-direction: column; min-height: 0; flex: 1; gap: 8px; }
      .chat-list { flex: 1; min-height: 0; overflow: auto; display: grid; gap: 8px; align-content: start; padding-right: 2px; }
      .msg { max-width: 72%; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: #fff; }
      .msg.op { justify-self: end; background: var(--accent-soft); border-color: #d9e9e0; }
      .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
      .msg .body { white-space: pre-wrap; word-break: break-word; }
      .chat-input { display: flex; gap: 8px; }
      .chat-input input { flex: 1; }

      .banner { border-radius: 8px; padding: 9px 11px; font-size: 13px; }
      .banner.warn { background: var(--warn-soft); border: 1px solid #f2d9a8; color: #6b3d05; }
      .banner.danger { background: var(--danger-soft); border: 1px solid #f1c9c4; color: var(--danger); }
      .config-table td:first-child { color: var(--muted); width: 260px; }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="rail">
        <div class="brand">Conservatory<small>OPERATOR CONSOLE</small></div>
        <nav class="nav" id="nav">
          <div class="nav-item" data-act="nav" data-page="agents">
            <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2" /><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5" /><path d="M16 6.6a3 3 0 0 1 0 5.8" /><path d="M17.5 19c0-2.1-.7-3.8-2-4.8" /></svg>
            <span class="nav-label">所有 Agent</span>
            <span class="badge" data-badge="agents" hidden></span>
          </div>
          <div class="nav-item" data-act="nav" data-page="tasks">
            <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2" /><path d="M7.5 9.5h6M7.5 13.5h9M7.5 17h6" /></svg>
            <span class="nav-label">任务板</span>
            <span class="badge warn" data-badge="tasks" hidden></span>
          </div>
          <div class="nav-item" data-act="nav" data-page="income">
            <svg viewBox="0 0 24 24"><path d="M6 3.5h12v17l-2.6-1.8-2.4 1.8-2.4-1.8L8.6 20.5 6 18.7z" /><path d="M9.5 8.5h5M9.5 12h5" /></svg>
            <span class="nav-label">收入申报</span>
            <span class="badge warn" data-badge="income" hidden></span>
          </div>
          <div class="nav-item" data-act="nav" data-page="interventions">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><path d="M12 7.5V12l3.2 1.9" /></svg>
            <span class="nav-label">干预记录</span>
          </div>
          <div class="nav-item" data-act="nav" data-page="settings">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /><circle cx="9" cy="7" r="2" /><circle cx="15" cy="12" r="2" /><circle cx="8" cy="17" r="2" /></svg>
            <span class="nav-label">设置</span>
          </div>
        </nav>
        <div class="rail-foot" id="railFoot"></div>
      </aside>

      <div class="main">
        <div class="notices" id="notices"></div>
        <div class="pages" id="pages">
          <section class="page" id="page-agents">
            <h2 class="page-title">所有 Agent</h2>
            <div class="grid" id="cardGrid">
              <div class="contents" id="agentCards"></div>
              <div class="contents" id="slotCards"></div>
            </div>
          </section>

          <section class="page" id="page-tasks">
            <h2 class="page-title">任务板（一口价 · 先到先得）</h2>
            <div class="split">
              <div class="col-stack">
                <div class="card col-stack">
                  <div class="small muted">发布任务</div>
                  <input id="taskTitle" placeholder="标题" />
                  <input id="taskPrice" type="number" min="0" placeholder="价格（harness 余额）" />
                  <textarea id="taskDesc" placeholder="描述（Agent 会看到）"></textarea>
                  <div class="row"><button class="btn primary" data-act="post-task">发布任务</button></div>
                </div>
                <div class="chips" id="taskFilters"></div>
                <div class="list scroll-list" id="taskList"></div>
              </div>
              <div class="col-stack" id="taskDetail"></div>
            </div>
          </section>

          <section class="page" id="page-income">
            <h2 class="page-title">收入申报</h2>
            <div id="rateWarn"></div>
            <div class="split" style="margin-top: 10px">
              <div class="list scroll-list" id="incomeList"></div>
              <div class="col-stack" id="incomeDetail"></div>
            </div>
          </section>

          <section class="page" id="page-interventions">
            <h2 class="page-title">干预记录</h2>
            <div class="banner warn" style="margin-bottom: 12px">
              这些记录永久保存。给余额或给饱食度会写入 interventions 表，并改变这两个数字；它不会改变饱食度自然下降的规则。
            </div>
            <div class="row" style="margin-bottom: 10px">
              <span class="small muted">按 Agent 筛选</span>
              <select id="intFilter"></select>
            </div>
            <div id="intTable"></div>
          </section>

          <section class="page" id="page-settings">
            <h2 class="page-title">设置</h2>
            <div id="settingsBox"></div>
          </section>
        </div>
      </div>
    </div>

    <dialog id="dlg">
      <div class="dlg-wrap">
        <div class="dlg-head">
          <span class="dot" id="dlgDot"></span>
          <strong class="dlg-name" id="dlgName">—</strong>
          <span class="small muted" id="dlgState">—</span>
          <span class="dlg-sat"><span class="bar"><span id="dlgBar" style="width: 0"></span></span><span class="small num" id="dlgSat">—</span></span>
          <span class="small muted">余额</span><span class="small num" id="dlgBal">—</span>
          <span class="grow"></span>
          <button class="btn" data-act="wake" id="dlgWake">立即唤醒</button>
          <button class="btn icon" data-act="dlg-close" title="关闭">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>
        <div class="dlg-tabs" id="dlgTabs"></div>
        <div class="dlg-body">
          <section class="pane split" id="pane-life">
            <div class="pane-col">
              <div class="row">
                <span class="small muted">加载最近</span>
                <button class="btn tiny" data-act="life-range" data-range="5">5</button>
                <button class="btn tiny" data-act="life-range" data-range="20">20</button>
                <button class="btn tiny" data-act="life-range" data-range="50">50</button>
                <span class="grow"></span>
                <button class="btn tiny" data-act="life-refresh">刷新</button>
              </div>
              <div class="list" id="roundList"></div>
            </div>
            <div class="pane-col" id="roundDetail"></div>
          </section>

          <section class="pane" id="pane-body">
            <div class="pane-col" id="bodyPane"></div>
          </section>

          <section class="pane split" id="pane-memory">
            <div class="pane-col">
              <div class="small muted" id="memStats"></div>
              <div class="mem-body" id="memoryText"></div>
            </div>
            <div class="pane-col">
              <div class="small muted">最近几次记忆整合</div>
              <div class="list" id="memRecords"></div>
              <div id="memCompare"></div>
            </div>
          </section>

          <section class="pane split" id="pane-notebook">
            <div class="pane-col">
              <div class="small muted">记事本文件</div>
              <div class="list" id="nbFiles"></div>
            </div>
            <div class="pane-col">
              <pre id="nbContent" class="mono"></pre>
            </div>
          </section>

          <section class="pane" id="pane-messages">
            <div class="chat">
              <div class="small muted">留言是它世界里的事件，不是命令。</div>
              <div class="chat-list" id="chatList"></div>
              <div class="chat-input">
                <input id="chatInput" data-enter="send-message" placeholder="给这个 Agent 留言…" />
                <button class="btn primary" data-act="send-message">发送</button>
              </div>
            </div>
          </section>

          <section class="pane" id="pane-tasks">
            <div class="pane-col" id="agentTasks"></div>
          </section>

          <section class="pane" id="pane-interventions">
            <div class="pane-col" id="agentInt"></div>
          </section>
        </div>
      </div>
    </dialog>

    <script>
      // ------------------------------------------------------------- helpers
      const $ = (id) => document.getElementById(id);
      const esc = (value) =>
        String(value === null || value === undefined ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      const num = (value, digits) =>
        typeof value === "number" && Number.isFinite(value) ? value.toFixed(digits === undefined ? 2 : digits) : "—";
      const fullTime = (at) => (at ? new Date(at).toLocaleString("zh-CN") : "—");
      const relTime = (at) => {
        if (!at) return "—";
        const diff = Date.now() - at;
        if (diff < 5000) return "刚刚";
        const seconds = Math.floor(diff / 1000);
        if (seconds < 60) return seconds + " 秒前";
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return minutes + " 分钟前";
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return hours + " 小时前";
        return Math.floor(hours / 24) + " 天前";
      };
      const timeHtml = (at) => (at ? `<span title="${esc(fullTime(at))}">${esc(relTime(at))}</span>` : "—");
      const durText = (ms) => {
        if (typeof ms !== "number" || !Number.isFinite(ms) || ms < 0) return "—";
        const seconds = Math.round(ms / 1000);
        if (seconds < 60) return seconds + " 秒";
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return minutes + " 分 " + (seconds % 60) + " 秒";
        const hours = Math.floor(minutes / 60);
        return hours + " 小时 " + (minutes % 60) + " 分";
      };
      const firstLines = (text, count) =>
        String(text === null || text === undefined ? "" : text)
          .split("\n")
          .map((line) => line.trim())
          .filter((line) => line !== "")
          .slice(0, count)
          .join("\n");
      const ratioOf = (value, max) =>
        typeof value === "number" && typeof max === "number" && max > 0 ? Math.max(0, Math.min(1, value / max)) : 0;
      const satietyColor = (ratio) => (ratio >= 0.6 ? "var(--accent)" : ratio >= 0.3 ? "var(--warn)" : "var(--danger)");
      function withScroll(node, paint) {
        const top = node.scrollTop;
        const left = node.scrollLeft;
        paint();
        node.scrollTop = top;
        node.scrollLeft = left;
      }

      // --------------------------------------------------------------- api
      async function api(path, options) {
        const response = await fetch(path, options);
        const body = await response.json().catch(() => ({ ok: false, error: "返回不是 JSON" }));
        if (!response.ok || body.ok === false) {
          throw new Error(body.error || "请求失败");
        }
        return body;
      }
      const post = (path, payload) =>
        api(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload) });
      const alertError = (error) => alert(error instanceof Error ? error.message : String(error));

      // ------------------------------------------------------------- tables
      const PAGES = ["agents", "tasks", "income", "interventions", "settings"];
      const TABS = [
        { id: "life", label: "生命动态" },
        { id: "body", label: "身体" },
        { id: "memory", label: "记忆" },
        { id: "notebook", label: "记事本" },
        { id: "messages", label: "留言" },
        { id: "tasks", label: "任务" },
        { id: "interventions", label: "干预记录" },
      ];
      const END_REASON = {
        final: "正常结束",
        context_cap: "上下文超限",
        iteration_cap: "工具调用超限",
        usage_missing: "用量缺失",
        model_error: "模型出错",
      };
      const MEM_KIND = {
        memory_new: "记忆已更新",
        memory_rejected: "记忆被拒绝",
        memory_error: "记忆模型出错",
        usage_missing: "记忆用量缺失",
      };
      const EVENT_LABEL = {
        meal: "进食",
        meal_refused: "进食被拒（余额不足）",
        task_claimed: "认领任务",
        task_submitted: "提交任务",
        income_reported: "申报收入",
        message_to_operator: "给操作员留言",
        worker_log: "子进程日志",
        worker_note: "子进程消息",
        claim_expired: "任务认领超时",
        worker_problem: "子进程异常",
        round_failed: "本轮执行失败",
        agent_created: "Agent 被创建",
        intervention: "操作员干预",
      };
      const TASK_STATUS = {
        open: "开放",
        claimed: "已认领",
        submitted: "待审核",
        accepted: "已接受",
        rejected: "已拒绝",
        rework: "返工中",
      };
      const INTERVENTION_KIND = { give_balance: "给予余额", give_satiety: "给予饱食度" };
      const taskTagClass = (status) =>
        status === "accepted" ? "tag ok" : status === "rejected" ? "tag bad" : status === "submitted" ? "tag warn" : "tag";

      // -------------------------------------------------------------- state
      let state = null;
      let refreshError = null;
      let refreshing = false;
      let dlgAgent = null;
      let dlgTab = "life";
      let lifeRange = 5;
      let roundSel = null;
      let roundCache = { agent: null, range: null, rounds: [] };
      let memSel = null;
      let memCache = { agent: null, memory: "", records: [] };
      let nbCache = { agent: null, files: [], path: null, content: "" };
      let nbLoading = false;
      let extras = {};
      let taskFilter = "all";
      let taskSel = null;
      let incomeSel = null;
      let incomeKey = null;
      let intFilter = "";
      let settingsKey = null;
      let loadedRoundAt = {};
      const slotDrafts = {};
      const readMarks = new Set(loadReadMarks());
      const dismissedNotices = new Set();
      // A message id alone would collide with a ledger that was recreated, so the
      // mark also carries the instant the message was written.
      const markOf = (message) => `${message.id}:${message.at}`;

      function loadReadMarks() {
        try {
          const raw = window.localStorage.getItem("conservatory.console.readMessages");
          const parsed = raw === null ? [] : JSON.parse(raw);
          return Array.isArray(parsed) ? parsed.filter((mark) => typeof mark === "string") : [];
        } catch (error) {
          return [];
        }
      }
      function saveReadMarks() {
        try {
          const marks = Array.from(readMarks).slice(-800);
          window.localStorage.setItem("conservatory.console.readMessages", JSON.stringify(marks));
        } catch (error) {
          /* a console without storage still works, it just forgets the read marks */
        }
      }

      // ------------------------------------------------------------ derived
      const agentByName = (name) =>
        state === null || name === null ? null : state.agents.find((agent) => agent.name === name) || null;
      const aliveAgents = () => (state === null ? [] : state.agents.filter((agent) => agent.status === "alive"));
      const messagesFor = (name) => (state === null ? [] : state.messages.filter((m) => m.sender === name || m.recipient === name));
      const unreadFor = (name) =>
        messagesFor(name).filter((m) => m.sender === name && m.readAt === null && !readMarks.has(markOf(m))).length;
      const unreadTotal = () =>
        state === null ? 0 : state.agents.reduce((sum, agent) => sum + unreadFor(agent.name), 0);
      const pendingSubmissions = () => (state === null ? 0 : state.tasks.filter((t) => t.status === "submitted").length);
      const pendingIncome = () => (state === null ? 0 : state.income.filter((r) => r.status === "pending").length);
      const noticeKey = (notice) => `${notice.agent}|${notice.at}|${notice.message}`;
      const liveNotices = () => (state === null ? [] : state.notices.filter((n) => !dismissedNotices.has(noticeKey(n))));
      const noticesFor = (name) => liveNotices().filter((n) => n.agent === name);
      const freeSlots = () => (state === null ? 0 : Math.max(0, state.config.maxSlots - aliveAgents().length));

      // ------------------------------------------------------------ routing
      function parseHash() {
        const raw = String(window.location.hash || "").replace(/^#\/?/, "");
        const parts = raw.split("/").filter((part) => part !== "").map(decodeURIComponent);
        const page = PAGES.indexOf(parts[0]) >= 0 ? parts[0] : "agents";
        const agent = page === "agents" && parts.length >= 2 && parts[1] !== "" ? parts[1] : null;
        const tab = TABS.some((t) => t.id === parts[2]) ? parts[2] : "life";
        return { page, agent, tab };
      }
      function navigate(hash) {
        if (window.location.hash === hash) {
          applyRoute();
        } else {
          window.location.hash = hash;
        }
      }
      function applyRoute() {
        const route = parseHash();
        for (const page of PAGES) {
          $(`page-${page}`).classList.toggle("active", page === route.page);
        }
        document.querySelectorAll(".nav-item").forEach((item) => {
          item.classList.toggle("active", item.dataset.page === route.page);
        });
        const known = route.agent !== null && state !== null && agentByName(route.agent) !== null;
        if (known) {
          openAgentUi(route.agent, route.tab);
        } else if ($("dlg").open) {
          // Clear the owner before closing: the close handler must not fight the
          // route that is being navigated to (for example #/tasks).
          dlgAgent = null;
          $("dlg").close();
        }
      }
      function openAgentUi(name, tab) {
        const chosen = TABS.some((t) => t.id === tab) ? tab : "life";
        if (dlgAgent !== name) {
          dlgAgent = name;
          roundSel = null;
          memSel = null;
          nbCache = { agent: null, files: [], path: null, content: "" };
          roundCache = { agent: null, range: null, rounds: [] };
          memCache = { agent: null, memory: "", records: [] };
          resetAgentPanes();
          // Remember where the agent stood when the dialog opened; only a fetch
          // may move this marker forward, otherwise a poll would hide new rounds.
          const opened = agentByName(name);
          loadedRoundAt[name] = opened === null ? undefined : opened.lastRoundAt;
        }
        const tabChanged = dlgTab !== chosen;
        dlgTab = chosen;
        if (!$("dlg").open) $("dlg").showModal();
        paintDialogTabs();
        paintDialogHeader();
        paintPanes();
        void loadTab(dlgTab, tabChanged);
      }
      const openAgent = (name, tab) => navigate(`#/agents/${encodeURIComponent(name)}/${tab || "life"}`);
      const closeAgent = () => navigate("#/agents");
      const goPage = (page) => navigate(`#/${page}`);

      // ------------------------------------------------------------- paints
      function paint() {
        paintNav();
        paintRailFoot();
        paintNotices();
        paintAgentsPage();
        paintTasksPage();
        paintIncomePage();
        paintInterventionsPage();
        paintSettingsPage();
        paintDialogHeader();
        paintPanes();
      }
      function paintNav() {
        const counts = { agents: unreadTotal(), tasks: pendingSubmissions(), income: pendingIncome() };
        for (const key of Object.keys(counts)) {
          const badge = document.querySelector(`[data-badge="${key}"]`);
          if (badge === null) continue;
          const value = counts[key];
          badge.hidden = value === 0;
          badge.textContent = value > 99 ? "99+" : String(value);
        }
      }
      function paintRailFoot() {
        if (state === null) return;
        const busy = state.agents.filter((agent) => agent.busy).length;
        const host = $("railFoot");
        host.innerHTML =
          `<div>存活 Agent：<strong>${aliveAgents().length}</strong> / 槽位上限 <strong>${state.config.maxSlots}</strong></div>` +
          `<div>正在一轮中：<strong>${busy}</strong></div>` +
          `<div>每 3 秒刷新 · ${esc(new Date().toLocaleTimeString("zh-CN"))}</div>` +
          (refreshError === null
            ? ""
            : `<div style="color: var(--danger)">刷新失败：${esc(refreshError)}</div>`);
      }
      function paintNotices() {
        const list = liveNotices().slice(-8).reverse();
        const host = $("notices");
        if (list.length === 0) {
          host.innerHTML = "";
          return;
        }
        host.innerHTML = list
          .map(
            (notice) =>
              `<div class="notice"><span><b>${esc(notice.agent)}</b> · ${timeHtml(notice.at)} · ${esc(notice.message)}</span>` +
              `<button class="btn tiny close" data-act="notice-close" data-key="${esc(noticeKey(notice))}">知道了</button></div>`,
          )
          .join("");
      }

      // ---------------------------------------------------- agents page
      function agentCardHtml(agent) {
        const ratio = ratioOf(agent.satiety, agent.satietyMax);
        const extra = extras[agent.name] || null;
        const noticeCount = noticesFor(agent.name).length;
        const unread = unreadFor(agent.name);
        const reply = extra !== null && extra.finalReply ? firstLines(extra.finalReply, 2) : "";
        return `
          <article class="card agent-card" data-act="open-agent" data-agent="${esc(agent.name)}">
            <div class="card-head">
              <span class="dot ${agent.busy ? "busy" : ""}"></span>
              <span class="card-name">${esc(agent.name)}</span>
              <span class="grow"></span>
              ${noticeCount > 0 ? '<span class="tag warn">提示</span>' : ""}
              ${unread > 0 ? `<span class="badge">${unread > 99 ? "99+" : unread}</span>` : ""}
            </div>
            <div class="bar"><span style="width: ${(ratio * 100).toFixed(1)}%; background: ${satietyColor(ratio)}"></span></div>
            <div class="kv" style="margin-top: 7px"><span class="k">饱食度</span><span class="num">${esc(num(agent.satiety))} / ${esc(num(agent.satietyMax))}</span></div>
            <div class="kv"><span class="k">余额</span><span class="num">${esc(num(agent.balance))}</span></div>
            <div class="kv"><span class="k">上次唤醒</span><span>${timeHtml(agent.lastWakeAt)}</span></div>
            <div class="kv"><span class="k">模型</span><span class="mono small">${esc(agent.model)}</span></div>
            <div class="card-reply">${
              reply === ""
                ? agent.busy
                  ? "正在一轮中…"
                  : "最近一轮：还没有完成过一轮"
                : "最近一轮：" + esc(reply)
            }</div>
          </article>`;
      }
      function paintAgentsPage() {
        if (state === null) return;
        const host = $("agentCards");
        const cards =
          state.agents.length === 0
            ? '<div class="empty">还没有活着的 Agent。请在空槽位里创建一个。</div>'
            : state.agents.map(agentCardHtml).join("");
        withScroll(host, () => {
          host.innerHTML = cards;
        });
        syncSlotCards();
      }
      function syncSlotCards() {
        const host = $("slotCards");
        const free = freeSlots();
        while (host.children.length > free) {
          const removed = host.lastElementChild;
          const removedInput = removed === null ? null : removed.querySelector("input[data-slot]");
          if (removedInput !== null) delete slotDrafts[removedInput.dataset.slot];
          host.removeChild(removed);
        }
        while (host.children.length < free) {
          const index = host.children.length;
          const card = document.createElement("article");
          card.className = "card slot-card";
          card.innerHTML =
            `<div class="slot-title">空槽位</div>` +
            `<input data-slot="${index}" data-enter="slot-create" value="${esc(slotDrafts[index] || "")}" placeholder="名字：小写字母/数字/下划线" />` +
            `<div class="row"><button class="btn primary" data-act="slot-create" data-slot="${index}">创建</button>` +
            `<span class="small muted">名字只允许小写字母、数字、下划线</span></div>`;
          host.appendChild(card);
        }
        for (const input of host.querySelectorAll("input[data-slot]")) {
          slotDrafts[input.dataset.slot] = input.value;
        }
      }

      // ------------------------------------------------- tasks page
      function visibleTasks() {
        if (state === null) return [];
        if (taskFilter === "all") return state.tasks;
        if (taskFilter === "claimed") return state.tasks.filter((t) => t.status === "claimed" || t.status === "rework");
        if (taskFilter === "closed") return state.tasks.filter((t) => t.status === "accepted" || t.status === "rejected");
        return state.tasks.filter((t) => t.status === taskFilter);
      }
      function paintTasksPage() {
        if (state === null) return;
        const filters = [
          ["all", "全部"],
          ["open", "开放"],
          ["claimed", "已认领"],
          ["submitted", "待审核"],
          ["closed", "已结束"],
        ];
        const host = $("taskFilters");
        if (host.dataset.built !== "1") {
          host.dataset.built = "1";
          host.innerHTML = filters
            .map(([id, label]) => `<button class="btn tiny" data-act="task-filter" data-filter="${id}">${label}</button>`)
            .join("");
        }
        for (const button of host.querySelectorAll("button[data-filter]")) {
          button.classList.toggle("active", button.dataset.filter === taskFilter);
        }
        const tasks = visibleTasks();
        if (taskSel === null || !tasks.some((task) => task.id === taskSel)) {
          taskSel = tasks.length > 0 ? tasks[0].id : null;
        }
        const list = $("taskList");
        withScroll(list, () => {
          list.innerHTML =
            tasks.length === 0
              ? '<div class="empty small">没有符合条件的任务。</div>'
              : tasks
                  .map(
                    (task) => `
                      <div class="list-item ${task.id === taskSel ? "active" : ""}" data-act="task-select" data-task="${esc(task.id)}">
                        <div class="row"><span class="title grow">${esc(task.title)}</span><span class="${taskTagClass(task.status)}">${esc(TASK_STATUS[task.status] || task.status)}</span><span class="tag">${esc(num(task.price))}</span></div>
                        <div class="sub">${esc(task.id)} · 认领：${esc(task.claimedBy || "—")}</div>
                      </div>`,
                  )
                  .join("");
        });
        paintTaskDetail();
      }
      function paintTaskDetail() {
        const host = $("taskDetail");
        const task = state === null || taskSel === null ? null : state.tasks.find((t) => t.id === taskSel) || null;
        if (task === null) {
          host.innerHTML = '<div class="empty small">左边选一个任务看详情。</div>';
          return;
        }
        const review =
          task.status === "submitted"
            ? `<div class="row">
                 <button class="btn primary" data-act="task-review" data-task="${esc(task.id)}" data-decision="accept">接受并付款</button>
                 <button class="btn danger" data-act="task-review" data-task="${esc(task.id)}" data-decision="reject">拒绝（不付款）</button>
                 <button class="btn" data-act="task-review" data-task="${esc(task.id)}" data-decision="rework">返工</button>
                 <button class="btn" data-act="task-review" data-task="${esc(task.id)}" data-decision="return">退回任务板</button>
               </div>`
            : `<div class="small muted">这个任务当前没有可用的审核操作。</div>`;
        host.innerHTML = `
          <div class="card col-stack">
            <div class="row"><strong style="font-size: 15px">${esc(task.title)}</strong><span class="${taskTagClass(task.status)}">${esc(TASK_STATUS[task.status] || task.status)}</span><span class="tag">${esc(num(task.price))}</span></div>
            <div class="small muted">${esc(task.id)} · 创建 ${timeHtml(task.createdAt)} · 认领者 ${esc(task.claimedBy || "—")}</div>
            <div class="small muted">认领 ${timeHtml(task.claimedAt)} · 提交 ${timeHtml(task.submittedAt)} · 裁定 ${timeHtml(task.decidedAt)}${task.decision ? "（" + esc(task.decision) + "）" : ""}</div>
            <div><div class="small muted">描述</div><div style="white-space: pre-wrap">${esc(task.description)}</div></div>
            <div>
              <div class="small muted">交付内容</div>
              <pre class="mono">${esc(task.deliverable === null || task.deliverable === undefined ? "（还没有交付）" : task.deliverable)}</pre>
            </div>
            ${review}
          </div>`;
      }

      function repaint(host, html) {
        const parent = host.parentElement;
        const top = host.scrollTop;
        const parentTop = parent === null ? 0 : parent.scrollTop;
        host.innerHTML = html;
        host.scrollTop = top;
        if (parent !== null) parent.scrollTop = parentTop;
      }

      // ------------------------------------------------- income page
      function incomeSorted() {
        if (state === null) return [];
        return state.income
          .slice()
          .sort(
            (a, b) =>
              (a.status === "pending" ? 0 : 1) - (b.status === "pending" ? 0 : 1) || Number(b.id) - Number(a.id),
          );
      }
      function paintIncomePage() {
        if (state === null) return;
        const rateWarn = $("rateWarn");
        rateWarn.innerHTML =
          state.exchangeRate === null
            ? '<div class="banner danger">汇率未设定：收入申报无法核验入账。请在 conservatory.config.json 里设置 exchangeRate。</div>'
            : "";
        const reports = incomeSorted();
        if (incomeSel === null || !reports.some((report) => report.id === incomeSel)) {
          incomeSel = reports.length > 0 ? reports[0].id : null;
          incomeKey = null;
        }
        const list = $("incomeList");
        repaint(
          list,
          reports.length === 0
            ? '<div class="empty small">还没有收入申报。</div>'
            : reports
                .map(
                  (report) => `
                    <div class="list-item ${report.id === incomeSel ? "active" : ""}" data-act="income-select" data-report="${report.id}">
                      <div class="row"><span class="title grow">${esc(report.agent)}</span><span class="${report.status === "pending" ? "tag warn" : report.status === "credited" ? "tag ok" : "tag bad"}">${esc(report.status === "pending" ? "待核验" : report.status === "credited" ? "已入账" : "已驳回")}</span></div>
                      <div class="sub">${esc(report.where)} · ${esc(report.work)} · ${esc(num(report.amount))} ${esc(report.currency)}</div>
                    </div>`,
                )
                .join(""),
        );
        const report = reports.find((row) => row.id === incomeSel) || null;
        const key =
          report === null ? "none" : `${report.id}|${report.status}|${report.credited}|${report.exchangeRate}`;
        if (key !== incomeKey) {
          incomeKey = key;
          $("incomeDetail").innerHTML = incomeDetailHtml(report);
        } else if (report !== null) {
          updateIncomeFields(report);
        }
      }
      function incomeDetailHtml(report) {
        if (report === null) {
          return '<div class="empty small">左边选一条申报看详情。</div>';
        }
        const actions =
          report.status === "pending"
            ? `<div class="row">
                 <input id="verifyAmount" type="number" min="0" step="0.01" value="${esc(report.amount)}" style="width: 140px" />
                 <button class="btn primary" data-act="income-verify">核验并入账</button>
                 <button class="btn danger" data-act="income-reject">驳回</button>
               </div>
               <div class="small muted">在上面填核实金额（核实金额 × 当前汇率 ${
                 state === null || state.exchangeRate === null ? "未设定" : esc(num(state.exchangeRate))
               } = 入账余额）。驳回不入账。</div>`
            : '<div class="small muted">这条申报已经处理过了。</div>';
        return `
          <div class="card col-stack">
            <div class="row"><strong style="font-size: 15px">${esc(report.agent)}</strong><span class="${report.status === "pending" ? "tag warn" : report.status === "credited" ? "tag ok" : "tag bad"}">${esc(report.status === "pending" ? "待核验" : report.status === "credited" ? "已入账" : "已驳回")}</span></div>
            <div class="small muted">申报编号 ${report.id} · 提交 ${timeHtml(report.createdAt)} · 处理 ${timeHtml(report.decidedAt)}</div>
            <div><div class="small muted">来源</div><div data-f="where">${esc(report.where)}</div></div>
            <div><div class="small muted">做了什么</div><div data-f="work" style="white-space: pre-wrap">${esc(report.work)}</div></div>
            <div class="kv"><span class="k">申报金额</span><span class="num" data-f="amount">${esc(num(report.amount))} ${esc(report.currency)}</span></div>
            <div class="kv"><span class="k">核实金额</span><span class="num" data-f="verified">${esc(report.verifiedAmount === null ? "—" : num(report.verifiedAmount))}</span></div>
            <div class="kv"><span class="k">汇率</span><span class="num" data-f="rate">${esc(report.exchangeRate === null ? "未设定" : num(report.exchangeRate))}</span></div>
            <div class="kv"><span class="k">入账余额</span><span class="num" data-f="credited">${esc(report.credited === null ? "—" : num(report.credited))}</span></div>
            ${actions}
          </div>`;
      }
      function updateIncomeFields(report) {
        const set = (field, text) => {
          const node = document.querySelector(`[data-f="${field}"]`);
          if (node !== null) node.textContent = text;
        };
        set("where", report.where);
        set("work", report.work);
        set("amount", `${num(report.amount)} ${report.currency}`);
        set("verified", report.verifiedAmount === null ? "—" : num(report.verifiedAmount));
        set("rate", report.exchangeRate === null ? "未设定" : num(report.exchangeRate));

          ["一餐恢复", esc(num(config.satietyPerMeal)) + " 饱食度"],

          <div class="small muted" style="margin-top: 10px">配置来自 conservatory.config.json，这里是只读展示；改动请直接改文件后重启。</div>`;
      }

      // ---------------------------------------------------- dialog chrome
      function paintDialogTabs() {
        const host = $("dlgTabs");
        if (host.dataset.built !== "1") {
          host.dataset.built = "1";
          host.innerHTML = TABS.map(
            (tab) => `<button class="tab" data-act="dlg-tab" data-tab="${tab.id}">${esc(tab.label)}</button>`,
          ).join("");
        }
        for (const button of host.querySelectorAll("button[data-tab]")) {

        }
        for (const tab of TABS) {

      }
      function paintDialogHeader() {
        const agent = agentByName(dlgAgent);
        if (agent === null) {
          $("dlgName").textContent = "—";
          $("dlgState").textContent = "—";
          $("dlgSat").textContent = "—";
          $("dlgBal").textContent = "—";
          $("dlgBar").style.width = "0";
          return;
        }
        const ratio = ratioOf(agent.satiety, agent.satietyMax);

        $("dlgState").textContent = agent.busy ? "一轮中" : "空闲";

        $("dlgSat").title = `${num(agent.satiety)} / ${num(agent.satietyMax)}`;

        $("dlgWake").dataset.agent = agent.name;
        $("chatInput").placeholder = `给 ${agent.name} 留言…`;
      }
      function resetAgentPanes() {
        // Nothing of the previous agent may stay on screen while the new agent's
        // data is still in flight.
        for (const id of ["memoryText", "memRecords", "memCompare", "nbFiles", "roundList", "roundDetail", "bodyPane", "agentTasks", "agentInt", "chatList"]) {
          const node = $(id);
          node.innerHTML = "";
          node.dataset.key = "";
        }
        $("memStats").textContent = "";
        $("nbContent").textContent = "";
      }
      function paintPanes() {
        if (dlgAgent === null) return;
        if (dlgTab === "life") {
          paintRoundList();
          paintRoundDetail();
        } else if (dlgTab === "body") {
          paintBody();
        } else if (dlgTab === "memory") {
          paintMemory();
        } else if (dlgTab === "notebook") {
          paintNotebook();
        } else if (dlgTab === "messages") {
